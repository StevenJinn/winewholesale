<style>

  /* ══ WINE CLASSIFICATION / APPELLATION TIER SYSTEM ══
     Premier (Grand) Cru Classé → Cru Classé → Grand Cru → Cru Bourgeois/1er Cru
     → DOCG/DOC/AOC → IGT/IGP → Vin de France. Only the top two prestige bands
     pulse (rare on any given screen) — everything else is a static glow so
     large result lists stay smooth. */
  .wr-tier-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-family:'Prompt',sans-serif;font-size:8.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    padding:2.5px 8px;border-radius:5px;border:1px solid;
  }
  .wr-tier-badge .wr-tier-dot{ width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor;flex-shrink:0; }
  .wr-tier-legendary{
    color:#fff3d6;border-color:rgba(255,207,107,.75);
    background:linear-gradient(135deg,rgba(255,207,107,.32),rgba(255,150,60,.20));
    text-shadow:0 0 8px rgba(255,215,140,.9),0 0 18px rgba(255,180,90,.5);
    box-shadow:0 0 10px rgba(255,200,110,.4),inset 0 0 8px rgba(255,220,150,.18);
    animation:wrTierLegendaryGlow 2.4s ease-in-out infinite;
  }
  @keyframes wrTierLegendaryGlow{
    0%,100%{ box-shadow:0 0 8px rgba(255,200,110,.32),inset 0 0 6px rgba(255,220,150,.14); }
    50%{ box-shadow:0 0 18px rgba(255,207,107,.65),inset 0 0 12px rgba(255,225,160,.26); }
  }
  .wr-tier-grand{
    color:#f2e8ff;border-color:rgba(199,138,255,.65);
    background:linear-gradient(135deg,rgba(199,138,255,.24),rgba(140,70,220,.14));
    text-shadow:0 0 7px rgba(210,160,255,.7);
    box-shadow:0 0 9px rgba(199,138,255,.32),inset 0 0 6px rgba(210,160,255,.14);
    animation:wrTierGrandGlow 3s ease-in-out infinite;
  }
  @keyframes wrTierGrandGlow{
    0%,100%{ box-shadow:0 0 7px rgba(199,138,255,.26),inset 0 0 5px rgba(210,160,255,.1); }
    50%{ box-shadow:0 0 14px rgba(199,138,255,.5),inset 0 0 9px rgba(210,160,255,.2); }
  }
  .wr-tier-elevated{
    color:#dcecff;border-color:rgba(77,163,255,.55);
    background:linear-gradient(135deg,rgba(77,163,255,.18),rgba(40,120,220,.09));
    text-shadow:0 0 6px rgba(120,180,255,.55);
    box-shadow:0 0 7px rgba(77,163,255,.24);

  .wr-tier-classified{
    color:#a8f5e2;border-color:rgba(18,218,176,.42);
    background:linear-gradient(135deg,rgba(18,218,176,.16),rgba(10,160,130,.06));
    box-shadow:0 0 5px rgba(18,218,176,.16);
  }
  .wr-tier-regional{
    color:#c3ccec;border-color:rgba(159,176,217,.35);

<style>
  #wr-detail-frame{ --wr-detail-accent:#4bcffa; }
  .wr-detail-corner{ position:absolute;width:12px;height:12px;z-index:6;pointer-events:none; }
  .wr-detail-corner.tl{ top:6px;left:6px;border-top:2px solid var(--wr-detail-accent);border-left:2px solid var(--wr-detail-accent);opacity:.9 }
  .wr-detail-corner.tr{ top:6px;right:6px;border-top:2px solid var(--wr-detail-accent);border-right:2px solid var(--wr-detail-accent);opacity:.6 }
  .wr-detail-corner.bl{ bottom:6px;left:6px;border-bottom:2px solid var(--wr-detail-accent);border-left:2px solid var(--wr-detail-accent);opacity:.4 }
  .wr-detail-corner.br{ bottom:6px;right:6px;border-bottom:2px solid var(--wr-detail-accent);border-right:2px solid var(--wr-detail-accent);opacity:.25 }

  /* ══ ambient circuit-trace field — faint animated grid behind the sheet content.
     A real element (not ::before) because legendary-tier wines already use #wr-detail-frame::before/::after
     for their gold corner flourish — a pseudo-element here would collide with that, higher-specificity rule.
     Animates via transform only (GPU-composited), not background-position (which forces a repaint every frame). ══ */
  .wr-grid-drift{
    position:absolute;top:-30px;left:-30px;right:-30px;bottom:-30px;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(var(--wr-detail-accent-rgb,75,207,250),.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(var(--wr-detail-accent-rgb,75,207,250),.05) 1px,transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 62%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 62%);
    animation:wrGridDrift 14s linear infinite;
    will-change:transform;
  }
  @keyframes wrGridDrift{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(26px,26px,0); } }
  #wr-detail-body{ z-index:1; }

  /* ══ boot-sequence stagger — each block of the sheet powers on in sequence ══
     [FIX 2026-07-29] this used to also animate filter:blur(3px→0). filter is not
     compositor-only like transform/opacity — the browser has to repaint every animated
     element on every single frame while it's interpolating. With ~10-15 .wr-boot-item
     blocks all staggered-animating at once, every card open/swipe forced that many
     full repaints per frame for ~0.5s, at the exact same time the card itself is
     sliding in via transform — that's what showed up as the persistent stutter/lag.
     Dropping filter and keeping only transform+opacity makes the whole sequence
     compositor-only, matching the fix already applied to the peek-card blur above. */
  @keyframes wrBootIn{
    0%{ opacity:0; transform:translateY(11px) scale(.97); }
    100%{ opacity:1; transform:none; }
  }
  .wr-boot-item{ animation:wrBootIn .22s cubic-bezier(.22,.9,.24,1) both; }

  /* ══ signal-bar cluster — link-strength readout that snaps up beside the sysID ══ */

function showToast(msg, type="ok") {

// ── barcode rendering via JsBarcode ──────────────────────
function _drawBarcode(canvas) {
  if (canvas._bcDrawn) return;
  const code = canvas.getAttribute("data-barcode");
  if (!code) return;
  const bcSize = canvas.getAttribute("data-bc-large");
  const isLarge = bcSize === "1";
  const isMedium = bcSize === "md";
  const bcWidth = isLarge ? 2.6 : isMedium ? 2.1 : 2;
  const bcHeight = isLarge ? 72 : isMedium ? 56 : 52;
  const bcFontSize = isLarge ? 17 : isMedium ? 14 : 14;
  try {
    const isAllDigits = /^[0-9]+$/.test(code);
    let fmt = "CODE128";
    if (isAllDigits && code.length === 13) fmt = "EAN13";
    else if (isAllDigits && code.length === 8) fmt = "EAN8";
    JsBarcode(canvas, code, { format:fmt, width:bcWidth, height:bcHeight, displayValue:true,
      fontSize:bcFontSize, textMargin:4, font:"Prompt,sans-serif", margin:6,
      background:"#ffffff", lineColor:"#111111" });
    canvas._bcDrawn = true;
  } catch(e) {
    try {
      JsBarcode(canvas, code, { format:"CODE128", width:bcWidth, height:bcHeight, displayValue:true,
        fontSize:bcFontSize, textMargin:4, font:"Prompt,sans-serif", margin:6,
        background:"#ffffff", lineColor:"#111111" });
      canvas._bcDrawn = true;
    } catch(e2) {}
  }
}

// ── [PERF FIX] หยุด glitch animation บน barcode canvas ที่อยู่นอก viewport ──
// ป้องกันแอปกระตุกเมื่อมีรายการเยอะ (animation infinite ทุกการ์ดรันพร้อมกัน)
let _glitchVisbObs = null;
function _initGlitchVisibilityObserver(){
  if(_glitchVisbObs) return;
  _glitchVisbObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      // หยุด/เล่น animation ตาม visibility — ลดภาระ compositor
      e.target.style.animationPlayState = e.isIntersecting ? 'running' : 'paused';
    });
  }, { rootMargin: '100px' });
}
function _observeGlitchCanvas(container){
  _initGlitchVisibilityObserver();
  const scope = container || document;
  scope.querySelectorAll('canvas[data-barcode]').forEach(c=>{
    if(!c._glitchObserved){ c._glitchObserved=true; _glitchVisbObs.observe(c); }
  });
}

let _bcObserver = null;
// [PERF FIX 2026-07-27] draw barcodes in small batches instead of all-at-once —
// on the wholesale list (60 cards rendered together, rootMargin 800px) nearly every
// canvas intersects on first paint, so the old code ran _drawBarcode() for all of them
// back-to-back inside one IntersectionObserver callback. JsBarcode is a real synchronous
// canvas render per card, so that became one long main-thread task — any tap during it
// (e.g. opening a card's detail sheet) sat queued behind it and only responded once every
// card had finished. Queueing + chunking across idle slices keeps each task short so taps
// stay responsive while the rest of the list keeps drawing in the background.
let _bcQueue = [];
const _bcQueued = new Set();
let _bcQueueScheduled = false;
const _bcBatchSize = 4; // canvases drawn per idle slice
function _bcEnqueue(canvas) {
  if (!canvas || canvas._bcDrawn || _bcQueued.has(canvas)) return;
  _bcQueued.add(canvas);
  _bcQueue.push(canvas);
}
function _bcProcessQueueBatch(deadline) {
  _bcQueueScheduled = false;
  let n = 0;
  while (_bcQueue.length && (n < _bcBatchSize || (deadline && deadline.timeRemaining && deadline.timeRemaining() > 4))) {
    const canvas = _bcQueue.shift();
    _bcQueued.delete(canvas);
    if (!canvas.isConnected) { if (_bcObserver) _bcObserver.unobserve(canvas); if (_glitchVisbObs) _glitchVisbObs.unobserve(canvas); continue; } // card was removed/re-rendered before its turn

}

// [FIX] barcode not drawing on fast scroll: IntersectionObserver callbacks can be delayed
// or coalesced by the browser during fast/momentum scrolling (especially on iOS Safari),
// so a canvas can end up fully on-screen without ever having received an intersection
// callback. We now (1) use a much larger rootMargin so canvases are drawn well before
// they're actually visible, and (2) run a direct "sweep" of any undrawn canvases against
// the scroll container's viewport on every scroll — this sweep doesn't depend on the
// observer firing at all, so it can't be missed by a fast fling. Both paths enqueue rather
// than draw immediately, so a burst of newly-visible canvases doesn't stall the main thread.
function _bcSweepContainer(scrollEl) {
  if (!scrollEl) return;
  const rect = scrollEl.getBoundingClientRect();
  const top = rect.top - 800, bottom = rect.bottom + 800; // generous buffer either side
  scrollEl.querySelectorAll('canvas[data-barcode]').forEach(canvas => {
    if (canvas._bcDrawn) return;
    const cr = canvas.getBoundingClientRect();
    if (cr.bottom >= top && cr.top <= bottom) {

    }

}
function _bcAttachScrollSweep(scope) {
  if (!scope || scope.nodeType !== 1) return;
  // find nearest scrollable ancestor (falls back to the element itself)
  let scrollEl = scope;
  while (scrollEl && scrollEl !== document.body) {
    const cs = getComputedStyle(scrollEl);
    if (/(auto|scroll)/.test(cs.overflowY)) break;
    scrollEl = scrollEl.parentElement;
  }
  if (!scrollEl) scrollEl = scope;
  if (scrollEl._bcSweepAttached) return;
  scrollEl._bcSweepAttached = true;
  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { _bcSweepContainer(scrollEl); ticking = false; });
  };
  scrollEl.addEventListener('scroll', onScroll, { passive: true });

  let scrollEndTimer = null;
  scrollEl.addEventListener('scroll', () => {

}
// [FIX] both barcode canvas observers (_bcObserver for the draw-queue, _glitchVisbObs for the
// glitch-pause effect) hold a live reference to every canvas they've ever observed until
// explicitly unobserved — _glitchVisbObs in particular never called unobserve anywhere. Every
// time the product-detail sheet swapped to a new item, its old <canvas> was removed from the DOM
// via innerHTML replacement but stayed forever "watched" by both observers (never garbage
// collected), so IntersectionObserver's own per-callback bookkeeping grew by one detached canvas
// on every single swipe — the more products you browsed in one session, the more it piled up and
// the janker it got. Call this right before discarding any markup that contains barcode canvases.
function _wrReleaseCanvasObservers(scope) {
  if (!scope || !scope.querySelectorAll) return;
  scope.querySelectorAll('canvas[data-barcode]').forEach(c => {
    if (_glitchVisbObs) _glitchVisbObs.unobserve(c);
    if (_bcObserver) _bcObserver.unobserve(c);
    _bcQueued.delete(c);
    const qi = _bcQueue.indexOf(c);

function renderBarcodeCanvases(container) {
  if (!_bcObserver) {

      let any = false;

          any = true;
        }

      // intersecting canvas synchronously here — with a wide rootMargin most/all of a 60-card
      // list can intersect on first paint, and drawing them all in this one callback was a
      // long blocking task that delayed taps (e.g. opening a card's detail sheet) until every
      // card's barcode had finished rendering.
      if (any) _bcScheduleQueue();
    }, { rootMargin: "800px" }); // [FIX] widened from 200px so slow-to-fire callbacks still land well ahead of the viewport
  }
  // observe เฉพาะ canvas ใหม่ที่ยังไม่ได้วาด
  const scope = container || document;
  scope.querySelectorAll("canvas[data-barcode]").forEach(canvas => {
    if (!canvas._bcDrawn) _bcObserver.observe(canvas);

  _observeGlitchCanvas(scope);
  // [FIX] belt-and-braces scroll sweep — catches any canvas the observer missed during a fast scroll
  _bcAttachScrollSweep(scope);
}

function syncQtyHeight(row) {
  if (!row) return;
  const whiteBox = row.querySelector('.bc-white-box');
  const qtyPanel = row.querySelector('.bc-qty-panel');
  const card = row.closest('.rec-card-body') || row;
  const photoPanel = card.querySelector('.rec-photo-panel');
  if (!whiteBox) return;
  const h = whiteBox.offsetHeight + 'px';
  if (qtyPanel) { qtyPanel.style.minHeight = h; qtyPanel.style.height = h; }
  // [FIX 2026-08-20] the wholesale detail-sheet photo (data-wr-fixed-h) is now a flat, constant
  // height set directly in markup (see _wrBuildDetailHTML) so every product's photo is the same
  // size regardless of how much metadata that row has — producer/grapes/classification/label-tier
  // used to stretch it taller for well-documented wines and (via a since-removed height-matching
  // hack here) let it collapse shorter for sparse rows like brand-new excel-import items, so no
  // two products' photos were reliably the same size. Skip those panels entirely; only the plain
  // records-list card's photo (no data-wr-fixed-h) still wants its height tied to the barcode row.
  if (photoPanel && !photoPanel.hasAttribute('data-wr-fixed-h')) {

let _zxReaderShared = null;
function _getZxReader() {

  _zxReaderShared = new RC();
  return _zxReaderShared;
}
function _resizeImg(img, maxPx) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  if (sw <= maxPx && sh <= maxPx) return img; // no resize needed
  const scale = maxPx / Math.max(sw, sh);
  const cv = document.createElement('canvas');
  cv.width = Math.round(sw * scale); cv.height = Math.round(sh * scale);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv;
}
function _rotCanvas(src, deg) {
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const w = (deg === 90 || deg === 270) ? sh : sw, h = (deg === 90 || deg === 270) ? sw : sh;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.translate(w / 2, h / 2); ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(src, -sw / 2, -sh / 2, sw, sh);

}
async function _fastDecode(img) {
  // Step 0: resize if too large
  const src = _resizeImg(img, 1920);
  const hasBD = 'BarcodeDetector' in window;

  // Step 1: BarcodeDetector — parallel 4 rotations (Promise.any for early exit)
  if (hasBD) {
    const fmts = ['ean_13','ean_8','upc_a','upc_e','code_128','qr_code','code_39','code_93','itf','pdf417'];
    try {
      const det = new BarcodeDetector({formats: fmts});
      const tryDeg = async (deg) => {
        const cv = deg === 0 ? src : _rotCanvas(src, deg);
        const bmp = await createImageBitmap(cv);
        const res = await det.detect(bmp);
        if (res.length) return res[0].rawValue;
        throw new Error('no result');
      };
      const code = await Promise.any([tryDeg(0), tryDeg(90), tryDeg(270), tryDeg(180)]).catch(() => null);
      if (code) return code;
    } catch(e) {}
  }

  // Step 2: ZXing — reuse shared instance, 4 rotations (early exit)
  const reader = _getZxReader();
  if (reader) {
    for (const deg of [0, 90, 270, 180]) {
      try {
        const cv = deg === 0 ? (src.tagName === 'IMG' ? src : src) : _rotCanvas(src, deg);
        // decodeFromCanvas ถ้าเป็น canvas / decodeFromImageElement ถ้าเป็น img (deg=0 only)
        let res;
        if (deg === 0 && (src.tagName === 'IMG')) {
          res = await reader.decodeFromImageElement(src);
        } else {
          res = await reader.decodeFromCanvas(cv instanceof HTMLCanvasElement ? cv : src);
        }
        if (res) return res.getText();
      } catch(e) {}
    }
  }

  // Step 3: ZXing + contrast (ทำเฉพาะถ้า BD ไม่มี เพื่อลด ops)
  if (!hasBD && reader) {

      const cv = document.createElement('canvas'); cv.width = cvSrc.width || cvSrc.naturalWidth; cv.height = cvSrc.height || cvSrc.naturalHeight;
      const ctx = cv.getContext('2d');

      ctx.drawImage(cvSrc, 0, 0); return cv;
    };

      try { const cv = _rotCanvas(src.tagName === 'IMG' ? src : src, deg); const r = await reader.decodeFromCanvas(enhCV(cv, 80, 20)); if(r) return r.getText(); } catch(e){}
      try { const cv = _rotCanvas(src.tagName === 'IMG' ? src : src, deg); const r = await reader.decodeFromCanvas(enhCV(cv, 120, -10)); if(r) return r.getText(); } catch(e){}
    }
  }

  return null;
}

let ACTIVE_WHOLESALE_DB = WHOLESALE_DB;
(function(){
  try {
    const saved = localStorage.getItem('wholesale-db-custom');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length) ACTIVE_WHOLESALE_DB = parsed;
    }
  } catch (e) {}
  _wrUpdateHeaderInfo();
})();

function _wrUpdateHeaderInfo() {
  const countEl = document.getElementById('wholesale-db-count');
  const updEl = document.getElementById('wholesale-db-updated');
  const resetEl = document.getElementById('wholesale-db-reset-link');
  const dateBadge = document.getElementById('wr-upload-date-badge');
  if (countEl) countEl.textContent = 'ฐานข้อมูล ' + ACTIVE_WHOLESALE_DB.length.toLocaleString('th-TH') + ' รายการ';
  const ts = localStorage.getItem('wholesale-db-updated-at');
  // once an import date exists it's shown on the green badge next to the Import button
  // instead, so the old inline "อัปเดตล่าสุด: ..." text is redundant — hide it, but keep
  // the reset link visible on its own since it's still the only way to clear the import.
  if (updEl) {
    if (ts) {
      updEl.style.display = 'none';
    } else {
      updEl.style.display = '';
      updEl.textContent = 'ใช้ข้อมูลเริ่มต้นในแอป';
    }
  }
  if (resetEl) resetEl.style.display = ts ? 'inline' : 'none';
  if (dateBadge) {
    if (ts) {
      dateBadge.textContent = new Date(Number(ts)).toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: '2-digit' });
      dateBadge.style.display = 'inline-block';
    } else {
      dateBadge.style.display = 'none';
    }
  }
}

let _wrMasterByBarcode = null;
function _wrGetMasterByBarcode() {
  if (_wrMasterByBarcode) return _wrMasterByBarcode;
  _wrMasterByBarcode = new Map();
  for (const row of WHOLESALE_DB) {
    const bc = String(row[0] || '').replace(/\D/g, '');
    if (bc && !_wrMasterByBarcode.has(bc)) _wrMasterByBarcode.set(bc, row);
  }
  return _wrMasterByBarcode;
}

// [NEW 2026-08-20] pulls the producer name out of a product-name string when there's no
// master-DB match to source it from (see _wrHandleUpload). Tested against the actual monthly
// price list: covers 1491/1492 real rows. Two conventions cover almost everything —
//   "{Producer} - {description}"        e.g. "La Crema - \"Sonoma Coast\" Chardonnay"
//   "{Producer}, AOC {Region} {Vintage}" e.g. "Alter Ego de Palmer, AOC Margaux 2015"
// — checked in that order since " - " is the more specific/common pattern; a bare "-" with no
// surrounding spaces and a split-before-appellation-keyword are last-resort fallbacks for the
// occasional typo'd row (missing space around the dash, or missing comma after the producer).
function _wrDeriveProducerFromName(name) {
  if (!name) return '';
  const s = String(name).trim();
  let idx = s.indexOf(' - ');
  if (idx > 0) return s.slice(0, idx).trim();
  idx = s.indexOf(',');
  if (idx > 0) return s.slice(0, idx).trim();
  idx = s.indexOf('-');
  if (idx > 0) return s.slice(0, idx).trim();
  const m = s.match(/^(.*?)\s+(AOC|AOP|DOC|DOCG|DOCa|IGP|DO)\b/i);
  if (m && m[1]) return m[1].trim();
  return '';
}

async function _wrHandleUpload(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  if (typeof showToast === 'function') showToast('กำลังอ่านไฟล์...');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const records = [];
    // [NEW] import-report tracking — rows the parser had to skip or flag, so the person
    // reviewing an import can see exactly what didn't come through cleanly instead of it
    // silently disappearing into the new database.
    const noBarcodeRows = [];   // has a product name, but column A wasn't a usable barcode
    const noPriceRows = [];     // row imported fine, but all 3 price columns came out blank
    // [FIX] Some monthly exports (e.g. Aug 2026 file) added a "Full List" summary sheet that
    // simply concatenates every country sheet that follows it. It isn't a real region, and
    // importing it on top of the per-country sheets doubles every record in the database
    // (this was the "การ์ดสินค้าเพี้ยน" bug). Skip any sheet whose name is a known
    // summary/cover label rather than an actual product region.
    const SUMMARY_SHEET_NAMES = ['cover', 'full list', 'summary', 'all', 'master list', 'master'];
    // [ADDED 2026-10-19] แถวที่มีชื่อ+ราคาแล้วแต่ช่องบาร์โค้ดยังไม่มี (เช่นเขียนว่า "WAITING BAR CODE") เดิมถูกข้ามทิ้งทั้งแถว
    // ทำให้ไวน์พวกนั้นหายจากการค้นหาหลังนำเข้า — ตอนนี้เก็บไว้โดยให้รหัสภายใน "NOBC-xx" (ดู _wrIsNoBarcode) ค้นด้วยชื่อได้
    // รหัสจะใช้ตัวเดิมถ้าชื่อ+วินเทจตรงกับแถวที่มีอยู่ในฐานข้อมูลตอนนี้ (โน้ต/ปักหมุดที่ผูกกับรหัสจึงไม่หาย และ diff
    // ในรายงานไม่แสดงเป็นหาย+เพิ่ม) และดึงข้อมูลคลาสสิฟิเคชัน/ผู้ผลิต/ภูมิภาคจากแถวเดิมนั้นมาเติมแทน master ตามบาร์โค้ด
    // ส่วนชื่อใหม่ที่ไม่เคยมี รับเลขถัดไปต่อจากเลขสูงสุดที่เคยใช้ (นับทั้งฐานข้อมูลปัจจุบันและชุดเริ่มต้นในแอป กันชนกับโน้ตเก่า)
    const _nobcKey = (name, vintage) => String(name || '').trim().replace(/\s+/g, ' ').toLowerCase() + '|' + String(vintage || '').trim();
    const _nobcPrev = new Map();
    let _nobcMax = 0;
    (Array.isArray(ACTIVE_WHOLESALE_DB) ? ACTIVE_WHOLESALE_DB : []).forEach(r => {
      if (_wrIsNoBarcode(r[0])) _nobcPrev.set(_nobcKey(r[1], r[3]), r);
    });
    [].concat(Array.isArray(ACTIVE_WHOLESALE_DB) ? ACTIVE_WHOLESALE_DB : [], WHOLESALE_DB).forEach(r => {
      const m = /^NOBC-(\d+)$/.exec(String(r[0]));
      if (m) _nobcMax = Math.max(_nobcMax, Number(m[1]));
    });
    const _nobcUsed = new Set();
    const _nobcAssign = (product, vintage) => {
      const prev = _nobcPrev.get(_nobcKey(product, vintage)) || null;
      let code = prev ? String(prev[0]) : null;
      if (!code || _nobcUsed.has(code)) {
        do { code = 'NOBC-' + String(++_nobcMax).padStart(2, '0'); } while (_nobcUsed.has(code));
      }
      _nobcUsed.add(code);
      return { code, prev };
    };
    wb.SheetNames.forEach(sn => {
      if (SUMMARY_SHEET_NAMES.includes(sn.trim().toLowerCase())) return;
      const ws = wb.Sheets[sn];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
      // [FIX 2026-10-19] ชีตชื่อ "Fine Wines" (มี s — ไฟล์ August 2026 เขียนแบบนี้) ต้องเป็น "Fine Wine" ตรงตัว เพราะทั้งแอป
      // (_wrIsFineWine, ชิปหมวด, สีทอง) เช็ก r[8] === 'Fine Wine' ถ้าไม่แปลง ไวน์ชั้นสูงจะกลายเป็น "ประเทศ" แยกชื่อ Fine Wines
      const _sheetName = sn.trim();
      const country = /^fine\s*wines?$/i.test(_sheetName) ? 'Fine Wine' : _sheetName;
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const bcRaw = row[0];
        const product = row[1];
        // [FIX] barcode/price cells formatted as TEXT in Excel (very common for barcodes,
        // since leading zeros require a text format) came through XLSX.js as strings, not
        // numbers. The old strict `typeof === 'number'` check silently dropped the whole row
        // (bad barcode) or blanked just the price (bad price) with no warning to the user —
        // this is the "บางครั้งราคาไม่โหลด" bug. Both barcode and prices now also accept a
        // numeric-looking string (stripping thousands separators/currency/whitespace) before
        // giving up and treating the cell as genuinely missing.
        const numFromCell = v => {
          if (typeof v === 'number') return isFinite(v) ? v : null;
          if (typeof v === 'string') {
            const cleaned = v.replace(/[,\s฿$]|THB/gi, '').trim();
            if (cleaned === '') return null;
            const n = Number(cleaned);
            return isFinite(n) ? n : null;
          }
          return null;
        };
        const bcNum = numFromCell(bcRaw);
        // บาร์โค้ดที่เป็นศูนย์ล้วน (0 / 0000000000000) คือค่าสมมติ ไม่ใช่บาร์โค้ดจริง — ถือว่ายังไม่มีบาร์โค้ดเหมือนช่องว่าง
        const bcMissing = bcNum == null || bcNum === 0;
        let nobc = null;
        // [FIX] Some sheets contain fully-blank spacer rows where every cell actually holds a
        // single non-breaking space (U+00A0) rather than being truly empty — Excel formatting
        // leftover, not real data. `v !== ''` doesn't catch that, so these rows were wrongly
        // treated as "real products" and flooded the noBarcodeRows report. `_hasContent` trims
        // (JS's trim() strips \u00A0 too) before deciding a cell actually holds something.
        const _hasContent = v => v != null && String(v).trim() !== '';
        if (_hasContent(product) && bcMissing) {
          // The sheet uses label-only rows (e.g. col A = "Burgundy", col B = producer name)
          // as section dividers between producers/regions — those are a normal, expected part
          // of the layout every month, not a data problem, and always leave every other column
          // blank. Only flag this row as a genuine skipped product if some other product-like
          // column (type/vintage/price/grapes) is actually filled in, meaning it looks like a
          // real item that's just missing/malformed its barcode.
          const looksLikeRealRow = [row[3], row[4], row[5], row[6]].some(_hasContent);
          if (looksLikeRealRow) {
            const _vin = row[3] == null ? '' : String(row[3]).trim().replace(/\.0$/, '');
            nobc = _nobcAssign(String(product).trim(), _vin);
            noBarcodeRows.push({ sheet: country, row: i + 1, product: String(product).trim(), barcodeRaw: bcRaw == null ? '' : String(bcRaw), kept: nobc.code });
          }
        }
        if ((bcMissing && !nobc) || product == null || product === '') continue;
        const type = row[2] != null ? String(row[2]).trim() : '';
        let vintage = row[3];
        vintage = vintage == null ? '' : String(vintage).trim().replace(/\.0$/, '');
        const numOrNull = v => { const n = numFromCell(v); return n == null ? null : Math.round(n * 100) / 100; };
        const wholesale = numOrNull(row[4]);
        const wholesale6 = numOrNull(row[5]);
        const retail = numOrNull(row[6]);
        const grapes = row[7] != null ? String(row[7]).trim() : '';
        // Uploaded Excel files carry no classification/producer/region columns —
        // backfill them from the master DB by barcode match so wine-tier badges
        // (Grand Cru / 1er Cru / DOCG / etc.) keep working after an import.
        const bcKey = nobc ? nobc.code : String(Math.round(bcNum));
        const master = nobc ? nobc.prev : _wrGetMasterByBarcode().get(bcKey);
        // [NEW 2026-08-20] producer for a barcode not yet in the master DB (a genuinely new
        // product added this month) used to stay blank — the excel itself never has a
        // dedicated producer column. But the product-name text reliably carries it: most
        // country sheets write "{Producer} - {description}" and the Fine Wines sheet writes
        // "{Producer}, AOC {Region} {Vintage}". _wrDeriveProducerFromName() pulls the producer
        // out of that text so newly-added rows aren't stuck with an empty PRODUCER field just
        // because they haven't been manually catalogued yet. Classification and label tier
        // have no equivalent signal in the free-text name (they need real classification-table
        // knowledge, e.g. Bordeaux 1855), so those still only come from a master-DB match.
        const producer = (master && master[9]) || _wrDeriveProducerFromName(String(product).trim());
        const labelTier = master ? master[10] : '';
        const classification = master ? master[11] : '';
        const region = master ? master[12] : '';
        if (wholesale == null && wholesale6 == null && retail == null) {
          noPriceRows.push({ sheet: country, row: i + 1, barcode: bcKey, product: String(product).trim() });
        }
        records.push([bcKey, String(product).trim(), type, vintage, wholesale, wholesale6, retail, grapes, country, producer, labelTier, classification, region]);
      }
    });
    if (!records.length) {
      if (typeof showToast === 'function') showToast('ไม่พบข้อมูลสินค้าในไฟล์', 'err');
      return;
    }
    // snapshot the database as it stood immediately before this import overwrites it,
    // so we can diff old vs new (added / removed / price or name changed).
    const oldRecords = Array.isArray(ACTIVE_WHOLESALE_DB) ? ACTIVE_WHOLESALE_DB : [];
    const diff = _wrDiffImport(oldRecords, records);
    localStorage.setItem('wholesale-db-custom', JSON.stringify(records));
    localStorage.setItem('wholesale-db-updated-at', String(Date.now()));
    ACTIVE_WHOLESALE_DB = records;
    _wrUpdateHeaderInfo();
    renderWholesaleResults();
    const report = {
      ts: Date.now(),
      fileName: file.name || '',
      totalOld: oldRecords.length,
      totalNew: records.length,
      added: diff.added,
      removed: diff.removed,
      changed: diff.changed,
      noBarcodeRows,
      noPriceRows
    };
    _wrSaveImportHistory(report);
    if (typeof showToast === 'function') showToast('อัปเดตฐานข้อมูลสำเร็จ: ' + records.length.toLocaleString('th-TH') + ' รายการ');
    _wrShowImportReport(report);
  } catch (e) {
    if (typeof showToast === 'function') showToast('อ่านไฟล์ไม่สำเร็จ: ' + e.message, 'err');
  }
}

// Compares the previous ACTIVE_WHOLESALE_DB against the freshly-parsed records by barcode,
// so an import report can show exactly what's new, what dropped off, and what changed.
function _wrDiffImport(oldRecords, newRecords) {
  const oldMap = new Map(oldRecords.map(r => [r[0], r]));
  const newMap = new Map(newRecords.map(r => [r[0], r]));
  const added = [], removed = [], changed = [];
  newMap.forEach((r, bc) => { if (!oldMap.has(bc)) added.push(r); });
  oldMap.forEach((r, bc) => { if (!newMap.has(bc)) removed.push(r); });
  newMap.forEach((nr, bc) => {
    const or = oldMap.get(bc);
    if (!or) return;
    const priceChanged = or[4] !== nr[4] || or[5] !== nr[5] || or[6] !== nr[6];
    const nameChanged = or[1] !== nr[1];
    if (priceChanged || nameChanged) changed.push({ bc, old: or, new: nr, priceChanged, nameChanged });
  });
  return { added, removed, changed };
}

function _wrSaveImportHistory(report) {
  let history = [];
  try { history = JSON.parse(localStorage.getItem('wholesale-import-history') || '[]'); } catch (e) { history = []; }
  history.unshift(report);
  if (history.length > 12) history = history.slice(0, 12);
  try { localStorage.setItem('wholesale-import-history', JSON.stringify(history)); } catch (e) { /* storage full — history just won't persist */ }
}

function _wrResetDb() {
  localStorage.removeItem('wholesale-db-custom');
  localStorage.removeItem('wholesale-db-updated-at');
  ACTIVE_WHOLESALE_DB = WHOLESALE_DB;
  _wrUpdateHeaderInfo();
  renderWholesaleResults();
  if (typeof showToast === 'function') showToast('รีเซ็ตเป็นฐานข้อมูลเริ่มต้นแล้ว');
}

function _wrCloseImportReport() {
  const m = document.getElementById('wr-import-report-modal');
  if (m) m.style.display = 'none';
  document.body.style.overflow = ''; // [FIX] release the scroll-lock set on open
}

function _wrFmtImportDate(ts) {
  try {
    return new Date(ts).toLocaleString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}

// A single collapsible section (e.g. "สินค้าใหม่ 12 รายการ") inside the report body.
function _wrReportSection(label, color, itemsHtml, count) {
  if (!count) return '';
  return `
    <div style="margin-bottom:14px;border:1px solid ${color}35;border-radius:10px;overflow:hidden;background:${color}0a">
      <div style="padding:9px 12px;font-family:'Prompt',sans-serif;font-size:11px;font-weight:800;color:${color};border-bottom:1px solid ${color}25;letter-spacing:.3px">${_wrEsc(label)} · ${count.toLocaleString('th-TH')}</div>
      <div style="max-height:260px;overflow-y:auto">${itemsHtml}</div>
    </div>`;
}

function _wrReportRow(mainText, subText) {
  return `<div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-family:'Prompt',sans-serif">
      <div style="font-size:12px;color:#eaf6ff;font-weight:600">${_wrEsc(mainText)}</div>
      ${subText ? `<div style="font-size:10px;color:rgba(255,255,255,.45);margin-top:2px">${_wrEsc(subText)}</div>` : ''}
    </div>`;
}

// Renders the full diff/issue report for one import inside #wr-import-report-body.
function _wrRenderReportBody(report) {
  const netChange = report.totalNew - report.totalOld;
  const netStr = netChange > 0 ? `+${netChange.toLocaleString('th-TH')}` : netChange.toLocaleString('th-TH');
  let html = `
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <div style="flex:1;background:rgba(75,207,250,.07);border:1px solid rgba(75,207,250,.25);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:#4bcffa;font-family:'Prompt',sans-serif">${report.totalNew.toLocaleString('th-TH')}</div>
        <div style="font-size:9px;color:rgba(255,255,255,.45);margin-top:2px">รายการทั้งหมด</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:800;color:${netChange < 0 ? '#ff6b6b' : '#00d4aa'};font-family:'Prompt',sans-serif">${netStr}</div>
        <div style="font-size:9px;color:rgba(255,255,255,.45);margin-top:2px">เทียบกับก่อนหน้า</div>
      </div>
    </div>`;

  html += _wrReportSection('สินค้าใหม่ (ไม่เคยมีในระบบ)', '#00d4aa',
    report.added.slice(0, 200).map(r => _wrReportRow(r[1], `${r[8]} · ${r[0]}`)).join(''), report.added.length);

  html += _wrReportSection('สินค้าที่หายไป (ไม่มีในไฟล์นี้)', '#ff6b6b',
    report.removed.slice(0, 200).map(r => _wrReportRow(r[1], `${r[8]} · ${r[0]}`)).join(''), report.removed.length);

  html += _wrReportSection('ราคา/ชื่อเปลี่ยนไป', '#ff9f43',
    report.changed.slice(0, 200).map(c => {
      const bits = [];
      if (c.priceChanged) {
        const fmt = v => v == null ? '-' : v.toLocaleString('th-TH');
        bits.push(`ราคาส่ง ${fmt(c.old[4])} → ${fmt(c.new[4])} บาท`);
      }
      if (c.nameChanged) bits.push(`ชื่อ "${c.old[1]}" → "${c.new[1]}"`);
      return _wrReportRow(c.new[1], bits.join(' · ') + ` · ${c.bc}`);
    }).join(''), report.changed.length);

  // [CHANGED 2026-10-19] แถวที่ไม่มีบาร์โค้ดแต่มีชื่อ+ราคา ตอนนี้ถูกเก็บไว้ด้วยรหัส NOBC-xx (r.kept) ไม่ใช่ข้าม —
  // รายงานเก่าที่บันทึกไว้ก่อนหน้า (ไม่มี r.kept) ยังแสดงเป็น "แถวที่ข้าม" ตามเดิม
  const _nbAll = report.noBarcodeRows || [];
  const _nbKept = _nbAll.filter(r => r.kept), _nbSkipped = _nbAll.filter(r => !r.kept);
  html += _wrReportSection('นำเข้าแล้วแต่ยังไม่มีบาร์โค้ด (ค้นหาด้วยชื่อ)', '#ffb020',
    _nbKept.slice(0, 200).map(r => _wrReportRow(r.product, `ชีต ${r.sheet} แถว ${r.row} · ช่องบาร์โค้ด: "${r.barcodeRaw}" → รหัส ${r.kept}`)).join(''),
    _nbKept.length);

  html += _wrReportSection('แถวที่ข้าม (ไม่มีบาร์โค้ดที่อ่านได้)', '#ff6b6b',
    _nbSkipped.slice(0, 200).map(r => _wrReportRow(r.product, `ชีต ${r.sheet} แถว ${r.row} · ค่าที่อ่านได้: "${r.barcodeRaw}"`)).join(''),
    _nbSkipped.length);

  html += _wrReportSection('นำเข้าแล้วแต่ไม่มีราคาเลย', '#ffb020',
    (report.noPriceRows || []).slice(0, 200).map(r => _wrReportRow(r.product, `ชีต ${r.sheet} แถว ${r.row} · ${r.barcode}`)).join(''),
    (report.noPriceRows || []).length);

  if (!report.added.length && !report.removed.length && !report.changed.length && !(report.noBarcodeRows || []).length && !(report.noPriceRows || []).length) {
    html += `<div style="text-align:center;padding:30px 10px;color:rgba(255,255,255,.4);font-family:'Prompt',sans-serif;font-size:12px">ไม่มีการเปลี่ยนแปลงเทียบกับฐานข้อมูลก่อนหน้า</div>`;
  }
  return html;
}

function _wrShowImportReport(report) {
  const modal = document.getElementById('wr-import-report-modal');
  const title = document.getElementById('wr-import-report-title');
  const subtitle = document.getElementById('wr-import-report-subtitle');
  const body = document.getElementById('wr-import-report-body');
  if (!modal || !body) return;
  title.textContent = 'รายงานการนำเข้า';
  subtitle.textContent = (report.fileName ? report.fileName + ' · ' : '') + _wrFmtImportDate(report.ts);
  body.innerHTML = _wrRenderReportBody(report);
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // [FIX] this modal never locked background scroll like
                                            // every other modal in the app does — a finger-swipe on
                                            // it was passing straight through and scrolling the
                                            // underlying record page instead of staying inside the modal.
}

// Browsable log of past imports — tapping an entry re-opens its full diff report.
function _wrOpenImportHistory() {
  let history = [];
  try { history = JSON.parse(localStorage.getItem('wholesale-import-history') || '[]'); } catch (e) { history = []; }
  const modal = document.getElementById('wr-import-report-modal');
  const title = document.getElementById('wr-import-report-title');
  const subtitle = document.getElementById('wr-import-report-subtitle');
  const body = document.getElementById('wr-import-report-body');
  if (!modal || !body) return;
  title.textContent = 'ประวัติการนำเข้า';
  subtitle.textContent = history.length ? `${history.length} ครั้งล่าสุด` : '';
  if (!history.length) {
    // [DESIGN] empty state now matches the icon-tile + muted-label pattern used elsewhere in
    // the app (e.g. wholesale-results empty state) instead of a bare line of grey text.
    body.innerHTML = `<div style="text-align:center;padding:56px 20px;font-family:'Prompt',sans-serif">
      <div style="width:50px;height:50px;margin:0 auto 14px;border-radius:13px;background:rgba(75,207,250,.07);border:1px solid rgba(75,207,250,.22);display:flex;align-items:center;justify-content:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(75,207,250,.6)" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div style="color:rgba(255,255,255,.4);font-size:12px">ยังไม่มีประวัติการนำเข้า</div>
    </div>`;
  } else {
    body.innerHTML = history.map((r, idx) => _wrHistoryEntryHTML(r, idx)).join('');
  }
  window._wrImportHistoryCache = history;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // [FIX] same background-scroll-bleed issue as _wrShowImportReport
}

// [DESIGN] One entry in the import-history list. Reuses the app's established HUD language
// (corner brackets like .rec-cc, a glowing sysid-style dot label, .wr-badge chips) instead of
// the plain flat rgba box this used to be — so this page reads as part of the same product,
// not a bolted-on settings screen. Accent color tracks the net change direction (grew/shrank/
// unchanged), same logic the number itself already used.
function _wrHistoryEntryHTML(r, idx) {
  const netChange = r.totalNew - r.totalOld;

  const accent = netChange > 0 ? '#00d4aa' : netChange < 0 ? '#ff6b6b' : '#4bcffa';
  const accentRgb = _wrHexToRgb(accent);
  const issueCount = (r.noBarcodeRows || []).length + (r.noPriceRows || []).length;
  const shortId = String(r.ts).slice(-5);

  const chips = [];
  if (r.added.length) chips.push(`<span class="wr-badge" style="color:#00d4aa;background:rgba(0,212,170,.1);border-color:rgba(0,212,170,.3)">+${r.added.length} ใหม่</span>`);
  if (r.removed.length) chips.push(`<span class="wr-badge" style="color:#ff6b6b;background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3)">-${r.removed.length} หาย</span>`);
  if (r.changed.length) chips.push(`<span class="wr-badge" style="color:#ff9f43;background:rgba(255,159,67,.1);border-color:rgba(255,159,67,.3)">${r.changed.length} เปลี่ยน</span>`);
  if (issueCount) chips.push(`<span class="wr-badge" style="color:#ffb020;background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.3)">⚠ ${issueCount} ปัญหา</span>`);

  return `<div onclick="_wrShowImportReport(_wrImportHistoryCache[${idx}])"
    style="position:relative;cursor:pointer;padding:12px 13px 11px;margin-bottom:10px;border-radius:12px;overflow:hidden;
      background:linear-gradient(135deg,rgba(${accentRgb},.09) 0%,rgba(6,10,16,.55) 100%);
      border:1px solid rgba(${accentRgb},.25);
      box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 16px rgba(${accentRgb},.06);
      font-family:'Prompt',sans-serif">
    <div style="position:absolute;top:0;left:0;width:10px;height:10px;border-top:2px solid rgba(${accentRgb},.75);border-left:2px solid rgba(${accentRgb},.75)"></div>
    <div style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-bottom:2px solid rgba(${accentRgb},.3);border-right:2px solid rgba(${accentRgb},.3)"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;flex-shrink:0;border-radius:9px;background:rgba(${accentRgb},.1);border:1px solid rgba(${accentRgb},.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(${accentRgb},.12)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <div style="width:4px;height:4px;border-radius:50%;background:${accent};box-shadow:0 0 5px ${accent};flex-shrink:0"></div>
          <span style="font-size:8px;font-weight:800;letter-spacing:1px;color:rgba(${accentRgb},.8);text-transform:uppercase">IMPORT · ${shortId}</span>
        </div>

      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:15px;font-weight:800;color:${accent};text-shadow:0 0 10px rgba(${accentRgb},.5)">${netStr}</div>

      </div>
    </div>
    ${r.fileName ? `<div style="font-size:9.5px;color:rgba(255,255,255,.4);margin-top:8px;padding-left:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${_wrEsc(r.fileName)}</div>` : ''}
    ${chips.length ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-left:46px">${chips.join('')}</div>` : ''}

function _wrEsc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// [FIX 2026-07-30] Wholesale-modal display name: "{vintage} {Château Producer}, {Region}, {Bordeaux}"
// Falls back to the raw product string whenever producer/region data is missing (most non-Fine-Wine
// rows), so this only reformats the premium chateaux rows that actually carry that metadata.
function _wrParentRegion(r) {
  if (!_wrIsFineWine(r)) return '';
  const c = _wrRealCountry(r); // 'France' (→ Bordeaux), 'Chile', 'USA', 'Italy', etc.
  return c === 'France' ? 'Bordeaux' : c;
}

// [FIX 2026-08-31] ดึงชื่อคูเว่/ไร่องุ่นเฉพาะที่อยู่ในเครื่องหมายคำพูดของ raw product text เช่น
// 'Almaviva - "EPU" Puente Alto 2023' -> '"EPU"' หรือ
// 'Chateau Mouton Rothschild - "Aile d'Argent" Bordeaux Blanc 2023' -> '"Aile d'Argent"'
// ในชุดข้อมูลนี้แต่ละแถวมีคูเว่ในเครื่องหมายคำพูดอย่างมากแค่ตัวเดียว จึงดึงแค่ตัวแรกที่เจอพอ
// (ใช้ regex เดียวกับที่ _wrHighlightTip ใช้หา "quoted phrases" ด้านล่าง เพื่อความสอดคล้อง)
function _wrExtractCuvee(product) {
  if (!product) return '';
  const m = String(product).match(/"([^"\n]{2,60}?)"/);
  return m ? `"${m[1]}"` : '';
}

// [FIX 2026-08-31] ~39 กลุ่มที่เหลือหลังแก้คูเว่ในเครื่องหมายคำพูดไปแล้ว เป็นคู่ First Label/Second
// Label (หรือ Related Cuvee) ที่ "ชื่อการตลาด" ของมันเองไม่มีคูเว่ในเครื่องหมายคำพูด — เช่น
// "Reflet De Laffitte Carcasset - AOC Saint Estephe" (Second Label ของ Chateau Laffitte Carcasset)
// ตอนนี้แสดงชื่อซ้ำกับ "Chateau Laffitte Carcasset - AOC Saint Estephe" (First Label ตัวจริง) เพราะ
// _wrDisplayName สร้างชื่อจาก producer ล้วนๆ เมื่อไม่มีคูเว่ในเครื่องหมายคำพูด ทั้งที่ product text
// เองมีชื่อการตลาดที่ต่างจาก producer อยู่แล้ว (อยู่หน้า " - " หรือ "," ตัวแรก) แค่ไม่ได้ถูกดึงมาใช้ —
// ดึงชื่อนั้นออกมาด้วย helper นี้ (คล้าย _wrExtractCuvee แต่ไม่มีเครื่องหมายคำพูดกำกับ จึงต้องเทียบกับ
// producer ก่อนว่าต่างกันจริงหรือแค่เขียนคนละแบบ เพื่อไม่ให้ First Label ธรรมดาโดนต่อชื่อซ้ำใส่ตัวเอง)
function _wrExtractLabelName(product, producer) {
  if (!product || !producer) return '';
  const m = String(product).match(/^(.*?)(?:\s-\s|,\s)/);
  const raw = (m ? m[1] : String(product)).trim();
  if (!raw) return '';
  const norm = s => String(s).toLowerCase().replace(/^ch[aâ]teau\s+/, '').replace(/[^a-z0-9]/g, '');
  return norm(raw) === norm(producer) ? '' : raw;
}

function _wrDisplayName(r) {
  const product = r[1] || '';
  const vintage = r[3] || '';
  const producer = r[9] || '';
  const labelTier = r[10] || '';
  const region = r[12] || '';
  // [FIX 2026-08-01] rows without producer/region data used to be returned as-is on the
  // assumption the raw product string already carried the vintage and size wording — but a
  // large share are missing the year, the size, or both. Now we only skip adding a piece of
  // info that's already embedded in the raw text, and fill in whichever is actually missing.
  const sizeRe = /(\d+(?:\.\d+)?)\s*(ml\.?|litre?s?\.?|ltr\.?|l\.?|cl\.?)\b/i;
  if (!producer || !region) {
    const isNV = vintage === 'NV' || vintage === 'N/V';
    // [FIX] rows without producer/region metadata (barcode not found in the master catalog)
    // often still carry the vintage inside the raw product text itself — but at the END
    // ("Chateau X, AOC Y, 1er Grand Cru Classe A,  2010"), not the front. That left the display
    // name starting with the producer instead of the year, unlike every enriched row below
    // (and unlike the same wine's OTHER vintages that do exist in the master catalog) — e.g.
    // barcode 606370 (2010, not in master) rendered differently from barcode 670760 (2018, in
    // master) despite being the same Château Margaux. Strip a trailing ", {vintage}" and move
    // it to the front so every card's title starts with the vintage the same way.
    let base = product;
    let yearPrefix = '';
    if (vintage && !isNV) {
      const escapedVintage = vintage.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const trailingYearRe = new RegExp(',?\\s*' + escapedVintage + '\\s*$');
      // [FIX 2026-08-20] previously checked "does the raw text contain ANY 4-digit
      // year-shaped number" (a generic /\b(1[5-9]\d{2}|20\d{2})\b/) to decide whether the
      // vintage was "already embedded" and skip prefixing it — but that false-matches numbers
      // in a vineyard/cuvee name that only LOOK like a year, e.g. `"1890's Vineyard"` (JJ Hahn,
      // barcode 9342075000327, real vintage 2015) or `"Attunga 1865"` (Kilikanoon, barcode
      // 9329666029943, real vintage 2010). Those got mistaken for the vintage already being
      // present, so the actual vintage never got prefixed. What we need to know is narrower:
      // is THIS wine's own vintage value specifically present in the text — so check for that
      // directly instead of any year-shaped number.
      const vintageInTextRe = new RegExp('\\b' + escapedVintage + '\\b');
      if (trailingYearRe.test(base)) {
        base = base.replace(trailingYearRe, '').trim();
        yearPrefix = vintage + ' ';
      } else if (!vintageInTextRe.test(base)) {
        yearPrefix = vintage + ' ';
      }
    }
    const sizeSuffix = sizeRe.test(base) ? '' : ` ${_wrBottleSize(product)}`;
    return `${yearPrefix}${base}${sizeSuffix}`;
  }
  const name = producer.replace(/\bChateau\b/g, 'Château'); // word-boundary avoids "Chateauneuf"
  // [FIX 2026-08-31] เดิม branch นี้ (producer+region มีข้อมูลครบ) สร้างชื่อแสดงผลจาก producer+region
  // ล้วนๆ โดยไม่แตะ product (raw text) เลย ทำให้ชื่อคูเว่/ไร่องุ่นเฉพาะที่อยู่ในเครื่องหมายคำพูดของ
  // product (เช่น 'Almaviva - "EPU" Puente Alto 2023', 'Chateau Mouton Rothschild - "Aile d'Argent"
  // Bordeaux Blanc 2023') หายไปทั้งหมด ทั้งที่เป็นข้อมูลสำคัญที่สุดสำหรับแยกไวน์ราคาแพงออกจากกัน —
  // เจอบั๊กจริง 2 อาการ: (1) ชื่อเฉพาะหาย ผู้ใช้ค้นหาแล้วเจอแต่ชื่อกลางๆ ไม่รู้ว่าเป็นคูเว่ไหน (2) ไวน์
  // คนละตัวที่ producer+vintage+region ตรงกันแต่เป็นคนละคูเว่ (เช่น Almaviva ธรรมดา บาร์โค้ด 49101645
  // กับ Almaviva "EPU" บาร์โค้ด 7804607441500) แสดงชื่อซ้ำกันเป๊ะ ดูเหมือนเป็นไวน์ตัวเดียวกัน ทั้งที่
  // เป็นคนละขวด คนละราคา — ปัญหานี้ไม่ได้จำกัดแค่ 2 บาร์โค้ดที่เจอ แต่กระทบทุกแถวใน WHOLESALE_DB ที่มี
  // producer+region ครบ (เข้า branch นี้) และมีคูเว่ในเครื่องหมายคำพูดใน product — grep แล้วมีอีกหลาย
  // ร้อยแถว (Chateau Malescasse "La Closerie De Malescasse", Chateau Charmail ต่างๆ, Reflet De
  // Laffitte Carcasset ฯลฯ) จึงแก้ที่ต้นทาง (helper _wrExtractCuvee ด้านบน) ให้ครอบคลุมทุกแถวพร้อมกัน
  // แทนที่จะ hardcode เฉพาะ 2 บาร์โค้ดที่ผู้ใช้รายงานมา — ต่อคูเว่ท้ายชื่อ producer ด้วย " - " ตาม
  // รูปแบบเดิมที่ raw product text ใช้อยู่แล้ว (Producer - "Cuvee" Region), ไม่ใส่อะไรถ้าไม่มีคูเว่
  // (พฤติกรรมเดิมสำหรับแถวที่ไม่มีคูเว่ในเครื่องหมายคำพูดจะเหมือนเดิมทุกประการ)
  let cuvee = _wrExtractCuvee(product);
  // [FIX 2026-08-31] no quoted cuvée in the raw text — fall back to the unquoted marketing name
  // (e.g. "Reflet De Laffitte Carcasset", "Connetable Talbot", "Baron De Brane") when this row is
  // itself a Second Label / Related Cuvee / etc. (labelTier set and not "First Label"), since that's
  // exactly the case where producer-only naming collides with the First Label of the same château.
  if (!cuvee && labelTier && labelTier !== 'First Label') {
    const labelName = _wrExtractLabelName(product, producer);
    if (labelName) cuvee = labelName;
  }
  const namePart = cuvee ? `${name} - ${cuvee}` : name;
  const parent = _wrParentRegion(r);
  const parts = [namePart, region];
  if (parent && parent !== region) parts.push(parent);
  const base = (vintage ? vintage + ' ' : '') + parts.join(', ');
  // [FIX 2026-07-30] always append the size now, including the plain 750ml default — not just
  // Magnum/Half/etc — since same producer+vintage often has separate SKUs at different sizes
  // (e.g. Clerc Milon 2005 exists as a standard bottle, a 3L Magnum, AND a 5L Magnum) that would
  // otherwise render with an identical display name.
  return `${base} ${_wrBottleSize(product)}`;
}

// [NEW 2026-07-29] highlights 4-digit years and "quoted phrases" inside an
// already-_wrEsc'd tooltip paragraph — turns a wall of Thai prose into a
// scannable list of dates/names picked out in the accent color, without
// touching the underlying text. Must run AFTER _wrEsc (so no raw < > from the
// source string can inject markup) and BEFORE the string is inserted as HTML.
function _wrHighlightTip(escapedText, accentColor) {
  // [FIX] quoted-phrase pass must run BEFORE the year pass. The year replace injects
  // its own `style="color:...;font-weight:700"` attribute (itself wrapped in double
  // quotes); if that ran first, the quote-highlighter would then match those injected
  // attribute quotes as if they were a quoted phrase in the source text and wrap them
  // in a nested <span>, corrupting the <b style=...> tag into unparseable markup that
  // the browser renders as literal text instead of a styled year.
  return String(escapedText)
    .replace(/"([^"\n]{2,60}?)"/g, `<span style="color:${accentColor}">"$1"</span>`)
    .replace(/\b(1[5-9]\d{2}|20\d{2})\b/g, `<b style="color:${accentColor};font-weight:700">$1</b>`)
    // [NEW 2026-08-05] user-authored formatting, typed straight into the editable tooltip/note
    // textarea: **text** → bold, ==text== → colored highlight (accent color, same one used for
    // the automatic quote/year styling above, so it stays visually consistent per-tooltip).
    // Runs LAST for the same reason the year pass runs after the quote pass — both new passes
    // inject their own style="..." attribute, and if either ran before the quoted-phrase pass,
    // that pass would wrongly match the attribute's own quote marks as a quoted phrase in the
    // source text and corrupt the tag.
    .replace(/\*\*([^\n*]{1,200}?)\*\*/g, '<b style="font-weight:700">$1</b>')
    // [FIX 2026-08-05] the highlight pass runs AFTER the bold pass so **==text==** or
    // ==**text**== both work (nested, both styles apply) — but that means by the time this
    // regex runs, the string may already contain a `style="..."` attribute injected by the
    // bold/year pass above sitting BETWEEN the two `==` markers (e.g. `==**text**==` becomes
    // `==<b style="font-weight:700">text</b>==` after the bold pass). Originally this excluded
    // `=` from the captured content (same idea as excluding `*` in the bold pass, to stop a
    // non-greedy match from running past the intended closing `==`) — but `style="..."` itself
    // contains a literal `=`, so that exclusion silently broke the match here specifically, and
    // combined bold+highlight text just rendered with the `==`/`**` markers left in as plain
    // text. Only newline is excluded now; the non-greedy `{1,200}?` still reliably stops at the
    // nearest closing `==` on its own, without needing to exclude `=` from the content itself.
    .replace(/==([^\n]{1,200}?)==/g, `<mark style="background:${accentColor}30;color:${accentColor};padding:0 2px;border-radius:3px;font-weight:600">$1</mark>`);
}

// ── tier/appellation tooltip body — WR_TIER_DESCRIPTIONS entries are usually a single
//    string, but some (e.g. "aoc", which covers both the French AOC system and its
//    EU-law AOP counterpart) read better split into separate paragraphs. Accepts either
//    a plain string (rendered as-is, unchanged from before) or an array of paragraph
//    strings (each escaped + spaced apart).
function _wrTipBody(val) {
  if (Array.isArray(val)) {
    return val.map(p => `<div>${_wrEsc(p)}</div>`).join('<div style="height:9px"></div>');
  }
  return _wrEsc(val || '');
}

// [NEW] per-product custom notes — every wine (not just the curated WR_NAME_TIPS 5) can now
// carry a free-text tooltip note the user writes themselves, tap-to-read the same way as the
// classification tip. Keyed by barcode so duplicate-barcode rows share the same note; falls
// back to the raw product string when a row has no barcode at all.
// [UPDATED 2026-08-03] now synced to Firebase RTDB (cloud key 'wholesaleNotes') the same way
// records/shelves/catalogDelta already are — localStorage stays as the instant-read/offline
// cache, but the source of truth is cloud so notes follow the user across devices instead of
// being stuck on whichever phone/browser wrote them. Saves push up debounced; syncFromCloud()
// pulls the latest on boot/reconnect, and a realtime listener (see _attachCloudListeners)
// keeps other open tabs/devices caught up without a manual refresh.
const WR_NOTES_KEY = 'wholesale-custom-notes';
let _wrCustomNotes = {};
(function _wrLoadCustomNotes(){
  try { _wrCustomNotes = JSON.parse(localStorage.getItem(WR_NOTES_KEY) || '{}') || {}; }
  catch (e) { _wrCustomNotes = {}; }
})();
function _wrNoteKey(r) {
  return String((r && r[0]) || (r && r[1]) || '').trim();
}
function _wrGetCustomNote(key) {
  return (key && _wrCustomNotes[key]) || '';
}
// debounced cloud push — mirrors cloudSetRecords/cloudSetShelves pattern (280ms), defined once
// so rapid saves collapse into a single RTDB write instead of one per keystroke-save.
const _wrCloudSetNotes = (typeof _dbounce === 'function' && typeof cloudSet === 'function')
  ? _dbounce(()=>cloudSet('wholesaleNotes', _wrCustomNotes), 280)
  : null;
function _wrSaveCustomNote(key, text) {
  if (!key) return;
  const trimmed = String(text || '').trim();
  if (trimmed) _wrCustomNotes[key] = trimmed;
  else delete _wrCustomNotes[key];
  try { localStorage.setItem(WR_NOTES_KEY, JSON.stringify(_wrCustomNotes)); } catch (e) { /* storage full — edit still applies for this session */ }
  if (_wrCloudSetNotes) _wrCloudSetNotes(); // push to Firebase so other devices pick it up
  if (typeof _wrClearDetailCache === 'function') _wrClearDetailCache();
}
// merges a cloud snapshot of notes into the local cache + localStorage, then re-renders
// whichever wholesale detail sheet is currently open (if any) so an edit made on another
// device shows up immediately without the user having to close/reopen the card.
function _wrMergeCloudNotes(cNotes) {
  if (!cNotes || typeof cNotes !== 'object') return;
  _wrCustomNotes = cNotes;
  try { localStorage.setItem(WR_NOTES_KEY, JSON.stringify(_wrCustomNotes)); } catch (e) {}
  if (typeof _wrClearDetailCache === 'function') _wrClearDetailCache();
  if (typeof _wrCurrentDetailIndex === 'number' && _wrCurrentDetailIndex >= 0 && typeof _wrOpenDetail === 'function') {
    _wrOpenDetail(_wrCurrentDetailIndex); // re-render open sheet in place with the merged note
  }
}
// splits a raw textarea value into paragraphs (blank line = new paragraph; single newlines
// inside a paragraph are treated as soft wraps and joined with a space) for display via the
// same paragraph-card styling _wrTipBody/descParas already use.
function _wrNoteParas(text) {
  return String(text || '').split(/\n\s*\n/).map(p => p.trim().replace(/\s*\n\s*/g, ' ')).filter(Boolean);
}

// [NEW 2026-08-03] curated tooltip overrides — lets the built-in classification tooltip text
// (WR_TIER_DESCRIPTIONS + WR_TIER_RULES' tipTitle/short) and the wine-name tooltip text
// (WR_NAME_TIPS' pronun/desc) be corrected or rewritten directly from the UI. Unlike
// "your note" above (which is a personal free-text addition per barcode), this REPLACES the
// shared curated copy every reader sees — so it's the same for everyone, synced via one
// shared cloud key ('tipOverrides'), the same pattern as records/shelves/wholesaleNotes.
// kind: 'name' → keyed by WR_NAME_TIPS' `key`. kind: 'tier' → keyed by WR_TIER_RULES' `key`
// (shared by both the primary classification ribbon and any secondary AOC/DOCG/DOCa tag,
// since both look up WR_TIER_DESCRIPTIONS by the same tier key).
const WR_TIP_OVERRIDES_KEY = 'wholesale-tip-overrides';
let _wrTipOverrides = { name: {}, tier: {}, vintage: {} };
(function _wrLoadTipOverrides(){
  try {
    const saved = JSON.parse(localStorage.getItem(WR_TIP_OVERRIDES_KEY) || 'null');
    if (saved && typeof saved === 'object') _wrTipOverrides = { name: saved.name || {}, tier: saved.tier || {}, vintage: saved.vintage || {} };
  } catch (e) { /* keep defaults */ }
})();
function _wrGetTipOverride(kind, key) {
  return (key && _wrTipOverrides[kind] && _wrTipOverrides[kind][key]) || null;
}
// debounced cloud push — mirrors _wrCloudSetNotes' pattern (280ms), defined once so rapid
// saves collapse into a single RTDB write instead of one per keystroke-save.
const _wrCloudSetTipOverrides = (typeof _dbounce === 'function' && typeof cloudSet === 'function')

// [NEW 2026-07-30] bottle-size badge — most rows are standard 750ml and carry no size text
// in the product name at all, but Magnums/Halves/Minis/Specials spell it out inline in all
// kinds of inconsistent ways ("1.5L Magnum", "Half 0.375L", "375ml.", "50cl.", "Mini 0.25L",
// "1.5ltr.", "0.620L Special", "0.5L Bottle"...). This normalizes whatever's there into one
// consistent "<size> <unit>[. Magnum/Half/Mini]" label; falls back to the standard 750 ml.
// bottle size when the name doesn't mention one at all.
function _wrBottleSize(product) {
  const s = String(product || '');
  const m = s.match(/(\d+(?:\.\d+)?)\s*(ml\.?|litre?s?\.?|ltr\.?|l\.?|cl\.?)\b/i);
  if (!m) return '750 ml.';
  const num = parseFloat(m[1]);
  const unit = m[2].toLowerCase();
  let ml;
  if (unit.startsWith('ml')) ml = num;
  else if (unit.startsWith('cl')) ml = num * 10;
  else ml = num * 1000; // l / ltr / litre(s)
  let label = ml >= 1000
    ? `${Number.isInteger(ml / 1000) ? ml / 1000 : (ml / 1000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '')} L.`
    : `${Math.round(ml)} ml.`;
  if (/magnum/i.test(s)) {
    // [FIX 2026-07-30] Bordeaux trade naming: 3 L. is called "Double Magnum" (not "3L Magnum"),
    // and 6 L. is "Imperial" — only 1.5 L. is actually called plain "Magnum". Other houses (e.g.
    // Champagne/Burgundy) call 3 L. "Jeroboam" instead, but every 3 L./6 L. SKU currently in the
    // catalog is Bordeaux, so the Bordeaux terms are used here.
    if (ml === 3000) label += ' Double Magnum';
    else if (ml === 6000) label += ' Imperial';
    else label += ' Magnum';
  }
  else if (/mini/i.test(s)) label += ' Mini';
  else if (/half/i.test(s) || ml === 375 || ml === 187) label += ' Half';
  else if (/special/i.test(s)) label += ' Special';
  return label;
}

function _wrFmtPrice(v) {

// ส่วนลดจากราคาปลีก เมื่อซื้อ 6 ขวดขึ้นไป (ราคาส่ง) — คำนวณ % และจำนวนเงินที่ประหยัดได้ครั้งเดียว
// ใช้ร่วมกันทั้ง label แบบข้อความล้วน (_wrWholesaleDiscountLabel) และ badge แบบ HTML (_wrWholesaleDiscountBadgeHTML)
function _wrWholesaleDiscountParts(retail, wholesale6) {
  const r = Number(retail), w = Number(wholesale6);
  if (!isFinite(r) || !isFinite(w) || r <= 0 || w <= 0 || w >= r) return null;
  const pct = Math.round((1 - w / r) * 100);
  if (pct <= 0) return null;
  return { pct, baht: r - w };
}

// คืนสตริงเช่น "-15% · -50 บาท" หรือ '' ถ้าคำนวณไม่ได้/ไม่มีส่วนลด
function _wrWholesaleDiscountLabel(retail, wholesale6) {

  if (!parts) return '';
  const bahtStr = parts.baht.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return `-${parts.pct}% · -${bahtStr} บาท`;

// ข้อความ "บาท/ขวด · ประหยัด ฿xx" ใช้แทนบรรทัดหน่วยเดิมของช่องราคาส่ง เมื่อมีส่วนลด

// guards single-grape names that happen to contain a comma-like separator so the generic

// splits a grape field like "54% Merlot | 26% Malbec | 20% Syrah" into

// classifies a grape variety as white-skinned vs red/black-skinned so its badge chip can be
// tinted accordingly. Most white varieties in the sheet carry an explicit qualifier

function _wrGrapeIsWhite(name) {

// true if `name` (product name) mentions `grapeName` as a standalone word/phrase — used to infer
// a wine's variety when the sheet's own grape column is blank but the name spells it out
// (e.g. a product simply titled "... Cabernet Sauvignon ..." with no separate grape data)
function _wrNameImpliesGrape(name, grapeName) {
  if (!name || !grapeName) return false;
  const esc = grapeName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(^|[^a-zA-Z])${esc}([^a-zA-Z]|$)`, 'i');
  return re.test(name);
}

// splits a grape field into {name, pct} pairs, keeping the percentage when the sheet states
// one (leading "82% Cabernet Sauvignon" or trailing "Cabernet Sauvignon 82%") and leaving
// pct null when the blend has no stated ratio (e.g. "Merlot | Cabernet Franc")
function _wrGrapeParts(grapes) {
  if (!grapes) return [];
  return _wrNormalizeGrapeField(grapes).split(/[|,/]/).map(s => s.trim()).filter(Boolean).map(s => {
    let m = s.match(/^(\d+(?:\.\d+)?)\s*%\s*(.+)$/);
    if (m) return { name: m[2].trim(), pct: parseFloat(m[1]) };
    m = s.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*%$/);
    if (m) return { name: m[1].trim(), pct: parseFloat(m[2]) };
    return { name: s.replace(/\d+(\.\d+)?\s*%/g, '').trim(), pct: null };
  }).filter(p => p.name);
}

// returns 0-100 effective percentage of `grapeName` (case-insensitive) within a grape field,
// filling any unstated percentages evenly across the blend's remaining share — same logic as
// the donut chart below, so "ตรงที่สุด" sort agrees with what the detail card shows.
// A 100%-stated single varietal (or a blend with only that grape named) returns 100.
// When the grape field itself is blank, `productName` (if given) is checked instead — a wine
// with no grape data but whose name spells out the variety is treated as 100% that variety.
function _wrGrapePctOf(grapes, grapeName, productName) {
  const parts = _wrGrapeParts(grapes);
  if (!parts.length) {
    return (productName && _wrNameImpliesGrape(productName, grapeName)) ? 100 : 0;
  }
  const hasAnyPct = parts.some(p => p.pct != null);
  let withPct;
  if (hasAnyPct) {
    const knownSum = parts.reduce((s, p) => s + (p.pct || 0), 0);
    const missing = parts.filter(p => p.pct == null);
    const each = missing.length ? Math.max(0, 100 - knownSum) / missing.length : 0;
    withPct = parts.map(p => ({ name: p.name, pct: p.pct != null ? p.pct : each }));
  } else {
    const each = 100 / parts.length;
    withPct = parts.map(p => ({ name: p.name, pct: each }));
  }
  const total = withPct.reduce((s, p) => s + p.pct, 0) || 1;
  const target = grapeName.toLowerCase();
  const hit = withPct.find(p => p.name.toLowerCase() === target);
  return hit ? (hit.pct / total) * 100 : 0;
}

// cycling palette for grape pie slices/legend dots — distinct enough from each other and from
// the type/country/vintage badge colors used elsewhere on the same detail card
const WR_GRAPE_PIE_PALETTE = ['#c78aff', '#4bcffa', '#00d4aa', '#ffd200', '#ff6b81', '#8ff0dc', '#ffa652', '#7c9cff'];

// renders the grape composition as a donut chart + color-keyed legend. When the sheet gives no
// percentages at all, the slices are split evenly just to visualize the blend's makeup; when
// only some grapes have a stated percentage, the rest evenly share whatever's left of 100%.
function _wrGrapePieHtml(grapes) {
  const parts = _wrGrapeParts(grapes);
  if (!parts.length) return '';

  const hasAnyPct = parts.some(p => p.pct != null);
  let withPct;
  if (hasAnyPct) {
    const knownSum = parts.reduce((s, p) => s + (p.pct || 0), 0);
    const missing = parts.filter(p => p.pct == null);
    const each = missing.length ? Math.max(0, 100 - knownSum) / missing.length : 0;
    withPct = parts.map(p => ({ name: p.name, pct: p.pct != null ? p.pct : each }));
  } else {
    const each = 100 / parts.length;
    withPct = parts.map(p => ({ name: p.name, pct: each }));
  }

  const total = withPct.reduce((s, p) => s + p.pct, 0) || 1;
  let cum = 0;
  const stops = withPct.map((p, i) => {
    const start = (cum / total) * 360;
    cum += p.pct;
    const end = (cum / total) * 360;
    return `${WR_GRAPE_PIE_PALETTE[i % WR_GRAPE_PIE_PALETTE.length]} ${start}deg ${end}deg`;
  }).join(', ');

  const dominant = withPct.reduce((best, p) => (p.pct > best.pct ? p : best), withPct[0]);
  const dominantPct = Math.round((dominant.pct / total) * 100);

  const legend = withPct.map((p, i) => {
    const color = WR_GRAPE_PIE_PALETTE[i % WR_GRAPE_PIE_PALETTE.length];
    const pctVal = (p.pct / total) * 100;
    const pctLabel = pctVal.toFixed(p.pct % 1 === 0 ? 0 : 1);

        <span style="font-family:'Prompt',sans-serif;font-size:11px;color:#dce6f5;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_wrEsc(p.name)}</span>
        <span class="wr-pct-num" data-target="${pctLabel}" style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;color:${color};flex-shrink:0">0%</span>
      </div>
      <div class="wr-legend-bar-track">
        <div class="wr-legend-bar-fill" style="background:${color};color:${color};--wr-bar-pct:${pctVal}%;animation-delay:${barDelay}ms"></div>
      </div>
    </div>`;
  }).join('');

  return `
    <div style="margin-bottom:14px">
      <div style="font-family:'Prompt',sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;color:#c78affaa;text-transform:uppercase;margin-bottom:8px">Grapes</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="wr-pie-wrap" style="width:68px;height:68px">
          <div class="wr-pie-ring" style="width:68px;height:68px"></div>
          <div class="wr-pie-donut" style="width:68px;height:68px;background:conic-gradient(${stops})"></div>
          <div class="wr-pie-hole" style="width:38px;height:38px">
            <span class="wr-pct-num" data-target="${dominantPct}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;color:#e8f0ff;line-height:1">0%</span>
          </div>
        </div>
        <div style="flex:1;min-width:0">${legend}</div>
      </div>
    </div>
  `;
}

// animates every .wr-pct-num inside the detail card from 0 up to its data-target value —
// call once right after the detail body's innerHTML (containing a grape pie) is set
function _wrAnimateGrapePie(container) {
  const nums = (container || document).querySelectorAll('.wr-pct-num');
  nums.forEach(el => {
    const target = parseFloat(el.getAttribute('data-target'));
    if (!isFinite(target)) return;
    const isFloat = el.getAttribute('data-target').includes('.');
    const duration = 900, start = performance.now();
    const tick = now => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = target * eased;
      el.textContent = (isFloat ? val.toFixed(1) : Math.round(val)) + '%';
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

// the sheet has inconsistent capitalization/accents for the same type ("Red wine" vs

function _wrCanonType(type) {

// multi-word phrases (e.g. "Extra Brut") are tested before the shorter generic word they
// contain (e.g. "Brut"), so a name only ever matches the most specific level it states.
const WR_SPARKLING_LEVELS = [
  { label: 'Brut Nature', test: n => /\bbrut nature\b|\bpas dos[ée]\b|\bdosage zero\b|\bzero dosage\b/.test(n) },
  { label: 'Extra Brut', test: n => /\bextra brut\b/.test(n) },
  { label: 'Brut', test: n => /\bbrut\b/.test(n) },
  { label: 'Extra Dry', test: n => /\bextra dry\b|\bextra sec\b/.test(n) },
  { label: 'Dry / Secco', test: n => /\bsecco\b|\bdry\b|\bsec\b/.test(n) },
  { label: 'Demi Sec', test: n => /\bdemi[- ]sec\b|\bsemi[- ]sec(o)?\b|\bmedium dry\b/.test(n) },
  { label: 'Sweet / Dolce', test: n => /\bdolce\b|\bsweet\b|\bdoux\b|\bmoelleux\b/.test(n) },
];

// returns the matched level's label (e.g. "Brut") for a Sparkling Wine row, or null if the
// row isn't sparkling or states no recognizable level in its name
function _wrSparklingLevelOf(r) {
  if (_wrCanonType(r[2]) !== 'Sparkling Wine') return null;
  const name = String(r[1] || '').toLowerCase();
  for (const lvl of WR_SPARKLING_LEVELS) {
    if (lvl.test(name)) return lvl.label;
  }
  return null;
}

// how many sparkling records state each level, e.g. Map{'Brut' => 34, ...}
function _wrSparklingLevelCounts() {
  const counts = new Map();
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const lvl = _wrSparklingLevelOf(r);
    if (lvl) counts.set(lvl, (counts.get(lvl) || 0) + 1);

  return counts;
}

  topNames.sort((a, b) => {

      border:1.5px solid ${isActive ? gc.idleColor : gc.idleBorder};background:${isActive ? gc.activeBackground : gc.idleBg};
      color:${isActive ? gc.activeTextColor : gc.idleColor};box-shadow:${isActive ? `0 0 10px ${gc.glow}` : 'none'}">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;

// "Fine Wine" is stored in the country slot (r[8]) itself for premium chateaux rows,
// which erases their actual origin. isFineWine() reads that tier flag, and realCountry()
// recovers the true country (from the classification/name text) so "Fine Wine" and
// "Italy"/"France"/etc. behave as two independent filter dimensions instead of colliding
// in one field.
function _wrIsFineWine(r) {
  return r[8] === 'Fine Wine';
}

function _wrRealCountry(r) {
  if (r[8] !== 'Fine Wine') return r[8];
  const hay = ((r[11] || '') + ' ' + (r[1] || '')).toLowerCase();
  if (hay.indexOf('chile') !== -1 || hay.indexOf('puente alto') !== -1) return 'Chile';
  if (hay.indexOf('napa valley') !== -1) return 'USA';
  if (hay.indexOf('bolgheri') !== -1 || hay.indexOf('sassicaia') !== -1) return 'Italy';
  return 'France'; // default: the vast majority of "Fine Wine" rows are Bordeaux chateaux
}

// how many records come from each country, e.g. Map{'France' => 399, ...} — uses the
// recovered real country so Fine Wine chateaux count toward their true origin, plus a
// separate 'Fine Wine' bucket counting the premium-tier rows themselves
function _wrCountryCounts() {
  const counts = new Map();
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const c = _wrRealCountry(r);
    if (c) counts.set(c, (counts.get(c) || 0) + 1);
    if (_wrIsFineWine(r)) counts.set('Fine Wine', (counts.get('Fine Wine') || 0) + 1);
  });
  return counts;
}

function _wrToggleCountryFilter(name) {
  if (_wrCountryFilters.has(name)) _wrCountryFilters.delete(name);
  else _wrCountryFilters.add(name);
  _wrRegionFilters.clear(); // regions are scoped to a single country's list, so any country change invalidates the old picks
  renderWholesaleResults();
}

function _wrClearCountryFilter() {
  _wrCountryFilters.clear();
  _wrRegionFilters.clear();
  renderWholesaleResults();
}

// how many records within the currently-selected single country/tier fall into each region
// (r[12]) — only meaningful once exactly one country (or 'Fine Wine') is active, since regions
// aren't unique across countries (e.g. several countries have a "Central Valley")
function _wrRegionCounts(country) {
  const counts = new Map();
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const inCountry = country === 'Fine Wine' ? _wrIsFineWine(r) : (_wrRealCountry(r) === country && !_wrIsFineWine(r));
    if (!inCountry) return;
    const region = r[12];
    if (region) counts.set(region, (counts.get(region) || 0) + 1);
  });
  return counts;
}

function _wrToggleRegionFilter(name) {
  if (_wrRegionFilters.has(name)) _wrRegionFilters.delete(name);
  else _wrRegionFilters.add(name);
  renderWholesaleResults();
}

function _wrClearRegionFilter() {
  _wrRegionFilters.clear();
  renderWholesaleResults();
}

let _wrQuickCatOpen = null; // 'type' | 'grape' | 'country' | null — which popover (if any) is open

const _WR_QUICKCAT_LABELS = { type: 'ประเภท', grape: 'พันธุ์องุ่น', country: 'แหล่งกำเนิด' };

// what a category button shows when collapsed: idle "ทั้งหมด", the single selected name,
// or "N รายการ" once 2+ things are picked within that category (region counts toward country)
function _wrQuickCatSummary(cat) {
  if (cat === 'type') {
    const n = _wrTypeFilters.size;
    if (!n) return { text: 'ทั้งหมด', accent: null, active: false };
    const first = Array.from(_wrTypeFilters)[0];
    return { text: n === 1 ? first : `${n} รายการ`, accent: _wrTypeColor(first, ''), active: true };
  }
  if (cat === 'grape') {
    const n = _wrGrapeFilters.size;
    if (!n) return { text: 'ทั้งหมด', accent: null, active: false };
    const first = Array.from(_wrGrapeFilters)[0];
    return { text: n === 1 ? first : `${n} รายการ`, accent: _wrGrapeColorInfo(first).idleColor, active: true };
  }
  // country — region is a nested refinement of country, so it counts toward the same button
  const cn = _wrCountryFilters.size, rn = _wrRegionFilters.size;
  if (!cn) return { text: 'ทั้งหมด', accent: null, active: false };
  const first = Array.from(_wrCountryFilters)[0];

  return { text: (total === 1) ? first : `${total} รายการ`, accent: _wrCountryRepColor(first), active: true };

// active-filter pills below the category row — empty (and hidden) until something's picked,
// so the screen stays uncluttered while browsing with no filters active
function _wrRenderActivePills() {
  const wrap = document.getElementById('wholesale-active-pills');

  const items = [];
