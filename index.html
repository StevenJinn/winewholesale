  _wrGrapeFilters.forEach(n => items.push({ name: n, accent: _wrGrapeColorInfo(n).idleColor, remove: `_wrToggleGrapeFilter('${n.replace(/'/g, "\\'")}')` }));
  _wrCountryFilters.forEach(n => items.push({ name: n, accent: _wrCountryRepColor(n), remove: `_wrToggleCountryFilter('${n.replace(/'/g, "\\'")}')` }));
  _wrRegionFilters.forEach(n => items.push({ name: n, accent: '#7c9cff', remove: `_wrToggleRegionFilter('${n.replace(/'/g, "\\'")}')` }));

  if (!items.length) { wrap.innerHTML = ''; wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.style.paddingTop = '8px';
  wrap.style.paddingBottom = '2px';

  const pillsHtml = items.map(it => `<span style="display:inline-flex;align-items:center;gap:5px;border:1px solid ${it.accent};background:${it.accent}1a;border-radius:20px;padding:4px 5px 4px 11px;font-family:'Prompt',sans-serif;font-size:11px;font-weight:600;color:${it.accent}">
    ${_wrEsc(it.name)}<span onclick="${it.remove}" style="background:rgba(255,255,255,.12);border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#fff;flex-shrink:0">×</span>
  </span>`).join('');

  const clearAllHtml = items.length > 1
    ? `<span onclick="_wrQuickCatClearAllPills()" style="font-family:'Prompt',sans-serif;font-size:10.5px;color:#6b7390;text-decoration:underline;padding:5px 2px;cursor:pointer;align-self:center">ล้างทั้งหมด</span>`
    : '';

  wrap.innerHTML = pillsHtml + clearAllHtml;
}

// clears only the quick-filter dimensions shown as pills (type/sparkling-level/grape/country/
// region) — deliberately does NOT touch price/vintage/classification/label-tier, which live in
// the separate Smart Filter sheet and aren't represented in this pill row, so this can't
// silently reset a setting the person can't see from here
function _wrQuickCatClearAllPills() {
  _wrTypeFilters.clear();
  _wrSparklingLevelFilters.clear();
  _wrGrapeFilters.clear();
  _wrCountryFilters.clear();
  _wrRegionFilters.clear();
  _wrUpdateSmartFilterDot();
  renderWholesaleResults();
}

// fills the popover body for whichever category is currently open — no-op if none is open, so
// this can be called unconditionally from renderWholesaleResults() on every result re-render
function _wrRenderQuickCatBody() {
  if (!_wrQuickCatOpen) return;
  const cat = _wrQuickCatOpen;
  const titleEl = document.getElementById('wholesale-quickcat-title');
  const bodyEl = document.getElementById('wholesale-quickcat-body');
  const clearEl = document.getElementById('wholesale-quickcat-clear');
  if (!bodyEl || !titleEl || !clearEl) return;

  if (cat === 'type') {
    titleEl.textContent = 'ประเภท · Wine Type';
    clearEl.onclick = _wrClearTypeFilter;
    let html = `<div style="display:flex;flex-wrap:wrap;gap:8px">${_wrSfChipsHtml(_wrTypeCounts(), _wrTypeFilters, '_wrToggleTypeFilter', name => _wrTypeColor(name, ''))}</div>`;
    const slCounts = _wrTypeFilters.has('Sparkling Wine') ? _wrSparklingLevelCounts() : new Map();
    if (slCounts.size) {
      html += `<div style="margin-top:18px">
        <div class="wr-sf-section-label">ระดับความหวาน · Sparkling Level</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${_wrSfChipsHtml(slCounts, _wrSparklingLevelFilters, '_wrToggleSparklingLevelFilter', null)}</div>
      </div>`;
    }
    bodyEl.innerHTML = html;
  } else if (cat === 'grape') {
    titleEl.textContent = 'พันธุ์องุ่น · Grape Variety';
    clearEl.onclick = _wrClearGrapeFilter;
    bodyEl.innerHTML = `<div id="wholesale-quickcat-grape-chips" style="display:flex;flex-wrap:wrap;gap:8px">${_wrSfGrapeChipsHtml('_wrToggleGrapeFilter')}</div>`;
  } else if (cat === 'country') {
    titleEl.textContent = 'แหล่งกำเนิด · Country';
    clearEl.onclick = _wrClearCountryFilter;
    let html = `<div style="display:flex;flex-wrap:wrap;gap:8px">${_wrSfCountryChipsHtml('_wrToggleCountryFilter')}</div>`;
    if (_wrCountryFilters.size === 1) {
      const country = Array.from(_wrCountryFilters)[0];
      const rCounts = _wrRegionCounts(country);
      if (rCounts.size) {
        html += `<div style="margin-top:18px">
          <div class="wr-sf-section-label">แคว้น · Region</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${_wrSfChipsHtml(rCounts, _wrRegionFilters, '_wrToggleRegionFilter', null)}</div>
        </div>`;
      }
    }
    bodyEl.innerHTML = html;
  }
}

function _wrOpenQuickCat(cat) {
  _wrQuickCatOpen = cat;
  _wrRenderQuickCatBody();
  const modal = document.getElementById('wholesale-quickcat-modal');
  if (modal) modal.style.display = 'flex';
}

function _wrCloseQuickCat() {
  _wrQuickCatOpen = null;
  const modal = document.getElementById('wholesale-quickcat-modal');
  if (modal) modal.style.display = 'none';
}

// toggles a producer's label tier (First Label / Second Label / Third Label / Related Cuvee)
// in/out of the filter set — tapped straight from the badge on a result card, same pattern
// as type/vintage/grape/country
function _wrToggleLabelTierFilter(labelTier) {
  if (_wrLabelTierFilters.has(labelTier)) _wrLabelTierFilters.delete(labelTier);
  else _wrLabelTierFilters.add(labelTier);
  renderWholesaleResults();
}

// tapped from the classification badge on a result card — same underlying _wrTierFilters Set
// as _wrSfToggleTier (used inside the Smart Filter sheet), but re-renders the results list
// directly and keeps the sheet's filter-count dot in sync for when it's opened next
function _wrToggleTierFilter(key) {
  if (_wrTierFilters.has(key)) _wrTierFilters.delete(key); else _wrTierFilters.add(key);
  _wrUpdateSmartFilterDot();
  renderWholesaleResults();
}

// [FIX 2026-08-03e] SUPERSEDED — the region section now lives inside the "country" popover body
// (_wrRenderQuickCatBody, cat==='country'), same condition (single country selected). No longer
// called — left as reference since _wrRegionCounts() is still used by the new popover.
// region chip strip only appears once a single country (or Fine Wine) is selected — with zero
// or 2+ countries active, "region" isn't a well-defined concept, so the strip is hidden and any
// stale region picks are cleared
function _wrRenderRegionChips() {
  const strip = document.getElementById('wholesale-region-chips');
  if (!strip) return;

  if (_wrCountryFilters.size !== 1) {
    if (_wrRegionFilters.size) _wrRegionFilters.clear();
    strip.innerHTML = '';
    strip.style.display = 'none';
    return;
  }

  const country = Array.from(_wrCountryFilters)[0];
  const counts = _wrRegionCounts(country);
  const names = Array.from(counts.entries())
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([name]) => name);

  if (!names.length) {
    strip.innerHTML = '';
    strip.style.display = 'none';
    return;
  }

  strip.style.display = 'flex';
  const rfCount = _wrRegionFilters.size;
  const allChip = `<button type="button" onclick="_wrClearRegionFilter()"
    style="flex-shrink:0;padding:6px 12px;border-radius:20px;font-family:'Prompt',sans-serif;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;
    border:1.5px solid ${rfCount ? 'rgba(255,255,255,.14)' : '#ffffff'};background:${rfCount ? 'rgba(255,255,255,.04)' : '#ffffff'};
    color:${rfCount ? '#9aa5c4' : '#0b0f1d'};box-shadow:${rfCount ? 'none' : '0 0 10px rgba(255,255,255,.5)'}">ทุกแคว้น</button>`;

  const chipsHtml = names.map(name => {
    const isActive = _wrRegionFilters.has(name);
    const count = counts.get(name) || 0;
    return `<button type="button" onclick="_wrToggleRegionFilter('${name.replace(/'/g, "\\'")}')"
      style="flex-shrink:0;padding:6px 12px;border-radius:20px;font-family:'Prompt',sans-serif;font-size:11px;font-weight:${isActive ? '700' : '600'};white-space:nowrap;cursor:pointer;
      border:1.5px solid ${isActive ? '#7c9cff' : 'rgba(124,156,255,.32)'};background:${isActive ? '#7c9cff' : 'rgba(124,156,255,.08)'};
      color:${isActive ? '#0b0f1d' : '#c3d1ff'};box-shadow:${isActive ? '0 0 10px #7c9cff80' : 'none'}">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
  }).join('');

  strip.innerHTML = allChip + chipsHtml;
}

// tapping a vintage badge on a result card toggles that year in/out of the filter set —
// multiple vintages can be selected at once, same ANY-match pattern as grape/country
function _wrToggleVintageFilter(vintage) {
  if (_wrVintageFilters.has(vintage)) _wrVintageFilters.delete(vintage);
  else _wrVintageFilters.add(vintage);
  renderWholesaleResults();
}

// [FIX 2026-08-03e] SUPERSEDED by #wholesale-cat-row / _wrRenderCatRow() + the popover body
// (_wrRenderQuickCatBody, cat==='country'), which now shares its flag-color logic with the
// Smart Filter sheet via _wrSfCountryChipsHtml(toggleFnName). No longer called — left as reference.
// always-visible horizontal strip of every country in the database — there are only
// a handful, so unlike grapes there's no need for a "more" overflow chip
function _wrRenderCountryChips() {
  const strip = document.getElementById('wholesale-country-chips');
  if (!strip) return;
  const counts = _wrCountryCounts();
  const names = Array.from(counts.entries())
    .sort((a, b) => {
      if (a[0] === 'Fine Wine') return -1;
      if (b[0] === 'Fine Wine') return 1;
      return b[1] - a[1] || a[0].localeCompare(b[0]);
    })
    .map(([name]) => name);

  const cfCount = _wrCountryFilters.size;
  const allChip = `<button type="button" onclick="_wrClearCountryFilter()"
    style="flex-shrink:0;padding:7px 13px;border-radius:20px;font-family:'Prompt',sans-serif;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;
    border:1.5px solid ${cfCount ? 'rgba(255,255,255,.14)' : '#ffffff'};background:${cfCount ? 'rgba(255,255,255,.04)' : '#ffffff'};
    color:${cfCount ? '#9aa5c4' : '#0b0f1d'};box-shadow:${cfCount ? 'none' : '0 0 10px rgba(255,255,255,.5)'}">ทั้งหมด</button>`;

  const chipsHtml = names.map(name => {
    const isActive = _wrCountryFilters.has(name);
    const count = counts.get(name) || 0;
    const isFineWine = name === 'Fine Wine';
    const flagColors = isFineWine ? null : _wrFlagColors(name);
    const BORDER_COLOR_OVERRIDES = {
      'Australia': '#4A90E2', 'New Zealand': '#4A90E2', 'USA': '#4A90E2', 'Chile': '#4A90E2',
      'Germany': '#FFD400', 'Portugal': '#FFD400'
    };
    const repColor = BORDER_COLOR_OVERRIDES[name] || _wrReadableFlagColor(flagColors);

    const activeBg = isFineWine ? '#ffd200' : (repColor || '#00d4aa');
    const activeText = '#0b0f1d';
    const idleColor = isFineWine ? '#ffe89a' : (repColor ? repColor : '#8ff0dc');
    const idleBorder = isFineWine ? 'rgba(255,210,0,.35)' : (repColor ? `${repColor}59` : 'rgba(0,212,170,.35)');
    const idleBg = isFineWine ? 'rgba(255,210,0,.08)' : (repColor ? `${repColor}14` : 'rgba(0,212,170,.08)');
    const activeBackground = (!isFineWine && flagColors)
      ? _wrFlagBackgroundCSS(name, flagColors)
      : activeBg;
    const activeTextColor = (!isFineWine && flagColors) ? '#fff' : activeText;
    const activeTextShadow = (!isFineWine && flagColors) ? 'text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);' : '';
    // เยอรมนี = เหลือง, โปรตุเกส = เขียว ตามที่กำหนดไว้ ส่วนประเทศอื่นใช้สีตามธงจริง (activeBg) เหมือนเดิม
    const ACTIVE_BORDER_OVERRIDES = { 'Germany': '#FFD400', 'Portugal': '#2ECC71' };
    const activeBorder = ACTIVE_BORDER_OVERRIDES[name] || activeBg;
    return `<button type="button" onclick="_wrToggleCountryFilter('${name.replace(/'/g, "\\'")}')"
      style="flex-shrink:0;padding:7px 13px;border-radius:20px;font-family:'Prompt',sans-serif;font-size:11.5px;font-weight:${isActive ? '700' : '600'};white-space:nowrap;cursor:pointer;
      border:1.5px solid ${isActive ? activeBorder : idleBorder};background:${isActive ? activeBackground : idleBg};
      color:${isActive ? activeTextColor : idleColor};${isActive ? activeTextShadow : ''}box-shadow:${isActive ? `0 0 10px ${activeBg}80` : 'none'}">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
  }).join('');

  strip.innerHTML = allChip + chipsHtml;
  _wrRenderRegionChips();
}

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4bcffa" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>

          oninput="_wrOnGrapeSearchInput(this.value)"
          style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(199,138,255,.3);border-radius:8px;
          padding:7px 10px;font-family:'Prompt',sans-serif;font-size:12px;color:#e8f6ff;outline:none" />
      </div>
      <div id="wr-grape-items">${itemsHtml}</div>

  } else {

      const label = r.modes ? _wrSortLabels[r.modes.includes(_wrSortMode) ? _wrSortMode : r.modes[0]] : _wrSortLabels[r.key];
      const hasArrow = !!r.submenu;
      return `<div onclick="_wrPickSort('${r.key}')"
        style="display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;font-family:'Prompt',sans-serif;font-size:12.5px;
        font-weight:${isActive ? '700' : '500'};color:${isActive ? '#4bcffa' : '#e8f6ff'};background:${isActive ? 'rgba(75,207,250,.08)' : 'transparent'}">
        <span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${isActive ? '#4bcffa' : 'transparent'};border:1.5px solid ${isActive ? '#4bcffa' : 'rgba(255,255,255,.25)'};box-shadow:${isActive ? '0 0 5px #4bcffa' : 'none'}"></span>
        <span style="flex:1">${label}</span>
        ${hasArrow ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>` : ''}
      </div>`;
    }).join('');
    triggerLabel = gfCount ? gfLabelShort : _wrSortLabels[_wrSortMode];
  }

  row.innerHTML = `<div id="wholesale-sort-wrap" style="position:relative;width:100%">

      ${triggerLabel}
      ${gfCount ? `<span onclick="event.stopPropagation();_wrClearGrapeFilter()"
        style="position:absolute;right:36px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        background:rgba(255,255,255,.08);color:#cfe9ff;font-size:11px;line-height:1;cursor:pointer">✕</span>
        <span style="position:absolute;right:29px;top:50%;transform:translateY(-50%);width:1px;height:16px;background:rgba(255,255,255,.15);pointer-events:none"></span>` : ''}
      <svg id="wholesale-sort-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4bcffa" stroke-width="2.5"
        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);transition:transform .15s ease;pointer-events:none"><path d="M6 9l6 6 6-6"/></svg>

  // if the dropdown is open and showing the grape submenu, restore focus/caret to the

  if (_wrSortDDOpen && _wrSortSubmenu === 'grape') {
    const si = document.getElementById('wr-grape-search');
    if (si) { si.focus(); const v = si.value; si.value = ''; si.value = v; }

function _wrUpdateSearchIcon() {

function openWholesaleModal() {

  _wrResetResultsPagination();
}

// ── Smart Filter sheet ──────────────────────────────────────────────────
function _wrVintageBounds() {
  let min = null, max = null;
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const y = parseInt(r[3], 10);
    if (!isNaN(y)) { if (min === null || y < min) min = y; if (max === null || y > max) max = y; }
  });
  if (min === null) { const cy = new Date().getFullYear(); min = cy - 20; max = cy; }
  return { min, max };
}

function _wrSfChipsHtml(counts, selectedSet, toggleFnName, colorFn) {
  const names = Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([n]) => n);
  return names.map(name => {
    const active = selectedSet.has(name);
    const count = counts.get(name) || 0;
    if (colorFn) {
      // same colored-chip treatment as the wholesale page's own wine-type quick-filter strip
      const accent = colorFn(name);
      const accentRgb = _wrHexToRgb(accent);
      const style = `border:1.5px solid ${active ? accent : `rgba(${accentRgb},.35)`};background:${active ? accent : `rgba(${accentRgb},.08)`};color:${active ? '#0b0f1d' : accent};box-shadow:${active ? `0 0 10px ${accent}80` : 'none'}`;
      return `<button type="button" class="wr-sf-chip${active ? ' active' : ''}" style="${style}" onclick="${toggleFnName}('${name.replace(/'/g, "\\'")}')">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
    }
    return `<button type="button" class="wr-sf-chip${active ? ' active' : ''}" onclick="${toggleFnName}('${name.replace(/'/g, "\\'")}')">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
  }).join('');
}

// [FIX 2026-08-03e] representative flag color for a country/Fine Wine name — factored out of
// _wrSfCountryChipsHtml so the identical color logic (and therefore identical flag colors) can
// be reused anywhere else a single-country accent is needed, e.g. the quick-filter category
// button summary (_wrQuickCatSummary) — single source of truth, nothing about flag rendering
// changes, it's the exact same override table + _wrReadableFlagColor fallback as before.
function _wrCountryRepColor(name) {
  if (name === 'Fine Wine') return '#ffd200';
  const BORDER_COLOR_OVERRIDES = {
    'Australia': '#4A90E2', 'New Zealand': '#4A90E2', 'USA': '#4A90E2', 'Chile': '#4A90E2',
    'Germany': '#FFD400', 'Portugal': '#FFD400'
  };
  if (BORDER_COLOR_OVERRIDES[name]) return BORDER_COLOR_OVERRIDES[name];
  return _wrReadableFlagColor(_wrFlagColors(name)) || '#00d4aa';
}

// country chips ใน Smart Filter — เอา logic สีธง/รูปธงจริงชุดเดียวกับ _wrRenderCountryChips()
// (หน้า wholesale search หลัก) มาใช้ ต่างกันแค่ onclick ไปที่ _wrSfToggleCountry แทน
// _wrToggleCountryFilter แต่ผูก state _wrCountryFilters ตัวเดียวกัน จึงซิงค์กับหน้าหลักอัตโนมัติ
// [FIX 2026-08-03e] เพิ่ม param toggleFnName (default เดิม '_wrSfToggleCountry') เพื่อให้
// popover หมวดหมู่ด่วนตัวใหม่เรียกใช้ฟังก์ชันนี้ตัวเดียวกันได้ (ผูก '_wrToggleCountryFilter'
// แบบ apply-ทันทีแทน) โดยสีธง/ไล่เฉด/ทุกอย่างเหมือนเดิมเป๊ะ ไม่มีการ fork logic เป็นชุดที่สอง
function _wrSfCountryChipsHtml(toggleFnName) {
  toggleFnName = toggleFnName || '_wrSfToggleCountry';
  const counts = _wrCountryCounts();
  const names = Array.from(counts.entries())
    .sort((a, b) => {
      if (a[0] === 'Fine Wine') return -1;
      if (b[0] === 'Fine Wine') return 1;
      return b[1] - a[1] || a[0].localeCompare(b[0]);
    })
    .map(([name]) => name);

  return names.map(name => {
    const isActive = _wrCountryFilters.has(name);
    const count = counts.get(name) || 0;
    const isFineWine = name === 'Fine Wine';
    const flagColors = isFineWine ? null : _wrFlagColors(name);
    const repColor = _wrCountryRepColor(name);

    const activeBg = isFineWine ? '#ffd200' : (repColor || '#00d4aa');
    const activeText = '#0b0f1d';
    const idleColor = isFineWine ? '#ffe89a' : (repColor ? repColor : '#8ff0dc');
    const idleBorder = isFineWine ? 'rgba(255,210,0,.35)' : (repColor ? `${repColor}59` : 'rgba(0,212,170,.35)');
    const idleBg = isFineWine ? 'rgba(255,210,0,.08)' : (repColor ? `${repColor}14` : 'rgba(0,212,170,.08)');
    const activeBackground = (!isFineWine && flagColors)
      ? _wrFlagBackgroundCSS(name, flagColors)
      : activeBg;
    const activeTextColor = (!isFineWine && flagColors) ? '#fff' : activeText;
    const activeTextShadow = (!isFineWine && flagColors) ? 'text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);' : '';
    const ACTIVE_BORDER_OVERRIDES = { 'Germany': '#FFD400', 'Portugal': '#2ECC71' };
    const activeBorder = ACTIVE_BORDER_OVERRIDES[name] || activeBg;
    return `<button type="button" class="wr-sf-chip${isActive ? ' active' : ''}" onclick="${toggleFnName}('${name.replace(/'/g, "\\'")}')"
      style="border:1.5px solid ${isActive ? activeBorder : idleBorder};background:${isActive ? activeBackground : idleBg};
      color:${isActive ? activeTextColor : idleColor};${isActive ? activeTextShadow : ''}box-shadow:${isActive ? `0 0 10px ${activeBg}80` : 'none'}">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
  }).join('');
}

function _wrSfToggleType(name) {
  if (_wrTypeFilters.has(name)) _wrTypeFilters.delete(name); else _wrTypeFilters.add(name);
  _wrRenderSmartFilterSheet();
}
function _wrSfToggleCountry(name) {
  if (_wrCountryFilters.has(name)) _wrCountryFilters.delete(name); else _wrCountryFilters.add(name);
  _wrRegionFilters.clear(); // regions are scoped to a single country's list, same rule as the main country chips
  _wrRenderSmartFilterSheet();
}
function _wrSfToggleGrape(name) {
  if (_wrGrapeFilters.has(name)) _wrGrapeFilters.delete(name); else _wrGrapeFilters.add(name);
  _wrRenderSmartFilterSheet();
}
function _wrSfToggleSparklingLevel(name) {
  if (_wrSparklingLevelFilters.has(name)) _wrSparklingLevelFilters.delete(name); else _wrSparklingLevelFilters.add(name);
  _wrRenderSmartFilterSheet();
}
function _wrSfToggleTier(key) {
  if (_wrTierFilters.has(key)) _wrTierFilters.delete(key); else _wrTierFilters.add(key);
  _wrRenderSmartFilterSheet();
}

// counts how many rows in the active DB match each WR_TIER_RULES classification key —
// same one-tier-per-wine logic as _wrWineTier() used for the card badge itself, just tallied
// across the whole DB instead of a single row.
function _wrTierCounts() {
  const counts = new Map();
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const t = _wrWineTier(r);
    if (t) counts.set(t.key, (counts.get(t.key) || 0) + 1);
  });
  return counts;
}

// "ระดับไวน์ · Classification" chip row inside Smart Filter — every WR_TIER_RULES key that
// actually appears in the DB, kept in the same rank order (highest classification first)
// rather than sorted by count, since that hierarchy — not frequency — is what makes this
// list scannable. Each chip's color is derived the exact same way the card badge itself is
// (_wrTierVisual + _wrTierColor): below rank 60 that's the classification's own hue from
// _WR_TIER_KEY_COLORS, but rank 60+ (grand/legendary band) flattens to the shared purple/gold
// band color regardless of key — using the raw per-key color unconditionally here previously
// made e.g. gcc/gcru/firstgrowth chips show distinct hues that didn't match their own flat-
// colored badge on the card. Short label (e.g. "1ER CRU", "DOCG") matches the badge text.
function _wrSfTierChipsHtml() {
  const counts = _wrTierCounts();
  return WR_TIER_RULES.filter(rule => counts.get(rule.key)).map(rule => {
    const active = _wrTierFilters.has(rule.key);
    const count = counts.get(rule.key) || 0;
    const accent = _wrTierColor(_wrTierVisual(rule));
    const accentRgb = _wrHexToRgb(accent);
    const style = `border:1.5px solid ${active ? accent : `rgba(${accentRgb},.35)`};background:${active ? accent : `rgba(${accentRgb},.08)`};color:${active ? '#0b0f1d' : accent};box-shadow:${active ? `0 0 10px ${accent}80` : 'none'}`;
    return `<button type="button" class="wr-sf-chip${active ? ' active' : ''}" style="${style}" onclick="_wrSfToggleTier('${rule.key}')">${_wrEsc(rule.short)} <span style="opacity:.65">${count}</span></button>`;
  }).join('');
}

// counts how many rows in the active DB carry each non-empty r[10] label-tier value
// (First Label / Second Label / Related Cuvee / etc.) — same tally pattern as _wrTierCounts()
function _wrLabelTierCounts() {
  const counts = new Map();
  ACTIVE_WHOLESALE_DB.forEach(r => {
    const lt = r[10];
    if (lt) counts.set(lt, (counts.get(lt) || 0) + 1);
  });
  return counts;
}

// "ป้ายฉลาก · Label" chip row inside Smart Filter — reuses the exact same gold/silver/bronze
// tierClass coloring already applied to the label-tier badge on a result card, so a chip here
// looks identical to tapping that badge directly. Sorted by count like the generic chip rows
// (via _wrSfChipsHtml) rather than a fixed rank, since there's no inherent hierarchy across
// "Related Cuvee" vs. label-tier variants the way there is for Classification.
function _wrSfLabelTierChipsHtml() {
  const colorFn = name => name === 'First Label' ? '#ffd76b' : name.startsWith('Second Label') ? '#c9d3e0' : name === 'Third Label' ? '#d8975a' : '#8ff0dc';
  return _wrSfChipsHtml(_wrLabelTierCounts(), _wrLabelTierFilters, '_wrSfToggleLabelTier', colorFn);
}
function _wrSfToggleLabelTier(name) {
  if (_wrLabelTierFilters.has(name)) _wrLabelTierFilters.delete(name); else _wrLabelTierFilters.add(name);
  _wrRenderSmartFilterSheet();
}

// Grape Variety row inside Smart Filter — same idea as the wholesale page's own quick-chip
// strip (_wrRenderGrapeChips / _WR_GRAPE_CHIP_LIMIT): collapsed by default to just the top
// varieties so the sheet doesn't get overwhelmed by every grape in the database, with a
// trailing chip to expand/collapse the rest in place.
// [FIX 2026-08-03e] เพิ่ม param toggleFnName (default เดิม '_wrSfToggleGrape') — เหตุผลเดียวกับ
// _wrSfCountryChipsHtml ด้านบน: popover หมวดหมู่ด่วนตัวใหม่เรียกฟังก์ชันนี้ตัวเดียวกันได้ ผูก
// '_wrToggleGrapeFilter' แบบ apply-ทันที สีพันธุ์องุ่น/การจัดกลุ่มแดง-ขาวเหมือนเดิมทุกจุด
function _wrSfGrapeChipsHtml(toggleFnName) {
  toggleFnName = toggleFnName || '_wrSfToggleGrape';
  const counts = _wrGrapeCounts();
  const allNames = Array.from(counts.entries())
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([n]) => n);
  let names = allNames;
  if (!_wrSfGrapeExpanded) {
    names = allNames.slice(0, _WR_GRAPE_CHIP_LIMIT);
    // keep any already-selected grape visible even if it falls outside the top N,
    // so a chip you picked never silently disappears when the row is collapsed
    _wrGrapeFilters.forEach(name => { if (allNames.includes(name) && !names.includes(name)) names.push(name); });
  }
  // re-group so black/red-skinned varieties sit together, then white-skinned together,
  // instead of interleaving by frequency — same grouping the wholesale page's own chip
  // strip uses (_wrRenderGrapeChips)
  names = names.slice().sort((a, b) => {
    const aw = _wrGrapeIsWhite(a) ? 1 : 0, bw = _wrGrapeIsWhite(b) ? 1 : 0;
    return aw - bw || (counts.get(b) - counts.get(a)) || a.localeCompare(b);
  });

  const chipsHtml = names.map(name => {
    const active = _wrGrapeFilters.has(name);
    const count = counts.get(name) || 0;
    const gc = _wrGrapeColorInfo(name);
    return `<button type="button" class="wr-sf-chip${active ? ' active' : ''}"
      style="border:1.5px solid ${active ? gc.idleColor : gc.idleBorder};background:${active ? gc.activeBackground : gc.idleBg};
      color:${active ? gc.activeTextColor : gc.idleColor};box-shadow:${active ? `0 0 10px ${gc.glow}` : 'none'}"
      onclick="${toggleFnName}('${name.replace(/'/g, "\\'")}')">${_wrEsc(name)}${count ? ` <span style="opacity:.65">${count}</span>` : ''}</button>`;
  }).join('');

  const hiddenCount = allNames.length - Math.min(_WR_GRAPE_CHIP_LIMIT, allNames.length);
  const toggleChip = hiddenCount > 0
    ? `<button type="button" onclick="_wrSfToggleGrapeExpanded()" class="wr-sf-chip" style="border-color:rgba(75,207,250,.35);background:rgba(75,207,250,.08);color:#8fe0ff;display:inline-flex;align-items:center;gap:4px">
        ${_wrSfGrapeExpanded ? 'ย่อ' : `พันธุ์อื่นๆ (${hiddenCount})`}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8fe0ff" stroke-width="3" style="transform:rotate(${_wrSfGrapeExpanded ? '-90' : '90'}deg)"><path d="M9 18l6-6-6-6"/></svg>
      </button>`
    : '';

  return chipsHtml + toggleChip;
}

function _wrSfRenderGrapeChips() {
  const wrap = document.getElementById('wr-sf-grape-chips');
  if (wrap) wrap.innerHTML = _wrSfGrapeChipsHtml('_wrSfToggleGrape');
  // [FIX 2026-08-03e] quick-filter popover's grape section shares the same expand/collapse
  // state — refresh it too if it's the one currently mounted (Smart Filter sheet and this
  // popover are never open at the same time, but both call through this one function)
  const qwrap = document.getElementById('wholesale-quickcat-grape-chips');
  if (qwrap) qwrap.innerHTML = _wrSfGrapeChipsHtml('_wrToggleGrapeFilter');
}

function _wrSfToggleGrapeExpanded() {
  _wrSfGrapeExpanded = !_wrSfGrapeExpanded;
  _wrSfRenderGrapeChips();
}


// combination-lock-style year picker for the vintage From/To fields — a single scroll-snap
// reel per side showing whole years (2001, 2002, 2003…), dragged like a luggage lock wheel
// instead of a dropdown list. Row height must match .wr-sf-year-reel-item's height.
const _WR_YEAR_ROWH = 40;

function _wrYearReelHtml(which, val, vb) {
  let items = '<div class="wr-sf-year-reel-pad"></div>';
  for (let y = vb.min; y <= vb.max; y++) {
    items += `<div class="wr-sf-year-reel-item${y === val ? ' active' : ''}" data-year="${y}">${y}</div>`;
  }
  items += '<div class="wr-sf-year-reel-pad"></div>';
  return `<div class="wr-sf-year-reel-wrap">
      <div class="wr-sf-year-window"></div>
      <div class="wr-sf-year-holo" id="wr-sf-year-holo-${which}">
        <div class="wr-sf-year-holo-panel"></div>
        <div class="wr-sf-year-holo-window"></div>
        <div class="wr-sf-year-holo-viewport" id="wr-sf-year-holo-viewport-${which}"></div>
      </div>
      <div class="wr-sf-year-reel" id="wr-sf-year-reel-${which}" data-which="${which}" data-value="${val}" onscroll="_wrYearReelScroll(this)" ontouchstart="_wrYearReelTouchStart(event,this)" ontouchmove="_wrYearReelTouchMove(event,this)" ontouchend="_wrYearReelTouchEnd(event,this)" ontouchcancel="_wrYearReelTouchEnd(event,this)">${items}</div>
    </div>`;
}

// continuous per-frame visual: rows sit on the surface of a cylinder viewed face-on, the
// same curvature math the floating holo readout uses (rotateX around the row's own center,
// pulling back in Z as it curls away, flattening in height per cos(theta)) — applied
// straight to the persistent reel items themselves, not just the popup, so the reel *is* a
// front-view rotating drum at rest and mid-drag, not a flat list that merely fades.
//
// Native scroll still drives which row is centered (scrollTop), so each item keeps its own
// linear resting position from document flow — the per-item transform only ADDS the delta
// between that linear position and where the row would actually sit on the curved surface
// (extraY = curveY - linearY), plus the rotation/depth/foreshortening. Rows past the
// RADIUS cutoff are hidden outright rather than transformed, since sin()/cos() are periodic
// and would otherwise produce nonsense angles for rows many steps away from center.
const _WR_YEAR_DRUM_RADIUS = 4.2; // cutoff, in row-steps
const _WR_YEAR_DRUM_ANGLE_STEP = 8; // deg of cylinder rotation per row-step for the persistent reel — kept separate from the hologram's own (larger) angle so the reel and the hologram can each have their own row spacing
const _WR_YEAR_DRUM_R = 110; // cylinder radius in px for the persistent reel — kept separate from the hologram's own (larger) radius
function _wrYearReelVisualUpdate(el) {
  const frac = el.scrollTop / _WR_YEAR_ROWH;
  const nearestSlot = Math.round(frac);
  const items = el.querySelectorAll('.wr-sf-year-reel-item');
  items.forEach((it, i) => {
    const slot = i; // item i's centered scrollTop is i*rowH, matching frac directly (pad row already accounted for by the reel's own offset)
    // dist is continuous (against frac, not the rounded nearestSlot) — every row's curve
    // position glides in lockstep with the drag, one moving surface, instead of the whole
    // drum snapping into its curved pose only once the drag crosses a row boundary
    const dist = slot - frac;
    const absDist = Math.abs(dist);
    if (absDist > _WR_YEAR_DRUM_RADIUS) {
      it.style.opacity = '0';
      it.style.filter = 'none';
      it.style.transform = 'scale(.7)';
      it.classList.remove('active');
      return;
    }
    const ratio = absDist / _WR_YEAR_DRUM_RADIUS;
    const theta = dist * _WR_YEAR_DRUM_ANGLE_STEP;
    const thetaRad = theta * Math.PI / 180;
    const curveY = _WR_YEAR_DRUM_R * Math.sin(thetaRad); // this row's actual vertical position on the curved surface
    const linearY = dist * _WR_YEAR_ROWH; // where document flow + scroll already puts it
    const extraY = curveY - linearY; // delta the transform needs to add on top of native flow
    const translateZ = -_WR_YEAR_DRUM_R * (1 - Math.cos(thetaRad)); // recedes from the viewer as it curls away
    const scaleY = Math.max(0.32, Math.abs(Math.cos(thetaRad))); // true cylinder foreshortening — collapses in height, not width
    const scaleX = Math.max(0.88, 1 - ratio * 0.12);
    it.style.opacity = Math.max(0.22, 1 - ratio * 0.72).toFixed(2);
    it.style.filter = absDist > 0.08 ? `blur(${Math.min(2.2, absDist * 0.8).toFixed(2)}px)` : 'none';
    it.style.transform = `translateY(${extraY.toFixed(2)}px) translateZ(${translateZ.toFixed(2)}px) rotateX(${(-theta).toFixed(1)}deg) scale(${scaleX.toFixed(2)},${scaleY.toFixed(2)})`;
    it.classList.toggle('active', slot === nearestSlot); // color highlight still snaps to whichever row is nearest; only the geometry glides continuously
  });
}

// the hologram readout — the permanent, always-on display of the current value, kept in sync
// live during a drag and left showing at rest too (this is the primary high-tech "screen"
// look of the picker now, not a transient popup).
//
// The centered number is quantized to the nearest whole year (not a continuous fractional
// offset), so it settles and holds still instead of drifting with the finger; it only jumps
// to the next/prev year once the drag crosses the halfway point between rows.
function _wrYearReelShowHolo(which, el, vb) {
  const holo = document.getElementById('wr-sf-year-holo-' + which);
  const viewport = document.getElementById('wr-sf-year-holo-viewport-' + which);
  if (!holo || !viewport) return;
  const count = vb.max - vb.min + 1;
  const rawFrac = el.scrollTop / _WR_YEAR_ROWH;
  const clampedFrac = Math.max(0, Math.min(count - 1, rawFrac));
  // quantized to the nearest whole year, not the continuous scroll fraction — the number
  // sitting in the frame stays completely still instead of drifting up with the finger; it
  // only jumps to the next/prev year once the drag actually crosses the halfway point between
  // rows, so each year reads as a discrete click of the drum rather than an analog slide
  const nearestIdx = Math.max(0, Math.min(count - 1, Math.round(clampedFrac)));
  // the displayed value only ever changes when nearestIdx changes (everything below is a
  // pure function of nearestIdx + fixed offsets), so re-running the whole per-character
  // curvature calc and rewriting viewport.innerHTML every single rAF frame — even the many
  // frames where nearestIdx hasn't moved during a slow drag or momentum glide — was pure
  // wasted layout/paint work and is what caused the stutter/freeze while scrolling. Bail out
  // early once the frame is a no-op; holo._wrLastIdx is reset to null on hide so the next
  // time the hologram is shown it always gets a fresh rebuild.
  if (holo._wrLastIdx === nearestIdx && holo.classList.contains('show')) return;
  holo._wrLastIdx = nearestIdx;
  const RADIUS = 4.2; // continuous cutoff (in row-steps) past which a line is fully gone
  const ANGLE_STEP = 10; // degrees of cylinder rotation per row-step for the hologram readout — kept separate from the persistent reel's own (smaller) angle; gentle front-view curve, not fisheye
  // so the outermost row never rotates past the pole (sin() would start walking back toward
  // center instead of continuing outward, which reads as a glitch, not an edge).
  const R = 170; // cylinder radius in px for the hologram readout — kept separate from the persistent reel's own (smaller) radius
  const CHAR_ANGLE_MAX = 12; // max degrees of horizontal curl between adjacent characters.
  const CHAR_R = 20; // barrel radius (px) for the per-character depth pull-back
  // Both the row rotation and the per-character curl are front-loaded via CURL_POW below —
  // previously they scaled linearly with `ratio`, which meant real curvature only became
  // geometrically significant right as a row had already faded to near-invisible (op ≈ 0).
  // The eye never got to see anything actually bend; it only ever saw flat glyphs shrinking
  // and fading, which reads as a flat sliding plate, not a barrel. Ramping curl in faster
  // (while the row is still opaque) is what makes the curvature legible.
  const CURL_POW = 0.55;
  let html = '';
  for (let d = -Math.ceil(RADIUS) - 1; d <= Math.ceil(RADIUS) + 1; d++) {
    const idx = nearestIdx + d;
    if (idx < 0 || idx >= count) continue;
    const y = vb.min + idx;
    // quantized against nearestIdx (not the continuous scroll fraction) — the centered number
    // settles on the nearest year and holds still instead of drifting up/down with the finger;
    // it only jumps to the next/prev year once the drag crosses the halfway point between rows
    const dist = d;
    const absDist = Math.abs(dist);
    if (absDist > RADIUS) continue;
    const ratio = Math.min(1, absDist / RADIUS);
    const curl = Math.pow(ratio, CURL_POW); // front-loaded curvature amount (0 at center, 1 at edge)
    const isCurr = absDist < 0.5;
    const op = Math.max(0.16, 1 - ratio * 0.78).toFixed(2);
    const size = isCurr ? Math.round(30 - ratio * 4) : Math.max(16, Math.round(25 - ratio * 8));
    const theta = dist * ANGLE_STEP; // signed angle around the cylinder's X axis, continuous with drag
    const thetaRad = theta * Math.PI / 180;
    const translateY = (R * Math.sin(thetaRad)).toFixed(2); // vertical position ON the curved surface (compresses toward the poles, not linear)
    const translateZ = (-R * (1 - Math.cos(thetaRad))).toFixed(2); // recedes from the viewer as it curls away — this Z pull-back is what perspective actually needs to render a curve instead of a flat rotated card
    // scaleY is the actual cylinder foreshortening (a row rotating about the X axis visibly
    // flattens in height, not width) — driven straight off cos(theta) so it's legible even at
    // small font sizes where perspective-only foreshortening is too subtle to read. scaleX
    // barely moves, on purpose: keeping width close to full-size while height collapses is
    // what distinguishes "this is curving away from me" from "this is just shrinking".
    const scaleY = Math.max(0.16, Math.abs(Math.cos(thetaRad))).toFixed(2);
    const scaleX = Math.max(0.82, 1 - ratio * 0.18).toFixed(2);
    const blur = ratio > 0.32 ? ((ratio - 0.32) * 3.6).toFixed(2) : '0';
    const digits = String(y).split('');
    const mid = (digits.length - 1) / 2;
    const chars = digits.map((ch, ci) => {
      const co = ci - mid; // signed position of this character relative to the row's center
      const charTheta = co * CHAR_ANGLE_MAX * curl; // curl grows with distance from center, front-loaded
      const charThetaRad = charTheta * Math.PI / 180;
      const charZ = (-CHAR_R * (1 - Math.cos(charThetaRad))).toFixed(2);
      return `<span style="transform:rotateY(${charTheta.toFixed(1)}deg) translateZ(${charZ}px)">${ch}</span>`;
    }).join('');
    html += `<div class="wr-sf-year-holo-line-wrap" style="opacity:${op};filter:blur(${blur}px)"><div class="wr-sf-year-holo-line${isCurr ? ' curr' : ''}" style="font-size:${size}px;transform:translateY(-50%) translate3d(0,${translateY}px,${translateZ}px) rotateX(${(-theta).toFixed(1)}deg) scale(${scaleX},${scaleY})">${chars}</div></div>`;
  }
  viewport.innerHTML = html;
  holo.classList.add('show'); // shown only while the reel is actively moving; hidden again
                               // by _wrYearReelHideHolo() once it settles (see rAF tick below)
}

// fades the hologram back out once the reel has stopped moving — pairs with the .show
// toggle in _wrYearReelShowHolo() above so the readout only appears while the user is
// actually scrolling/dragging, rather than sitting lit on the sheet at rest.
function _wrYearReelHideHolo(which) {
  const holo = document.getElementById('wr-sf-year-holo-' + which);
  if (!holo) return;
  holo.classList.remove('show');
  holo._wrLastIdx = null; // force a full rebuild the next time scrolling resumes
}

// during a fast fling, native 'scroll' events stop arriving as a smooth stream and instead
// dispatch in sparse, uneven bursts — made worse by scroll-snap-type:mandatory, whose own
// snap engine can advance scrollTop in jumps rather than gliding it. Driving the holo/visual
// purely off 'scroll' events therefore makes the readout hitch/jump in exact proportion to
// how fast the reel is spinning, even though the underlying scroll is continuous. Sampling
// el.scrollTop on every animation frame instead — regardless of whether a 'scroll' event
// happened to fire that frame — keeps the readout glued to the true position at any speed,
// matching the smooth feel it already has during a slow drag.
function _wrYearReelRafTick(el) {
  const cur = el.scrollTop;
  if (cur !== el._wrLastScrollTop) {
    el._wrLastScrollTop = cur;
    el._wrStillFrames = 0;
    _wrYearReelVisualUpdate(el);
    _wrYearReelShowHolo(el.dataset.which, el, _wrVintageBounds());
  } else {
    el._wrStillFrames = (el._wrStillFrames || 0) + 1;
  }
  // keep sampling a few frames after motion appears to stop too, so the final snap-into-
  // place animation (itself a short animated scroll, not an instant jump) stays smooth
  if (el._wrActive || el._wrStillFrames < 6) {
    el._wrRafId = requestAnimationFrame(() => _wrYearReelRafTick(el));
  } else {

    _wrYearReelHideHolo(el.dataset.which); // motion has fully stopped — fade the readout back out

}
function _wrYearReelStartLoop(el) {
  if (el._wrRafId) return; // already running, nothing to do
  el._wrLastScrollTop = -1; // force the first tick to always register as a change
  el._wrStillFrames = 0;

// amplifies raw finger travel into scroll distance — plain 1:1 native scroll meant a decades-
// wide vintage range (e.g. 1970-2025) took many repeated swipes to reach either end, and any
// single flick landed on a fairly arbitrary year. Manually driving scrollTop off the finger
// delta (instead of leaving it to native touch scrolling) lets one drag span many more years
// while still tracking the finger precisely, so the oldest/newest vintage is reachable in a
// swipe or two and any specific year is easy to land on exactly.
const _WR_YEAR_DRAG_MULTIPLIER = 2.6;

// _wrYearReelSettle can tell a deliberate light flick (fast finger, small travel distance)
// apart from an accidental micro-drag — native momentum alone can't make that distinction,
// which is what let a light-but-intentional swipe silently snap back to where it started.
function _wrYearReelTouchStart(evt, el) {

  el._wrTouchPrevTime = el._wrTouchLastTime = evt.timeStamp;
  el._wrTouchStartY = t.clientY;
  el._wrTouchBaseScrollTop = el.scrollTop;

  // before release, not an average over a drag that may have started slow and sped up
  el._wrTouchPrevY = el._wrTouchLastY;
  el._wrTouchPrevTime = el._wrTouchLastTime;
  el._wrTouchLastY = t.clientY;
  el._wrTouchLastTime = evt.timeStamp;

  // _WR_YEAR_DRAG_MULTIPLIER above. Browser clamps scrollTop to valid range automatically.

  // stays consistent with how far a given finger speed now actually moves the reel
  el._wrTouchVelocity = dt > 0 ? ((el._wrTouchLastY - el._wrTouchPrevY) / dt) * _WR_YEAR_DRAG_MULTIPLIER : 0; // px/ms, amplified
  // if the flick was too light to move native scroll by even a pixel, no 'scroll' event
  // (and therefore no settle) ever fires — check in shortly after release so a deliberate
  // but barely-there flick still gets evaluated instead of silently doing nothing
  const startIdx = el._wrTouchStartIdx;

    if (el._wrTouchStartIdx === startIdx && el._wrTouchStartIdx !== null) _wrYearReelSettle(el);
  }, 150);
}

// 'scroll' events just confirm the browser is moving the reel (from a touch drag, mouse
// drag, or its own momentum/snap physics) — the actual per-frame visual/holo update is
// driven entirely by the rAF loop (_wrYearReelRafTick), which samples scrollTop directly
// every frame instead of reacting to these events one-for-one. That's what keeps the
// readout smooth at fling speed, when 'scroll' events themselves stop arriving evenly.
function _wrYearReelScroll(el) {

  // user interaction, so skip the interactive pipeline (raf loop + hologram) entirely
  if (el._wrSuppressScrollEvent) { el._wrSuppressScrollEvent = false; return; }
  _wrYearReelStartLoop(el);
  clearTimeout(el._settleTimer);
  el._settleTimer = setTimeout(() => _wrYearReelSettle(el), 130);
}

function _wrYearReelSettle(el) {
  const vb = _wrVintageBounds();
  const count = vb.max - vb.min + 1;
  let idx = Math.round(el.scrollTop / _WR_YEAR_ROWH);
  idx = Math.max(0, Math.min(count - 1, idx));

  // a quick light flick can land back on the exact row it started from once momentum
  // decays (sub-row travel distance), which reads as the swipe "not reaching" — if the
  // finger was moving fast enough at release to clearly signal intent, nudge one row in
  // that direction instead of silently doing nothing. Only fires when idx hasn't already
  // moved, so it never fights a flick that already traveled far enough on its own.
  const FLICK_MIN_VELOCITY = 0.12; // px/ms — below this, treat as a settle/tap, not a swipe
  if (idx === el._wrTouchStartIdx && typeof el._wrTouchVelocity === 'number' && Math.abs(el._wrTouchVelocity) > FLICK_MIN_VELOCITY) {
    // finger moving down (positive dy) drags earlier rows into view, i.e. scrollTop falls
    idx += el._wrTouchVelocity > 0 ? -1 : 1;
    idx = Math.max(0, Math.min(count - 1, idx));
  }
  el._wrTouchStartIdx = null;
  el._wrTouchVelocity = null;

  const snappedTop = idx * _WR_YEAR_ROWH;
  if (Math.abs(el.scrollTop - snappedTop) > 0.5) el.scrollTop = snappedTop;
  el.dataset.value = vb.min + idx;
  _wrYearReelVisualUpdate(el);
  _wrYearReelCommit();
}

// reads both wheels and stores them ordered (lower value as From, higher as To) regardless
// of which physical wheel is further along — so the two wheels never have to jump/re-sort
// themselves mid-interaction, only the resulting filter range does
function _wrYearReelCommit() {
  const vb = _wrVintageBounds();
  const fromEl = document.getElementById('wr-sf-year-reel-from');
  const toEl = document.getElementById('wr-sf-year-reel-to');
  const a = fromEl && fromEl.dataset.value ? parseInt(fromEl.dataset.value, 10) : vb.min;
  const b = toEl && toEl.dataset.value ? parseInt(toEl.dataset.value, 10) : vb.max;
  _wrVintageRangeFrom = String(Math.min(a, b));
  _wrVintageRangeTo = String(Math.max(a, b));
  _wrUpdateSfFooterStatus();
}

// positions both reels instantly (no animation) to reflect current state — called right
// after the sheet's innerHTML is (re)built, once the elements actually exist in the DOM
// positions both reels instantly (no animation) to reflect current state — called right
// after the sheet's innerHTML is (re)built, once the elements actually exist in the DOM.
// The hologram is rendered here too (not suppressed) since it's now the permanent, always-on
// display — it needs to already show the right value the moment the sheet opens, not just
// after the user's first touch/drag.
function _wrInitYearReels(fromVal, toVal, vb) {
  requestAnimationFrame(() => {
    [['from', fromVal], ['to', toVal]].forEach(([which, val]) => {
      const el = document.getElementById('wr-sf-year-reel-' + which);
      if (!el) return;
      const targetTop = (val - vb.min) * _WR_YEAR_ROWH;
      if (el.scrollTop !== targetTop) { el._wrSuppressScrollEvent = true; el.scrollTop = targetTop; }
      el.dataset.value = val;
      _wrYearReelVisualUpdate(el);
      // hologram intentionally left hidden here — it should only appear once the user
      // actually starts scrolling/dragging (see _wrYearReelShowHolo/_wrYearReelHideHolo),
      // not sit lit the moment the sheet opens
    });
  });
}

// quick-pick price bands shown as chips above the slider — tapping one jumps straight to that
// range (hi:null means "no upper bound", matching how _wrPriceRangeMax already represents +).
const _WR_SF_PRICE_PRESETS = [
  { label: 'ทั้งหมด',        lo: 0,    hi: null },
  { label: '< ฿500',        lo: 0,    hi: 500   },
  { label: '฿500–1,000',    lo: 500,  hi: 1000  },
  { label: '฿1,000–2,000',  lo: 1000, hi: 2000  },
  { label: '฿2,000–5,000',  lo: 2000, hi: 5000  },
  { label: '฿5,000+',       lo: 5000, hi: null  }
];
function _wrSfPricePresetsHtml() {
  const curLo = _wrPriceRangeMin || 0;
  const curHi = _wrPriceRangeMax;
  return _WR_SF_PRICE_PRESETS.map(p => {
    const active = curLo === p.lo && ((p.hi == null && curHi == null) || (p.hi != null && curHi === p.hi));
    return `<button type="button" class="wr-sf-price-chip${active ? ' active' : ''}" data-lo="${p.lo}" data-hi="${p.hi == null ? '' : p.hi}" onclick="_wrApplyPricePreset(${p.lo},${p.hi == null ? 'null' : p.hi})">${p.label}</button>`;
  }).join('');
}
function _wrApplyPricePreset(lo, hi) {
  _wrPriceRangeMin = lo;
  _wrPriceRangeMax = hi;
  _wrUpdatePriceSliderUI();
}

// user typed an exact value into the min/max fields instead of dragging — clamp to the valid
// 0.._WR_SF_PRICE_MAX range and keep lo<=hi, same invariants the drag handlers enforce.
function _wrPriceInputCommit(which, rawValue) {
  const digits = String(rawValue).replace(/[^\d]/g, '');
  const max = _WR_SF_PRICE_MAX;
  if (which === 'lo') {
    let v = digits === '' ? 0 : parseInt(digits, 10);
    v = Math.max(0, Math.min(v, max));
    const curHi = _wrPriceRangeMax == null ? max : _wrPriceRangeMax;
    if (v > curHi) v = curHi;
    _wrPriceRangeMin = v;
  } else {
    if (digits === '') {
      _wrPriceRangeMax = null;
    } else {
      let v = parseInt(digits, 10);
      v = Math.max(0, Math.min(v, max));
      const curLo = _wrPriceRangeMin || 0;
      if (v < curLo) v = curLo;
      _wrPriceRangeMax = v >= max ? null : v;
    }
  }
  _wrUpdatePriceSliderUI();

// the 25/50/75% tick labels under the track — computed from the same power-curve mapping the
// slider itself uses (_wrSfPricePct), so the printed values always match where the tick sits.
function _wrSfPriceTickValue(pct) {
  const raw = Math.pow(pct / 100, _WR_SF_PRICE_CURVE) * _WR_SF_PRICE_MAX;
  return Math.round(raw / _WR_SF_PRICE_STEP) * _WR_SF_PRICE_STEP;
}
function _wrSfPriceTicksHtml() {

}

// Only patches the price-mode buttons + slider readout in place — does NOT call
// _wrRenderSmartFilterSheet(), which would rebuild the whole sheet from scratch (including

// vintage-year hologram flash/rerender on every price-mode tap even though the year reels
// themselves were never touched: setting a freshly-recreated reel's scrollTop fires a
// 'scroll' event, which the reel's own listener treats as user motion and reacts to by
// showing the hologram.

  if (_wrPriceFieldMode === mode) return;

  _wrPriceRangeMax = null;

// live-updates the price slider's fill bar + thumb positions + label (and the footer active-
// filter count) in place, without touching anything else in the sheet — used both mid-drag
// and by _wrSetPriceFieldMode above.
function _wrUpdatePriceSliderUI() {
  const fill = document.getElementById('wr-sf-price-fill');
  const loThumb = document.getElementById('wr-sf-price-thumb-lo');
  const hiThumb = document.getElementById('wr-sf-price-thumb-hi');
  const loTip = document.getElementById('wr-sf-price-tip-lo');
  const hiTip = document.getElementById('wr-sf-price-tip-hi');
  const loInput = document.getElementById('wr-sf-price-input-lo');
  const hiInput = document.getElementById('wr-sf-price-input-hi');
  const max = _WR_SF_PRICE_MAX;
  const lo = _wrPriceRangeMin || 0;
  const hi = _wrPriceRangeMax == null ? max : _wrPriceRangeMax;
  const loPct = _wrSfPricePct(lo) + '%', hiPct = _wrSfPricePct(hi) + '%';
  if (fill) { fill.style.left = loPct; fill.style.right = (100 - _wrSfPricePct(hi)) + '%'; }
  if (loThumb) loThumb.style.left = loPct;
  if (hiThumb) hiThumb.style.left = hiPct;
  const loStr = lo.toLocaleString('th-TH');
  const hiStr = hi >= max ? max.toLocaleString('th-TH') + '+' : hi.toLocaleString('th-TH');
  if (loTip) loTip.textContent = loStr;
  if (hiTip) hiTip.textContent = hiStr;
  // don't clobber a field the user is actively typing into
  if (loInput && document.activeElement !== loInput) loInput.value = loStr;
  if (hiInput && document.activeElement !== hiInput) hiInput.value = hi >= max ? '' : hiStr;
  document.querySelectorAll('.wr-sf-price-chip').forEach(chip => {
    const chipLo = parseInt(chip.dataset.lo, 10);
    const chipHi = chip.dataset.hi === '' ? null : parseInt(chip.dataset.hi, 10);
    const isActive = lo === chipLo && ((chipHi == null && _wrPriceRangeMax == null) || (chipHi != null && _wrPriceRangeMax === chipHi));

// accurate thumb shape, which some mobile browsers don't respect for touch start), so the

function _wrPriceValueFromClientX(clientX) {
  const wrap = document.getElementById('wr-sf-range-wrap');

  const rect = wrap.getBoundingClientRect();
  let pct = rect.width ? (clientX - rect.left) / rect.width : 0;
  pct = Math.max(0, Math.min(1, pct));
  const raw = Math.pow(pct, _WR_SF_PRICE_CURVE) * _WR_SF_PRICE_MAX;

  document.addEventListener('pointerup', _wrPriceThumbUp);
  document.addEventListener('pointercancel', _wrPriceThumbUp);

function _wrPriceThumbMove(ev) {
  if (!_wrPriceDragThumb) return;
  ev.preventDefault();
  const val = _wrPriceValueFromClientX(ev.clientX);
  const curLo = _wrPriceRangeMin || 0;

  document.removeEventListener('pointerup', _wrPriceThumbUp);
  document.removeEventListener('pointercancel', _wrPriceThumbUp);

        <span>฿0</span><span>฿${_WR_SF_PRICE_MAX.toLocaleString('th-TH')}+</span>

  _wrInitYearReels(fromVal, toVal, vb);
  _wrUpdateSfFooterStatus();
}

function _wrSmartFilterActiveCount() {

// appends the next chunk of _wrLastShown to #wholesale-results, then arms a sentinel that
// triggers the chunk after that once scrolled near — repeats until every match has been
// rendered. `token` ties this call to the render that started it: if a new search/filter has
// happened since (renderWholesaleResults bumps _wrResultsRenderToken every time), this call
// recognizes it's stale and stops immediately instead of appending old cards into the new list.
function _wrAppendResultsPage(list, matches, token) {
  if (token !== _wrResultsRenderToken) return; // stale chain — a newer render has taken over
  const start = _wrResultsPage * _WR_RESULTS_PAGE_SIZE;
  const oldSentinel = document.getElementById('wr-results-sentinel');
  if (oldSentinel) oldSentinel.remove();
  if (start >= matches.length) { _wrResultsSentinelObs = null; return; } // nothing left to append

  const chunk = matches.slice(start, start + _WR_RESULTS_PAGE_SIZE);
  const frag = document.createElement('div');
  frag.innerHTML = chunk.map((r, j) => _wrBuildResultCard(r, start + j)).join('');
  const newNodes = [];
  while (frag.firstChild) { newNodes.push(frag.firstChild); list.appendChild(frag.firstChild); }
  _wrResultsPage++;

  requestAnimationFrame(() => {
    if (token !== _wrResultsRenderToken) return; // render was superseded mid-flight — abandon
    newNodes.forEach(n => { if (n.querySelectorAll) renderBarcodeCanvases(n); });
    if (typeof window._patchPendingProductPhotos === 'function') window._patchPendingProductPhotos(newNodes);
  });

  if (_wrResultsPage * _WR_RESULTS_PAGE_SIZE < matches.length) {
    const sentinel = document.createElement('div');
    sentinel.id = 'wr-results-sentinel';
    sentinel.style.cssText = 'height:1px';
    list.appendChild(sentinel);
    _wrResultsSentinelObs = new IntersectionObserver(entries => {
      if (!entries[0].isIntersecting) return;
      _wrResultsSentinelObs.disconnect();
      _wrResultsSentinelObs = null;
      if (token !== _wrResultsRenderToken) return; // guard again — could go stale while waiting to scroll near
      if (window.requestIdleCallback) requestIdleCallback(() => _wrAppendResultsPage(list, matches, token), { timeout: 200 });
      else requestAnimationFrame(() => _wrAppendResultsPage(list, matches, token));
    }, { rootMargin: '400px' });
    _wrResultsSentinelObs.observe(sentinel);
  }
}

function renderWholesaleResults() {
  if (_wrRenderDebounceTimer) { clearTimeout(_wrRenderDebounceTimer); _wrRenderDebounceTimer = null; }
  const inputEl = document.getElementById('wholesale-search-input');
  const q = inputEl ? inputEl.value : '';
  const query = q.trim().toLowerCase();
  const list = document.getElementById('wholesale-results');
  if (!list) return;

  // [FIX 2026-08-03e] เดิมเรียก _wrRenderTypeChips()/_wrRenderGrapeChips()/_wrRenderCountryChips()
  // (แถว scroll เดิม) ตอนนี้เปลี่ยนเป็นปุ่มหมวดหมู่ + pill ที่เลือกอยู่ + popover body (no-op ถ้าไม่ได้เปิด)
  _wrRenderCatRow();
  _wrRenderActivePills();
  _wrRenderQuickCatBody();
  _wrUpdateSmartFilterDot();

  const sortRow = document.getElementById('wholesale-sort-row');
  if (sortRow) sortRow.style.display = 'flex';
  const _wrVb = _wrVintageBounds();
  const hasVintageRange = (_wrVintageRangeFrom != null && parseInt(_wrVintageRangeFrom, 10) !== _wrVb.min)
    || (_wrVintageRangeTo != null && parseInt(_wrVintageRangeTo, 10) !== _wrVb.max);
  const hasPriceRange = _wrPriceRangeMin > 0 || _wrPriceRangeMax != null;
  if (!query && !_wrTypeFilters.size && !_wrSparklingLevelFilters.size && !_wrGrapeFilters.size && !_wrCountryFilters.size && !_wrVintageFilters.size && !_wrRegionFilters.size && !_wrTierFilters.size && !_wrLabelTierFilters.size && !hasVintageRange && !hasPriceRange && !_wrSpecialVintageOnly) {
    _wrReleaseCanvasObservers(list);
    _wrResetResultsPagination();
    _wrLastShown = [];
    _wrClearDetailCache(); // indices are about to point at a different result set — stale cache would show the wrong product
    list.innerHTML = `<div style="text-align:center;padding:60px 14px;color:#4a5578;font-size:12px;font-family:'Prompt',sans-serif;line-height:1.6">พิมพ์ชื่อสินค้า บาร์โค้ด หรือประเทศ<br>เพื่อค้นหาในฐานข้อมูล ${ACTIVE_WHOLESALE_DB.length.toLocaleString('th-TH')} รายการ</div>`;
    return;
  }

  const isDigits = /^[0-9]+$/.test(query);
  // strip leading zeros — scanned barcodes often come padded (e.g. a 13-digit
  // EAN like "0000048979375") while the DB stores the short form ("48979375"),
  // so a plain substring match on the padded code never finds it.
  const queryNoLeadingZeros = isDigits ? (query.replace(/^0+/, '') || '0') : query;
  let matches = query
    ? ACTIVE_WHOLESALE_DB.filter(r => {
        if (isDigits && query.length >= 4 && (r[0].indexOf(query) !== -1 || r[0].indexOf(queryNoLeadingZeros) !== -1)) return true;
        const hay = (r[1] + ' ' + r[2] + ' ' + r[8] + ' ' + r[7] + ' ' + (r[9] || '') + ' ' + (r[11] || '')).toLowerCase();
        return hay.indexOf(query) !== -1;
      })
    : ACTIVE_WHOLESALE_DB.slice();

  if (_wrTypeFilters.size) {
    matches = matches.filter(r => _wrTypeFilters.has(_wrCanonType(r[2])));
  }

  if (_wrSparklingLevelFilters.size) {
    matches = matches.filter(r => {
      const lvl = _wrSparklingLevelOf(r);
      return lvl && _wrSparklingLevelFilters.has(lvl);
    });
  }

  if (_wrGrapeFilters.size) {
    const gfSet = new Set(Array.from(_wrGrapeFilters).map(g => g.toLowerCase()));
    matches = matches.filter(r => {
      const grapeField = (r[7] || '').trim();
      if (grapeField) return _wrGrapeNames(r[7]).some(g => gfSet.has(g.toLowerCase()));
      // no grape data in the sheet for this row — infer from the product name instead
      return Array.from(_wrGrapeFilters).some(g => _wrNameImpliesGrape(r[1], g));
    });
  }

  if (_wrCountryFilters.size) {
    // "Fine Wine" is a quality-tier tag, not a country — treat it as a separate AND
    // condition from any selected real countries instead of ORing both into one set,
    // otherwise picking "Fine Wine" + "Italy" would also match unrelated French chateaux
    // that only share the "Fine Wine" tag.
    const fineWineSelected = _wrCountryFilters.has('Fine Wine');
    const countrySelections = new Set(Array.from(_wrCountryFilters).filter(c => c !== 'Fine Wine'));
    matches = matches.filter(r => {
      if (fineWineSelected && !_wrIsFineWine(r)) return false;
      if (countrySelections.size && !countrySelections.has(_wrRealCountry(r))) return false;
      return true;
    });
  }

  if (_wrVintageFilters.size) {
    matches = matches.filter(r => _wrVintageFilters.has(r[3]));
  }

  if (_wrTierFilters.size) {
    matches = matches.filter(r => {
      const t = _wrWineTier(r);
      return !!(t && _wrTierFilters.has(t.key));
    });
  }

  if (_wrLabelTierFilters.size) {
    matches = matches.filter(r => _wrLabelTierFilters.has(r[10]));
  }

  if (_wrRegionFilters.size) {
    matches = matches.filter(r => _wrRegionFilters.has(r[12]));
  }

  // Smart Filter sheet's vintage range — additive to (not a replacement for) the
  // exact-year _wrVintageFilters set above, which is picked by tapping a card's year badge.
  if (hasVintageRange) {
    const fromY = _wrVintageRangeFrom ? parseInt(_wrVintageRangeFrom, 10) : null;
    const toY = _wrVintageRangeTo ? parseInt(_wrVintageRangeTo, 10) : null;
    matches = matches.filter(r => {
      const vy = parseInt(r[3], 10);
      if (isNaN(vy)) return false;
      if (fromY != null && vy < fromY) return false;
      if (toY != null && vy > toY) return false;
      return true;
    });
  }

  // Smart Filter sheet's price range — matches on whichever price field the user toggled
  // to (retail r[6], default, or wholesale-6-bottle r[5]), same two fields shown on the card.
  if (hasPriceRange) {
    const priceIdx = _wrPriceFieldMode === 'wholesale6' ? 5 : 6;
    matches = matches.filter(r => {
      const p = r[priceIdx];
      if (p == null) return false;
      if (_wrPriceRangeMin > 0 && p < _wrPriceRangeMin) return false;
      if (_wrPriceRangeMax != null && p > _wrPriceRangeMax) return false;
      return true;
    });
  }

  // Smart Filter sheet's "ปีพิเศษ" (rare vintage) toggle — narrows to rows that have a
  // WR_VINTAGE_TIPS entry: one of the 5 Bordeaux First Growths AND one of the handful of
  // iconic/legendary years covered for that château (1982, 2000, 2009, 2010).
  if (_wrSpecialVintageOnly) {
    matches = matches.filter(r => {
      const nt = _wrNameTip(r[1]);
      return !!(nt && _wrVintageTip(nt.key, r[3]));
    });
  }

  // generic string comparator — empty/blank values always sort to the end
  const strCmp = (av, bv) => {
    const a = (av || '').toLowerCase(), b = (bv || '').toLowerCase();
    if (!a && !b) return 0;
    if (!a) return 1;
    if (!b) return -1;
    return a.localeCompare(b);
  };

  if (_wrSortMode === 'price_asc' || _wrSortMode === 'price_desc') {
    const dir = _wrSortMode === 'price_asc' ? 1 : -1;
    matches.sort((a, b) => {
      const av = a[4], bv = b[4];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    });
  } else if (_wrSortMode === 'discount_desc') {
    // triggered by tapping the "-XX%" badge on a wholesale price cell — ranks by discount
    // percentage off retail (wholesale6 vs retail), highest savings first; rows with no
    // computable discount sort to the end.
    matches.sort((a, b) => {
      const ap = _wrWholesaleDiscountParts(a[6], a[5]);
      const bp = _wrWholesaleDiscountParts(b[6], b[5]);
      const apct = ap ? ap.pct : -1;
      const bpct = bp ? bp.pct : -1;
      if (apct !== bpct) return bpct - apct;
      return strCmp(a[1], b[1]);
    });
  } else if (_wrSortMode === 'name_asc' || _wrSortMode === 'name_desc') {
    const dir = _wrSortMode === 'name_asc' ? 1 : -1;
    matches.sort((a, b) => strCmp(a[1], b[1]) * dir);
  } else if (_wrSortMode === 'producer_asc') {
    matches.sort((a, b) => strCmp(_wrProducerOf(a), _wrProducerOf(b)) || strCmp(a[1], b[1]));
  } else if (_wrGrapeFilters.size) {
    // relevance (default) with a grape filter active — "ตรงที่สุด" means closest match to the
    // selected variety, so 100%-varietal wines lead, then descending by that grape's share of
    // the blend; the product-name query match is only the tiebreaker below that.
    const gfNames = Array.from(_wrGrapeFilters);
    matches.sort((a, b) => {
      const aPct = Math.max(...gfNames.map(g => _wrGrapePctOf(a[7], g, a[1])));
      const bPct = Math.max(...gfNames.map(g => _wrGrapePctOf(b[7], g, b[1])));
      if (aPct !== bPct) return bPct - aPct;
      const an = a[1].toLowerCase(), bn = b[1].toLowerCase();
      const aStarts = an.indexOf(query) === 0 ? 0 : 1;
      const bStarts = bn.indexOf(query) === 0 ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return an.localeCompare(bn);
    });
  } else {
    // relevance (default), no grape filter — country filtering (if any) happens above via the
    // chip strip; this branch just ranks by how closely the product name matches the typed query
    matches.sort((a, b) => {
      const an = a[1].toLowerCase(), bn = b[1].toLowerCase();
      const aStarts = an.indexOf(query) === 0 ? 0 : 1;
      const bStarts = bn.indexOf(query) === 0 ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return an.localeCompare(bn);
    });
  }

  if (!matches.length) {
    const rangeLabels = [];
    if (hasVintageRange) rangeLabels.push(`vintage ${_wrVintageRangeFrom || ''}-${_wrVintageRangeTo || ''}`);
    if (hasPriceRange) rangeLabels.push(`${_wrPriceFieldMode === 'wholesale6' ? 'ราคาส่ง' : 'ราคาปกติ'} ${_wrPriceRangeMin || 0}-${_wrPriceRangeMax != null ? _wrPriceRangeMax : _WR_SF_PRICE_MAX + '+'}`);
    if (_wrSpecialVintageOnly) rangeLabels.push('ปีพิเศษ');
    const filterLabels = [...Array.from(_wrTypeFilters), ...Array.from(_wrSparklingLevelFilters), ...Array.from(_wrGrapeFilters), ...Array.from(_wrCountryFilters), ...Array.from(_wrVintageFilters), ...Array.from(_wrRegionFilters), ...rangeLabels].join(', ');
    const emptyMsg = query
      ? `ไม่พบสินค้าที่ตรงกับ "${_wrEsc(q)}"${filterLabels ? ` และตัวกรอง "${_wrEsc(filterLabels)}"` : ''}`
      : `ไม่พบสินค้าที่ตรงกับตัวกรอง "${_wrEsc(filterLabels)}"`;
    _wrReleaseCanvasObservers(list);
    _wrResetResultsPagination();
    _wrLastShown = [];
    _wrClearDetailCache(); // indices are about to point at a different result set — stale cache would show the wrong product
    list.innerHTML = `<div style="text-align:center;padding:60px 14px;color:#4a5578;font-size:12px;font-family:'Prompt',sans-serif">${emptyMsg}</div>`;
    return;
  }

  _wrLastShown = matches;
  _wrClearDetailCache(); // same reason as above — a new matches array means every index now refers to a (possibly) different row
  _wrReleaseCanvasObservers(list);
  _wrResetResultsPagination();
  list.innerHTML = '';
  const _wrToken = _wrResultsRenderToken;
  _wrAppendResultsPage(list, matches, _wrToken);
}

function _wrTypeColor(type, product) {
  const t = String(type || '').trim().toLowerCase();
  const p = String(product || '').toLowerCase();
  const isRose = /(?<![a-zA-Z])ros[eéè](?![a-zA-Z])/.test(t) || /(?<![a-zA-Z])ros[eéè](?![a-zA-Z])/.test(p);
  const isPort = /\bport\b/.test(p) || /\bporto\b/.test(p);
  if (t === 'sparkling wine') return isRose ? '#ff8fc7' : '#ffd93d';
  if (t === 'red wine') return '#ff4d6d';
  if (t === 'white wine') return '#e8d48a';
  if (isRose && !isPort) return '#f88379';
  if (t === 'sweet wine') return '#ffb347';
  if (t === 'dessert wine') return '#c9944a';
  if (t === 'fortified wine') return isPort ? '#c77d34' : '#d9a441';
  if (t === 'orange wine') return '#ff8c42';
  if (t === 'cider') return '#8bc34a';
  if (t === 'wine spritz') return '#64ffda';
  return '#4bcffa';
}

// [FIX] card-wide accent now reflects the wine's CLASSIFICATION TIER (Grand Cru Classé,
// Grand Cru, DOCG, AOC, ...) instead of the wine type. The wine-type color (_wrTypeColor)
// is now used ONLY for the wholesale price cell — everywhere else on the card/detail sheet
// (borders, corners, badges, barcode frame, sysid dot) uses this tier color instead.
function _wrTierColor(wineTier) {
  if (!wineTier) return '#4bcffa';
  // [FIX 2026-07-29] Only use the per-key hue (e.g. Eiswein's icy blue) when the badge chip
  // itself actually renders that hue. _wrBadgeAccentStyle only applies key colors below rank 60 —
  // grand/legendary bands (rank>=60) stay on the flat band color (purple/gold) regardless of key.
  // Previously this looked up the key color unconditionally, so grand-band tiers with their own
  // map entry (eiswein, ba, tba, 1ercru, vintageport, colheita...) got a tooltip color that didn't
  // match their own badge. Mirroring the same rank<60 gate here keeps tooltip and badge in sync.
  if (wineTier.key && wineTier.rank < 60 && _WR_TIER_KEY_COLORS[wineTier.key]) return _WR_TIER_KEY_COLORS[wineTier.key];
  switch (wineTier.cls) {
    case 'wr-tier-legendary':  return '#ffcf6b';
    case 'wr-tier-grand':      return '#c78aff';
    case 'wr-tier-elevated':   return '#4da3ff';
    case 'wr-tier-classified': return '#12dab0';
    case 'wr-tier-regional':   return '#9fb0d9';
    default: return '#4bcffa';
  }
}

function _wrFlagColors(country) {
  const c = String(country || '').trim();
  const FLAGS = {
    'France':        ['#0055A4', '#FFFFFF', '#EF4135'],
    'Italy':         ['#009246', '#FFFFFF', '#CE2B37'],
    'Spain':         ['#AA151B', '#F1BF00', '#AA151B'],
    'Portugal':      ['#046A38', '#046A38', '#DA291C'],
    'Germany':       ['#000000', '#DD0000', '#FFCE00'],
    'Austria':       ['#ED2939', '#FFFFFF', '#ED2939'],
    'USA':           ['#B22234', '#FFFFFF', '#3C3B6E'],
    'New Zealand':   ['#00247D', '#FFFFFF', '#CC142B'],
    'Australia':     ['#00247D', '#FFFFFF', '#CC142B'],
    'Argentina':     ['#74ACDF', '#FFFFFF', '#74ACDF'],
    'Chile':         ['#D52B1E', '#FFFFFF', '#0039A6'],
    'South Africa':  ['#007A4D', '#FFB612', '#DE3831'],
  };
  return FLAGS[c] || null;
}

// ธงที่มีแถบสีแนวนอนจริง (บน-กลาง-ล่าง) เช่น สเปน เยอรมนี ออสเตรีย อเมริกา อาร์เจนตินา ชิลี
// ส่วนธงที่เหลือ (ฝรั่งเศส อิตาลี โปรตุเกส ฯลฯ) เป็นแถบสีแนวตั้งจริง จึงใช้ gradient แนวนอน (90deg) ตามเดิม
const _WR_HORIZONTAL_FLAGS = new Set(['Spain', 'Germany', 'Austria', 'USA', 'Argentina', 'Chile']);
function _wrFlagGradientAngle(country) {
  return _WR_HORIZONTAL_FLAGS.has(String(country || '').trim()) ? '180deg' : '90deg';
}

// วาดดาว n แฉก (ปกติ 5 แฉก, ออสเตรเลียใช้ 7 แฉกสำหรับดาวเครือจักรภพ/กางเขนใต้) เป็น <polygon>
function _wrStarPolygon(cx, cy, r, fill, points) {
  points = points || 5;
  const inner = points === 7 ? r * 0.52 : r * 0.382;
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const angle = -Math.PI / 2 + i * Math.PI / points;
    const radius = i % 2 === 0 ? r : inner;
    pts.push(`${(cx + radius * Math.cos(angle)).toFixed(2)},${(cy + radius * Math.sin(angle)).toFixed(2)}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`;
}

// มุมธงยูเนี่ยนแจ็ก (แบบย่อ) ใช้เป็นมุมบนซ้ายของออสเเตรเลีย/นิวซีแลนด์
function _wrUnionJackSVG(w, h) {
  let s = `<rect width="${w}" height="${h}" fill="#00247D"/>`;
  s += `<path d="M0,0 L${w},${h} M${w},0 L0,${h}" stroke="#FFFFFF" stroke-width="${(h * 0.22).toFixed(2)}"/>`;
  s += `<path d="M0,0 L${w},${h}" stroke="#CC142B" stroke-width="${(h * 0.09).toFixed(2)}"/>`;
  s += `<path d="M${w},0 L0,${h}" stroke="#CC142B" stroke-width="${(h * 0.09).toFixed(2)}"/>`;
  s += `<rect x="0" y="${(h * 0.4).toFixed(2)}" width="${w}" height="${(h * 0.2).toFixed(2)}" fill="#FFFFFF"/>`;
  s += `<rect x="${(w * 0.4).toFixed(2)}" y="0" width="${(w * 0.2).toFixed(2)}" height="${h}" fill="#FFFFFF"/>`;
  s += `<rect x="0" y="${(h * 0.44).toFixed(2)}" width="${w}" height="${(h * 0.12).toFixed(2)}" fill="#CC142B"/>`;
  s += `<rect x="${(w * 0.44).toFixed(2)}" y="0" width="${(w * 0.12).toFixed(2)}" height="${h}" fill="#CC142B"/>`;
  return s;
}

// ธงที่ต้อง "มีดาว" จริง (อเมริกา 50 ดาว, ออสเตรเลีย/นิวซีแลนด์ กางเขนใต้) — สร้างเป็น SVG แทน gradient ธรรมดา
function _wrFlagSVGMarkup(country) {
  const w = 190, h = 100;
  if (country === 'USA') {
    const stripeH = h / 13;
    let s = '';
    for (let i = 0; i < 13; i++) {
      s += `<rect x="0" y="${(i * stripeH).toFixed(2)}" width="${w}" height="${(stripeH + 0.6).toFixed(2)}" fill="${i % 2 === 0 ? '#B22234' : '#FFFFFF'}"/>`;
    }
    const cantonW = w * 0.42, cantonH = stripeH * 7;
    s += `<rect x="0" y="0" width="${cantonW.toFixed(2)}" height="${cantonH.toFixed(2)}" fill="#3C3B6E"/>`;
    const rows = 9;
    const rowH = cantonH / rows;
    for (let r = 0; r < rows; r++) {
      const count = r % 2 === 0 ? 6 : 5;
      const cy = rowH * (r + 0.5);
      const colW = cantonW / count;
      for (let c = 0; c < count; c++) {
        s += _wrStarPolygon(colW * (c + 0.5), cy, rowH * 0.34, '#FFFFFF', 5);
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${s}</svg>`;
  }
  if (country === 'Australia' || country === 'New Zealand') {
    let s = `<rect width="${w}" height="${h}" fill="#00247D"/>`;
    const cw = w * 0.5, ch = h * 0.5;
    s += `<g>${_wrUnionJackSVG(cw, ch)}</g>`;
    if (country === 'Australia') {
      s += _wrStarPolygon(cw * 0.5, ch * 1.4, h * 0.09, '#FFFFFF', 7); // ดาวเครือจักรภพ
      s += _wrStarPolygon(w * 0.72, h * 0.26, h * 0.075, '#FFFFFF', 7);
      s += _wrStarPolygon(w * 0.90, h * 0.42, h * 0.09, '#FFFFFF', 7);
      s += _wrStarPolygon(w * 0.85, h * 0.70, h * 0.09, '#FFFFFF', 7);
      s += _wrStarPolygon(w * 0.66, h * 0.74, h * 0.075, '#FFFFFF', 7);
      s += _wrStarPolygon(w * 0.75, h * 0.55, h * 0.045, '#FFFFFF', 7);
    } else {
      const nzStar = (cx, cy, r) => `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(r * 1.28).toFixed(2)}" fill="#FFFFFF"/>` + _wrStarPolygon(cx, cy, r, '#CC142B', 5);
      s += nzStar(w * 0.72, h * 0.22, h * 0.075);
      s += nzStar(w * 0.90, h * 0.40, h * 0.095);
      s += nzStar(w * 0.83, h * 0.66, h * 0.095);
      s += nzStar(w * 0.66, h * 0.80, h * 0.075);
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${s}</svg>`;
  }
  return null;
}

// ใช้ SVG จริง (มีดาว) สำหรับธงที่มีดาว ไม่งั้น fallback เป็น gradient 3 แถบสีเดิม
function _wrFlagBackgroundCSS(country, colors) {
  const realImg = _WR_FLAG_IMAGES[String(country || '').trim()];
  if (realImg) {
    return `url('${realImg}') center/cover no-repeat`;
  }
  const svg = _wrFlagSVGMarkup(country);
  if (svg) {
    const uri = 'data:image/svg+xml,' + encodeURIComponent(svg);
    return `url('${uri}') center/cover no-repeat`;
  }
  const [c1, c2, c3] = colors;
  // ธงแนวนอน (บน-กลาง-ล่าง) ให้แถบกลางหนากว่าแถบบน/ล่าง เพราะชื่อประเทศวางทับตรงกลางพอดี
  // ถ้าหารเท่ากันสามส่วนจะดูลีบแบนเกินไปเมื่อมีตัวหนังสือทับ — ธงแนวตั้งยังคงหารเท่ากันเหมือนเดิม
  const isHorizontal = _WR_HORIZONTAL_FLAGS.has(String(country || '').trim());
  const [s1, s2] = isHorizontal ? [22, 78] : [33, 66];
  return `linear-gradient(${_wrFlagGradientAngle(country)},${c1} 0%,${c1} ${s1}%,${c2} ${s1}%,${c2} ${s2}%,${c3} ${s2}%,${c3} 100%)`;
}

// picks a flag color usable as idle-chip text/border on a dark UI — skips white (blends into
// nothing useful as an accent) AND near-black (invisible against the dark background, e.g.
// Germany's black would otherwise make its unselected chip unreadable until tapped)
function _wrReadableFlagColor(flagColors) {
  if (!flagColors) return null;
  const luminance = hex => {
    try {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return (0.299*r + 0.587*g + 0.114*b);
    } catch(e) { return 128; }
  };
  const usable = flagColors.filter(c => c.toUpperCase() !== '#FFFFFF' && luminance(c) > 60);
  if (usable.length) return usable[0];
  return flagColors.find(c => c.toUpperCase() !== '#FFFFFF') || flagColors[0];
}

function _wrCountryBadgeStyle(country) {
  const colors = _wrFlagColors(country);
  if (!colors) return '';
  return `background:${_wrFlagBackgroundCSS(country, colors)};border-color:rgba(255,255,255,.35);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)`;
}




function _wrHexToRgb(h) {
  try { return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`; }
  catch(e) { return '75,207,250'; }
}

// mixes a hex color toward white by `amt` (0..1) — used to derive readable badge text
// color from a saturated accent hue, the same way the flat wr-tier-classified/regional
// CSS classes already lighten their base color for text (e.g. teal bg → pale teal text).
function _wrLighten(hex, amt) {
  try {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const mix = (c) => Math.round(c + (255 - c) * amt);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  } catch(e) { return hex; }
}

// [FIX 2026-07-29] Wires each classification's own hue (from _WR_TIER_KEY_COLORS) into the
// actual badge chip for tiers below the "grand" band (rank<60). Previously only the tooltip/
// card accent (tierColor) used these per-key colors — the visible badge chip itself only ever
// used the 3 flat generic band classes (wr-tier-elevated/classified/regional), so families that
// are meant to read as one color ladder (e.g. Spain's Gran Reserva > Reserva > Crianza, Italy's
// Gran Selezione > DOCG > DOC) instead all showed the same 1-2 generic band colors with no
// visible internal hierarchy. This returns an inline style that overrides the flat band
// background with a gradient + glow in the tier's own hue, with intensity scaled by rank so the
// top of each family reads visibly stronger/brighter than the tiers beneath it. Grand/legendary
// bands (rank>=60) are left untouched — they already have their own polished pulsing CSS and,
// per the 2cc–5cc fix, already agree with the badge's band color.
function _wrBadgeAccentStyle(tier) {
  if (!tier || !tier.key || tier.rank >= 60) return '';
  const hex = _WR_TIER_KEY_COLORS[tier.key];
  if (!hex) return '';
  const rgb = _wrHexToRgb(hex);
  // 0 at the bottom of the regional band (~rank 18) → 1 at the top of the elevated band (rank 59),
  // so the highest tier in any given family (e.g. Gran Reserva, rank 52) always renders
  // noticeably richer/brighter than the ones below it (Reserva 39, Crianza 27).
  const t = Math.max(0, Math.min(1, (tier.rank - 18) / 42));
  const bg1 = (0.10 + t * 0.30).toFixed(2);
  const bg2 = (bg1 * 0.4).toFixed(2);
  const borderA = (0.35 + t * 0.45).toFixed(2);
  const glowPx = (5 + t * 8).toFixed(0);
  const glowA = (0.12 + t * 0.42).toFixed(2);
  const textShadowA = (0.35 + t * 0.4).toFixed(2);
  const textColor = _wrLighten(hex, 0.3 + (1 - t) * 0.25); // lower-tier badges lean lighter/paler for legibility
  return `background:linear-gradient(135deg,rgba(${rgb},${bg1}),rgba(${rgb},${bg2}));border-color:rgba(${rgb},${borderA});box-shadow:0 0 ${glowPx}px rgba(${rgb},${glowA});color:${textColor};text-shadow:0 0 6px rgba(${rgb},${textShadowA})`;
}
