// looks up a vintage-year comment for one of the WR_NAME_TIPS wines — returns null when the
// wine isn't one of the 5, or the vintage isn't one of the covered iconic years. Returns
// {quote, why}: `quote` is the château-specific critic-score line, `why` is the shared
// growing-season note (same regional weather affected every château that year).
function _wrVintageTip(nameTipKey, vintage) {
  if (!nameTipKey) return null;
  const set = WR_VINTAGE_TIPS[nameTipKey];
  const y = String(vintage || '').trim();
  const quote = set && set[y];
  if (!quote) return null;
  return { quote, why: WR_VINTAGE_YEAR_WHY[y] || null };
}

// looks up WR_NAME_TIPS by product name (case-insensitive substring match, checked in
// declaration order — 'mouton' is listed before 'lafite' so "Mouton Rothschild" doesn't
// false-match the "rothschild" shared by both families).
function _wrNameTip(product) {
  const n = String(product || '').toLowerCase();
  for (const t of WR_NAME_TIPS) { if (t.test(n)) return t; }
  return null;
}

function _wrWineTier(r) {
  const classification = String(r[11] || '').toLowerCase();
  const name = String(r[1] || '').toLowerCase();
  const region = String(r[12] || '').toLowerCase();
  const hay = classification + ' ' + name; // combined text: classification-style phrases
  // (e.g. "1er Grand Cru Classé A") sometimes only appear in the name, not in a
  // dedicated classification column — this keeps detection working either way.
  for (const rule of WR_TIER_RULES) {
    if (rule.test(hay, name, region)) return rule;
  }
  return null;
}

// maps a tier's numeric rank to one of 5 prestige bands with matching CSS class.
// [FIX] no more generic prestige superlatives ("LEGENDARY" / "GRAND CRU" prefix) —
// only the wine's real classification (tier.label / tier.short, e.g. "Premier Cru
// Classé (1er Grand Cru)", "Grand Cru Classé", "DOCG", "AOC / AOP") is ever shown.
// The `cls` still selects which color band the card/badge/ribbon renders in.
function _wrTierVisual(tier) {
  if (!tier) return null;
  let cls;
  if (tier.rank >= 90) cls = 'wr-tier-legendary';
  else if (tier.rank >= 60) cls = 'wr-tier-grand';
  else if (tier.rank >= 46) cls = 'wr-tier-elevated';
  else if (tier.rank >= 30) cls = 'wr-tier-classified';
  else cls = 'wr-tier-regional';
  return { cls, key: tier.key, label: tier.label, short: tier.short, tipTitle: tier.tipTitle, rank: tier.rank };
}

// [FIX 2026-07-28] per-classification badge colors — the 5-band system above (legendary/
// grand/elevated/classified/regional) was built to rank Bordeaux/Burgundy cru classifications
// against each other, but it also lumps together appellation-level tags from totally different
// countries' systems (DOCG and DOC both landed in the same "elevated" blue, indistinguishable
// from each other; Crianza fell into the same gray as plain IGT/Vin de France even though it's
// a meaningful Spanish aging tier). This override map gives each classification its own color
// so e.g. AOC, DOC, DOCG, and Crianza badges are all visually distinct from one another, while
// unlisted keys (cru classifications, Grand Cru, etc.) still fall back to the prestige-band
// color from _wrTierColor's switch below.
// [FIX 2026-07-28 v2] Complete per-classification palette — every one of the 34 keys in
// WR_TIER_RULES now has its own explicit color (previously only 24/34 did; the other 10 —
// mainly the whole Bordeaux 1855 Cru Classé ladder from 2ème through Grand Cru Classé, plus
// Burgundy Premier Cru — silently fell back to the shared 5-band color and were therefore
// visually indistinguishable from each other and from unrelated systems, e.g. every Bordeaux
// cru from 2ème to Grand Cru Classé rendered the same purple as Vintage Port, and DOCG/Gran
// Selezione/VDP Grosses Gewächs all rendered the identical blue). Organized by classification
// system, each with its own hue family and an internal gradient that follows that system's own
// rank order, so no two keys anywhere in this map share a hex value (igt/igp are the sole
// deliberate exception — they're literally the same EU "IGP" designation under Italy's and
// France's respective national names).
const _WR_TIER_KEY_COLORS = {
  // ── Bordeaux 1855 Official Classification — gold ladder, brighter/lighter = higher rank ──
  firstgrowth: '#ffe066', // Premier Cru Classé / 1er Grand Cru — the pinnacle, brightest gold
  segcA:       '#ffd23f', // 1er Grand Cru Classé A
  segcB:       '#ffc61a', // 1er Grand Cru Classé B
  // [FIX 2026-07-29] 2ème–5ème Cru Classé removed from this override map — their rank (68–88)
  // falls in the "grand" prestige band, so the badge itself renders purple (.wr-tier-grand,
  // #c78aff) via _wrTierVisual's cls. Leaving them out here lets _wrTierColor's switch/cls
  // fallback supply that same purple, so the tooltip/card accent now matches the badge color
  // instead of the old gold that only matched the 1er/segcA/segcB band above.
  gcc:         '#b37300', // Grand Cru Classé (generic, e.g. St-Émilion) — deepest gold, lowest of this ladder

  // ── Bordeaux Cru Bourgeois — separate bronze family, distinct from the Cru Classé gold ──
  cbex: '#c9a66b', // Cru Bourgeois Exceptionnel
  cb:   '#a9855a', // Cru Bourgeois

  // ── Burgundy / Alsace / Champagne Grand Cru & Premier Cru — violet family ──
  gcru:   '#c78aff', // Grand Cru
  // [FIX 2026-07-30] VDP Grosses Gewächs (GG) recolored from blue (previously grouped with
  // VDP Erste Lage / Trocken as a generic dry-style tag) to violet — GG is a terroir-classified
  // Grosse Lage vineyard wine, Germany's analogue of Grand Cru, so it now shares this family's
  // hue instead of the unrelated blue quality-ladder band.
  gg:     '#b98aff', // VDP · Grosses Gewächs — violet, on par with Grand Cru
  '1ercru': '#a480e0', // Premier Cru (1er Cru) — one step below Grand Cru

  // ── Germany Prädikatswein ripeness ladder + VDP Erste Lage/Trocken dry-wine tags
  //    (Grosses Gewächs itself now lives in the violet Grand Cru family above) ──
  tba:      '#e6a817', // Trockenbeerenauslese — rarest/sweetest, deep honey amber
  eiswein:  '#8fd6ff', // Eiswein — icy blue
  ba:       '#ff6b81', // Beerenauslese — botrytis red-pink
  auslese:  '#ff9f6b', // Auslese — dessert-wine orange
  spatlese: '#5be0c4', // Spätlese — teal
  erste:    '#7bbcff', // VDP Erste Lage — lighter blue, Germany's Premier-Cru-equivalent vineyard tier
  // [NEW 2026-07-30] VDP.Ortswein/Gutswein — continue the Erste Lage blue family, dimming
  // further for each rung down the VDP pyramid (Grosse Lage > Erste Lage > Ortswein > Gutswein).
  ortswein: '#6aa0e0', // VDP.Ortswein — dimmer blue, one step below Erste Lage
  gutswein: '#5c88b8', // VDP.Gutswein — dimmest of the VDP family, entry-level estate wine
  kabinett: '#8ff0dc', // Kabinett — palest teal, lightest Prädikat
  // [NEW 2026-07-30] Qualitätswein (QbA) — one step below Kabinett on the legal ladder
  // (Kabinett is Prädikatswein's lightest rung; QbA sits below the Prädikat threshold
  // entirely), so it continues Kabinett's pale-teal family in a dustier, grayer tone.
  qualitatswein: '#7fa89c', // Qualitätswein (QbA) — dusty sage-teal, below Kabinett
  trocken:  '#9fb0d9', // Trocken (Dry) — dim slate-blue, deliberately below Erste Lage since it's a style tag, not a quality-ladder rank

  // ── Spain · Priorat DOQ + Rioja/Ribera aging classification — deeper/more saturated = higher rank ──
  priorat:     '#ff8a5c', // Priorat DOQ/DOCa — warm orange-red, on par with DOCG
  granreserva: '#ffa652', // Gran Reserva
  reserva:     '#ffc98a', // Reserva — lighter, one step below Gran Reserva
  crianza:     '#c9d94a', // Crianza — deliberately a different hue (chartreuse) from the orange Reserva/Gran Reserva pair

  // ── Portugal · Port categories — magenta/pink family ──
  vintageport: '#e666ff', // Vintage Port — brightest, most saturated magenta
  colheita:    '#e08fff', // Colheita Port
  lbv:         '#ff8fae', // Late Bottled Vintage — salmon-pink

  // ── Italy — blue/teal/gray family; deeper = higher rank within the DOCG-adjacent pair ──
  gransel: '#b8860b', // Chianti Classico Gran Selezione — DOCG sub-tier, deeper/darker gold than plain DOCG
  docg:    '#e6b800', // DOCG — top tier, gold
  // [FIX 2026-07-30] AOC/AOP is France's ceiling appellation guarantee — the same real-world
  // concept as DOCG, just under a different country's name (deliberate shared hex, same
  // exception already made for igt/igp below). Previously grouped with DOC as "purple,
  // middle tier", which wrongly treated France's top designation as equivalent to Italy's
  // mid-tier DOC rather than its top-tier DOCG.
  aoc:     '#e6b800', // AOC/AOP — gold, top tier (same real-world tier as DOCG)
  doc:     '#9b59d0', // DOC — purple, middle tier
  igt:     '#5b8def', // IGT — blue, third tier (same tier as IGP)

  // ── Spain/Italy regional + France/Italy table-wine tiers ──
  igp: '#5b8def', // Vin de Pays — blue, same tier as IGT
  // [NEW 2026-07-30] Landwein — Germany's regional-wine analogue of IGT/IGP, own hex in
  // the same blue family (not reusing igt/igp's shared hex, since Landwein is its own
  // distinct legal designation, not literally the same EU category under another name).
  landwein: '#4d8fcf', // Landwein — regional tier, same blue family as IGT/IGP
  vdf: '#6b9e7a', // Vin de France — dim green, lowest tier of all
  // [NEW 2026-07-30] Deutscher Wein — Germany's basic table-wine floor, ranked (and
  // colored) even dimmer than Vin de France since it historically carried no right to
  // state vintage/variety on the label at all.
  deutscherwein: '#5a8a68', // Deutscher Wein — darker/dimmer green, true bottom of the ladder
};

// Many top Bordeaux (and other) bottles carry a higher classification (Cru Classé,
// Grand Cru, etc.) while *also* being a legally-designated AOC/AOP wine. In that case
// the detail view stacks two ribbons: the higher classification on top (styled per its
// prestige band) and a plain "AOC / AOP" ribbon underneath it. This only fires when the
// primary tier outranks the plain AOC tier itself (rank 42) and the product name still
// explicitly mentions AOC/AOP — otherwise the single primary ribbon already says it.
function _wrSecondaryAocTag(r, primaryRawTier) {
  if (!primaryRawTier || primaryRawTier.rank <= 42) return null;
  const name = String(r[1] || '').toLowerCase();
  if (!/\baoc\b|\baop\b/.test(name)) return null;
  return { cls: 'wr-tier-classified', key: 'aoc', label: 'AOC / AOP', short: 'AOC', rank: 42 };
}

// [NEW] Italy's equivalent of _wrSecondaryAocTag above. DOCG has no sub-classification ranked
// above it in WR_TIER_RULES except Chianti Classico Gran Selezione (rank:44, key:'gransel') —
// a Gran Selezione wine is still, by law, DOCG underneath that higher sub-tier, the same
// relationship AOC/AOP has to Cru Classé/Grand Cru on the French side. Every other Italian tier
// (DOC, IGT, plain DOCG) already ranks at or below 42, so this only ever fires for gransel.
function _wrSecondaryDocgTag(r, primaryRawTier) {
  if (!primaryRawTier || primaryRawTier.rank <= 42) return null;
  const name = String(r[1] || '').toLowerCase();
  if (!/\bdocg\b/.test(name)) return null;
  return { cls: 'wr-tier-classified', key: 'docg', label: 'DOCG', short: 'DOCG', rank: 42 };
}

// [NEW] Spain's DOCa/DOQ secondary tag. The 'priorat' rule in WR_TIER_RULES (rank:55) already
// fires as the PRIMARY tier for Priorat wines — but Rioja is Spain's *other* (and only other)
// DOCa, the same top legal status as Priorat, and Rioja wines almost always match on their
// aging-tier rule instead (Gran Reserva/Reserva/Crianza), since the region check only ever
// tested for 'priorat'. This adds the missing case as a secondary ribbon — e.g. a Rioja Gran
// Reserva now also shows "Rioja DOCa" stacked underneath — the same pattern already used for
// AOC/DOCG above, without disturbing the more specific aging-tier badge as the primary one.
function _wrSecondaryDocaTag(r, primaryRawTier) {
  const region = String(r[12] || '').toLowerCase();
  if (region !== 'rioja' && region !== 'priorat') return null;
  if (primaryRawTier && primaryRawTier.key === 'priorat') return null; // already the primary badge
  const label = region === 'rioja' ? 'Rioja DOCa' : 'Priorat DOQ';
  const short = region === 'rioja' ? 'DOCA' : 'DOQ';
  return { cls: 'wr-tier-elevated', key: 'priorat', label, short, rank: 55 };
}

// [NEW 2026-07-28] tap-to-float tier info tip — opens a small colored tip box positioned
// absolutely under the tapped badge (wineTier ribbon or secondary AOC/AOP ribbon), so it
// overlays the content beneath rather than pushing the sheet layout down. Only one tip is
// open at a time; tapping the same badge again, tapping the other badge, or tapping anywhere
// else in the sheet closes it.
// [FIX 2026-07-29] Previously each tip's *wrapper* carried a hardcoded z-index
// (classification ribbon 30, secondary AOC ribbon 29, wine-name block 30) so whichever
// one happened to sit lower / earlier in the DOM lost the paint-order race against later
// .wr-boot-item siblings (title, grapes chart, barcode — each of those also silently
// becomes its own stacking context via the boot animation's permanent filter:blur(0), see
// note above WR_NAME_TIPS) and got visually buried under them. Fixed values can never
// cover every ordering once there's more than one tip source. Instead: whichever tip is
// opened gets its wrapper's z-index bumped to a value higher than any static block
// (500), and every wrapper's z-index is cleared back to its original CSS-driven value
// when its tip closes — so only the currently-open tip is ever elevated.
function _wrToggleTierTip(evt, badgeEl) {
  if (evt) evt.stopPropagation();
  const wrap = badgeEl.parentElement;
  const tip = wrap && wrap.querySelector('.wr-tier-tip');
  if (!tip) return;
  const willOpen = tip.style.display === 'none' || !tip.style.display;
  document.querySelectorAll('.wr-tier-tip').forEach(t => {
    if (t !== tip) t.style.display = 'none';
    if (t.parentElement) t.parentElement.style.zIndex = '';
  });
  tip.style.display = willOpen ? 'block' : 'none';
  wrap.style.zIndex = willOpen ? '5000' : '';
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.wr-tier-badge') && !e.target.closest('.wr-tier-tip') && !e.target.closest('[data-wr-tip-trigger]')) {
    // [NEW 2026-08-04] if the tip being closed here is a photo-pin tip currently showing its
    // EDIT form (not just the plain read view), tapping away should exit pin-edit-mode outright
    // too, same as the new-pin form's outside-tap handling above — see _wrExitPinEditMode doc.
    let closedAnEditingPin = false;
    document.querySelectorAll('.wr-tier-tip').forEach(t => {
      if (t.style.display === 'block' && t.classList.contains('wr-photo-pin-tip') && t.querySelector('#wr-pin-edit-ta')) closedAnEditingPin = true;
      t.style.display = 'none';
      if (t.parentElement) t.parentElement.style.zIndex = '';
    });
    if (closedAnEditingPin && typeof _wrExitPinEditMode === 'function') _wrExitPinEditMode();
  }
});
// [NEW 2026-08-04] photo-pin tip open/close — same open/close behavior as _wrToggleTierTip
// above (reused rather than duplicated: closes any other open tip, toggles this one), but
// then ALSO clamps the tip on-screen. Needed only for photo pins: unlike the other
// .wr-tier-tip triggers (which sit on wide badges near the sheet's own left/right edge), a
// pin can land anywhere on the photo panel. [FIX 2026-08-04] the tip now opens to the pin's
// RIGHT (vertically centered on it, via top:50%/left:calc(100% + 9px)) instead of centered
// underneath — a centered-below box could land mid-photo, get visually buried under the

         it now matches tierColor like the rest of the sheet. Wine type lives on the type
         badge chip above instead. Readouts count up on open. -->
    <div ${boot('rec-card-data')}--seg-color:${tierColor};position:relative;z-index:1">
      <div class="rec-data-cell">
        <div class="rec-data-cell-lbl" style="color:rgba(255,255,255,.5)">RETAIL · ราคาปลีก</div>
        <div class="rec-data-cell-val" style="color:rgba(255,255,255,.9);font-size:15px"><span class="wr-count-up" data-target="${retail == null ? '' : Number(retail)}">${fmtPrice(retail)}</span></div>
      </div>
      <div class="rec-data-cell">
        <div class="rec-data-cell-lbl" style="color:${tierColor}">WHOLESALE · 6 ขวด+</div>
        <div class="rec-data-cell-val" style="color:${tierColor};font-size:15px;text-shadow:0 0 10px rgba(${tierRgb},.5);position:relative;${_wrWholesaleDiscountParts(retail, wholesale6) ? 'padding-right:48px' : ''}">
          <span class="wr-count-up" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-target="${wholesale6 == null ? '' : Number(wholesale6)}">${fmtPrice(wholesale6)}</span>
          <span style="position:absolute;right:0;top:50%;transform:translateY(-50%);line-height:1">${_wrWholesaleDiscountBadgeHTML(retail, wholesale6, tierColor, tierRgb)}</span>
        </div>
        ${_wrWholesaleSavingsUnitDetail(retail, wholesale6) ? `<div class="rec-data-cell-unit" style="color:${tierColor}">${_wrWholesaleSavingsUnitDetail(retail, wholesale6)}</div>` : ''}
      </div>
    </div>
  `;
  return { html, tierColor, tierRgb, tierClsAttr };
}

// opens the full-detail overlay for a card — takes the index into _wrLastShown rather than
// a barcode, since duplicate barcodes exist in the sheet and would otherwise open the wrong row.
// [PERF 2026-07-29] the markup itself now comes from _wrGetOrBuildDetail (cache-first, built via
// the pure _wrBuildDetailHTML above) instead of being rebuilt inline here on every call — see the
// _wrDetailCache block near _wrLastShown for why. Everything below is purely DOM/animation
// orchestration: positioning the frame, swapping in the (usually already-built) markup, and
// kicking off the slide + deferred canvas/count-up animations.
function _wrOpenDetail(i, dir) {
  if (!_wrLastShown[i]) return;
  // [NEW 2026-08-04] pin edit-mode should only "survive" re-renders of the SAME record (the
  // ones add/move/delete themselves trigger) — switching to a different product's sheet always
  // starts with editing off, so it doesn't stay silently armed on a photo the person swiped away from.
  if (i !== _wrCurrentDetailIndex) _wrPinEditModeIdx = -1;
  _wrCurrentDetailIndex = i;
  _wrPruneDetailCache(i);
  const built = _wrGetOrBuildDetail(i);
  if (!built) return;
  const { html, tierColor, tierRgb, tierClsAttr } = built;

  const body = document.getElementById('wr-detail-body');
  const frame = document.getElementById('wr-detail-frame');
  if (!body) return;

  // [FIX 2026-07-29] jump the frame to its off-screen starting position (or reset any leftover
  // transform, for a non-swipe open) BEFORE the body.innerHTML swap below, and let that swap run
  // inside a requestAnimationFrame instead of inline in this same task. This still matters even
  // now that the swap is normally a cache hit: it keeps the off-screen jump's own paint decoupled
  // from whatever this task does next, so the slide always starts from a frame the browser has
  // actually committed rather than one still queued behind other style writes.
  if (frame && dir) {
    frame.style.transition = 'none';
    frame.style.transform = `translate3d(${dir > 0 ? '16%' : '-16%'},0,0)`;
    frame.style.opacity = '0';
  } else if (frame) {
    frame.style.transition = '';
    frame.style.transform = '';
    frame.style.opacity = '';
  }

  requestAnimationFrame(() => {
  _wrReleaseCanvasObservers(body);
  if (frame) {
    frame.style.setProperty('--wr-detail-accent', tierColor);
    frame.style.setProperty('--wr-detail-accent-rgb', tierRgb);
    frame.setAttribute('data-wr-tier', tierClsAttr);
  }
  body.innerHTML = html;
  // barcode may not have its photo cached locally yet (e.g. first time this device has seen
  // this product) — same async cloud fetch-and-patch the result-card list already uses.
  if (typeof _patchPendingProductPhotos === 'function') _patchPendingProductPhotos([body]);
  document.getElementById('wr-detail-modal').style.display = 'flex';
  // [FIX 2026-07-29] every other modal in this file (login screen, cloud-debug panel, shelf
  // picker, etc.) locks document/body overflow while open — this one never did. Being
  // position:fixed kept it visually in place, but the page underneath was still scrollable,
  // so a swipe/momentum touch that wasn't fully captured by the modal's own gesture handling
  // could leak through and scroll the background page, whose native scrollbar would then
  // flash into view — exactly what showed up intermittently while swiping between products.
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  body.scrollTop = 0;
  _wrInitDetailSwipe();
  _wrUpdateDetailNavButtons();
  _wrRenderPeekCards();
  _wrResetPeek(false);

  // slide-in animation when arriving via swipe navigation (dir: +1 = came from next, -1 = came from prev).
  // The off-screen starting position was already committed synchronously before this rAF-deferred
  // rebuild ran (see top of function), and this whole block is itself already executing inside a
  // requestAnimationFrame callback, so a single nested rAF here is enough to guarantee that
  // off-screen state got its own paint before animating back to rest — no need to re-set it.
  if (frame && dir) {
    requestAnimationFrame(() => {
      if (!frame) return;
      frame.style.transition = 'transform .22s cubic-bezier(.22,.8,.32,1), opacity .22s ease';
      frame.style.transform = 'translate3d(0,0,0)';
      frame.style.opacity = '1';
      const clear = () => { if (frame) frame.style.transition = ''; frame.removeEventListener('transitionend', clear); };
      frame.addEventListener('transitionend', clear);
      setTimeout(clear, 260); // fallback in case transitionend doesn't fire
    });
  }

  // defer the expensive canvas/pie-chart rendering until after the slide-in has started painting,
  // so it doesn't compete with the transition for the same frame and cause visible jank
  requestAnimationFrame(() => {
    _wrAnimateGrapePie(body);
    if (typeof renderBarcodeCanvases === 'function') renderBarcodeCanvases(body);
    _wrDecodeSysId(body);
    _wrCountUpPrices(body);
    _wrPrefetchNeighbors(i);
  });
  }); // end requestAnimationFrame (kept for the slide-timing paint guarantee; body.innerHTML swap above is now normally just a cache hit)
}

// ── sysID decode-in — the identifier resolves out of scrambled noise characters instead of
// just fading in; reads as a terminal locking onto a signal rather than a static label ──────
const _wrDecodeGlyphs = '01ABCDEFΞΣΩ#*+-·';
function _wrDecodeSysId(scope) {
  const el = scope.querySelector('.wr-decode-text');
  if (!el) return;
  const final = el.getAttribute('data-decode-final') || el.textContent;
  const dur = 420;
  const start = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - start) / dur);
    let out = '';
    for (let idx = 0; idx < final.length; idx++) {
      const ch = final[idx];
      if (ch === ' ' || ch === '·' || ch === '/') { out += ch; continue; }
      const revealAt = (idx / final.length) * 0.7;
      if (p >= revealAt + 0.25) out += ch;
      else out += _wrDecodeGlyphs[Math.floor(Math.random() * _wrDecodeGlyphs.length)];
    }
    el.textContent = out;
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = final;
  }
  requestAnimationFrame(frame);
}

// ── price count-up — retail/wholesale readouts spin up to their final value instead of
// simply appearing, like a scale/meter settling on a reading ──────────────────────────────
function _wrCountUpPrices(scope) {
  const els = scope.querySelectorAll('.wr-count-up');
  els.forEach(el => {
    const raw = el.getAttribute('data-target');
    if (raw === '' || raw == null) return;
    const target = Number(raw);
    if (!isFinite(target)) return;
    const dur = 700;
    const start = performance.now();
    const from = target * 0.1;
    function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = from + (target - from) * eased;
      el.textContent = val.toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' บาท';
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' บาท';
    }
    requestAnimationFrame(tick);
  });
}

// ── swipe/arrow navigation between products in the detail sheet ──────────────
let _wrCurrentDetailIndex = -1;
// [FIX] rapid double-taps (the normal way to browse several products in a row) could fire
// _wrDetailNav a second time before the first call's content-swap had happened — the second
// call still read the *old* _wrCurrentDetailIndex (not yet updated), so it could target the
// wrong product and stomp on the in-flight transition, showing as a flicker/resize + jank.
// This lock makes sure only one nav transition is ever in flight at a time.
let _wrNavBusy = false;

function _wrUpdateDetailNavButtons() {
  // arrow buttons were removed in favor of swipe-only navigation; kept as a no-op
  // so any stray calls elsewhere stay harmless.
}

// ── card-stack peek: the prev/next product glimpsed, blurred, on each side ───
function _wrRenderPeekCards() {
  const prevEl = document.getElementById('wr-peek-prev');
  const nextEl = document.getElementById('wr-peek-next');
  if (!prevEl || !nextEl) return;
  const mk = (r) => r ? `<div class="wr-peek-card-title">${_wrEsc(String(r[1] || ''))}</div>` : '';
  prevEl.innerHTML = mk(_wrLastShown[_wrCurrentDetailIndex - 1]);
  nextEl.innerHTML = mk(_wrLastShown[_wrCurrentDetailIndex + 1]);
}

// dx: live drag offset (px) of the main frame, or 0 to show the idle resting peek.
function _wrUpdatePeek(dx) {
  const prevEl = document.getElementById('wr-peek-prev');
  const nextEl = document.getElementById('wr-peek-next');
  if (!prevEl || !nextEl) return;
  const hasPrev = _wrCurrentDetailIndex > 0;
  const hasNext = _wrCurrentDetailIndex < _wrLastShown.length - 1;
  const progressFor = (want) => Math.max(0, Math.min(Math.abs(dx), 160)) / 160 * (want ? 1 : 0);
  const pPrev = hasPrev ? progressFor(dx > 0) : 0;
  const pNext = hasNext ? progressFor(dx < 0) : 0;
  // [FIX 2026-07-29] blur radius used to interpolate every frame here (6 - progress*4). Unlike
  // transform/opacity, filter:blur is not GPU-compositor-only — changing its value forces a
  // repaint/re-rasterize of the element on every single rAF tick, which is what showed up as
  // stutter while dragging. The blur is now left at its fixed CSS value (6px) for the whole
  // drag; only transform + opacity (cheap, composited) are updated per frame.
  prevEl.style.opacity = hasPrev ? String(.28 + pPrev * .5) : '0';
  prevEl.style.transform = `translate3d(calc(-50% - ${46 - pPrev * 20}%),-50%,0) scale(${.86 + pPrev * .08})`;
  nextEl.style.opacity = hasNext ? String(.28 + pNext * .5) : '0';
  nextEl.style.transform = `translate3d(calc(-50% + ${46 - pNext * 20}%),-50%,0) scale(${.86 + pNext * .08})`;
}

function _wrResetPeek(animate) {
  const prevEl = document.getElementById('wr-peek-prev');
  const nextEl = document.getElementById('wr-peek-next');
  [prevEl, nextEl].forEach((el) => { if (el) el.style.transition = animate ? '' : 'none'; });
  _wrUpdatePeek(0);
  if (!animate) {
    requestAnimationFrame(() => { [prevEl, nextEl].forEach((el) => { if (el) el.style.transition = ''; }); });
  }
}

function _wrDetailNav(dir) {
  if (_wrNavBusy) return;
  if (_wrCurrentDetailIndex < 0 || !_wrLastShown.length) return;
  const next = _wrCurrentDetailIndex + dir;
  if (next < 0 || next >= _wrLastShown.length) { _wrDetailBounce(dir); return; }
  const frame = document.getElementById('wr-detail-frame');
  if (!frame) { _wrOpenDetail(next, dir); return; }
  _wrNavBusy = true;
  // slide the current card the rest of the way off-screen, then swap content and slide the new one in.
  // Wait for transitionend (with a safety-net timeout) instead of a hand-tuned setTimeout, so the
  // content swap always lines up with the actual paint instead of drifting and causing a jump/jerk.
  frame.style.transition = 'transform .16s cubic-bezier(.4,0,.2,1), opacity .16s ease';
  frame.style.transform = `translate3d(${dir > 0 ? '-16%' : '16%'},0,0)`;
  frame.style.opacity = '0';
  _wrUpdatePeek(dir > 0 ? -160 : 160);
  let done = false;
  const swap = () => { if (done) return; done = true; frame.removeEventListener('transitionend', swap); _wrNavBusy = false; _wrOpenDetail(next, dir); };
  frame.addEventListener('transitionend', swap);
  setTimeout(swap, 180);
}

function _wrDetailBounce(dir) {
  const frame = document.getElementById('wr-detail-frame');
  if (!frame) return;
  frame.style.transition = 'transform .12s cubic-bezier(.4,0,.2,1)';
  frame.style.transform = `translate3d(${dir > 0 ? '-12px' : '12px'},0,0)`;
  setTimeout(() => {
    if (!frame) return;
    frame.style.transform = 'translate3d(0,0,0)';
    setTimeout(() => { frame.style.transition = ''; }, 140);
  }, 90);
  _wrResetPeek(true);
}

// [FIX] rewritten on touchstart/touchmove/touchend to match every other gesture handler in this
// file (shelf swipe, planogram cells, recActionSheet, etc). The previous version used pointerdown/
// pointermove/pointerup + setPointerCapture — Pointer Events never reliably fired inside this app's
// WebView, so neither the drag-swipe nor its double-tap fallback ever ran. Touch events are what
// actually works here, confirmed by every existing gesture in the codebase using them exclusively.
function _wrInitDetailSwipe() {
  const frame = document.getElementById('wr-detail-frame');
  const modal = document.getElementById('wr-detail-modal');
  if (!frame || frame._wrSwipeInit) return;
  frame._wrSwipeInit = true;
  // listen on the modal backdrop, not just the frame: the frame sits inset 10px from the
  // screen edge (see #wr-detail-modal's padding), so a touch starting in that outer strip —
  // exactly where Samsung/Android edge-gesture navigation activates — lands on the backdrop,
  // never reaches the frame's own listeners, and gets handed to the OS as a back-swipe,
  // kicking the user out of the app. The backdrop spans true edge-to-edge (inset:0), so
  // listening there (plus its touch-action:pan-y) claims that zone for the page instead.
  const target = modal || frame;

  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, horizontal = false, decided = false;
  // double-tap left/right-edge fallback — swipe can be unreliable depending on the device/browser,
  // so a quick double-tap on either half of the sheet steps to the previous/next product too,
  // the same pattern already used for shelf navigation.
  let lastTapTime = 0, lastTapSide = null, lastTapX = 0, lastTapY = 0;

  target.addEventListener('touchstart', (e) => {
    // exclude real interactive controls (close button, copy-barcode span, etc.) —
    // but NOT the modal backdrop itself: #wr-detail-modal carries its own onclick
    // (to close on backdrop tap), and since it's an ancestor of every element in the
    // sheet, closest('[onclick]') matched it for every single touch, so this guard
    // fired unconditionally and swipe-drag never got a chance to start.
    const interactive = e.target.closest && e.target.closest('button,[onclick],a,canvas');
    if (interactive && interactive !== modal) return;
    if (_wrNavBusy || _wrLastShown.length < 2 || e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; dx = 0; dy = 0; dragging = true; horizontal = false; decided = false;
    frame.style.transition = 'none';
    // [FIX 2026-07-29] the peek cards' CSS rule carries its own transition (transform/opacity/
    // filter .16s ease) for the idle "settle" animation. Left on during an active drag, every
    // single touchmove call to _wrUpdatePeek() re-targets that transition instead of snapping
    // straight to the finger's position — with touchmove firing far more often than every
    // 160ms, the peek cards perpetually chase a moving target and never catch up, which reads
    // as laggy/rubber-banding rather than 1:1 tracking. Turning the transition off for the
    // duration of the drag (restored on release by _wrResetPeek/_wrOpenDetail) fixes that.
    const peekPrev = document.getElementById('wr-peek-prev');
    const peekNext = document.getElementById('wr-peek-next');
    if (peekPrev) peekPrev.style.transition = 'none';
    if (peekNext) peekNext.style.transition = 'none';
  }, { passive: true });

  // [FIX 2026-07-29] batch the drag's style writes to one rAF tick per rendered frame instead
  // of one per touchmove event — touchmove can fire faster than the display refreshes, so
  // writing frame.style.transform/opacity + _wrUpdatePeek() straight in the handler queued more
  // style work than the browser could paint, which is what showed up as stutter during the drag.
  let _wrDragRafPending = false;
  target.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const t = e.touches[0];
    dx = t.clientX - startX; dy = t.clientY - startY;
    if (!decided) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        horizontal = true; decided = true;
      } else if (Math.abs(dy) > 8) {
        decided = true; // vertical intent — let native scroll of #wr-detail-body handle it
        dragging = false;
        return;
      }
    }
    if (horizontal && !_wrDragRafPending) {
      _wrDragRafPending = true;
      requestAnimationFrame(() => {
        _wrDragRafPending = false;
        if (!dragging || !horizontal) return;
        const abs = Math.abs(dx);
        const damped = abs > 120 ? (dx > 0 ? 1 : -1) * (120 + (abs - 120) * 0.35) : dx;
        frame.style.transform = `translate3d(${damped}px,0,0)`;
        frame.style.opacity = String(Math.max(1 - abs / 480, .55));
        _wrUpdatePeek(damped);
      });
    }
  }, { passive: true });

  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if (horizontal && Math.abs(dx) > 60) {
      const dir = dx < 0 ? 1 : -1; // dragged left → next product, dragged right → previous
      const nextIndex = _wrCurrentDetailIndex + dir;
      if (nextIndex < 0 || nextIndex >= _wrLastShown.length) {
        _wrDetailBounce(dir);
      } else {
        // finish the release at the card's current dragged position, then ease it the rest of the
        // way off-screen and swap on transitionend (falling back to a timeout) so the swap always
        // lines up with the paint instead of firing on a fixed clock and looking jerky.
        _wrNavBusy = true;
        frame.style.transition = 'transform .16s cubic-bezier(.4,0,.2,1), opacity .16s ease';
        frame.style.transform = `translate3d(${dir > 0 ? '-16%' : '16%'},0,0)`;
        frame.style.opacity = '0';
        _wrUpdatePeek(dir > 0 ? -160 : 160);
        let done = false;
        const swap = () => { if (done) return; done = true; frame.removeEventListener('transitionend', swap); _wrNavBusy = false; _wrOpenDetail(nextIndex, dir); };
        frame.addEventListener('transitionend', swap);
        setTimeout(swap, 180);
      }
    } else if (!horizontal && t && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      // this was a tap, not a drag — check if it's the second tap of a double-tap on the
      // same left/right half within the window, and if so step to that product.
      const rect = frame.getBoundingClientRect();
      const side = (t.clientX - rect.left) < rect.width / 2 ? 'l' : 'r';
      const now = Date.now();
      const isDouble = (now - lastTapTime < 320) && lastTapSide === side &&
        Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 30;
      if (isDouble) {
        lastTapTime = 0; lastTapSide = null;
        _wrDetailNav(side === 'l' ? -1 : 1);
      } else {
        lastTapTime = now; lastTapSide = side; lastTapX = t.clientX; lastTapY = t.clientY;
      }
    } else {
      frame.style.transition = 'transform .18s cubic-bezier(.4,0,.2,1), opacity .18s ease';
      frame.style.transform = 'translate3d(0,0,0)';
      frame.style.opacity = '1';
      _wrResetPeek(true);
      setTimeout(() => { if (frame) frame.style.transition = ''; }, 200);
    }
    horizontal = false;
  };
  target.addEventListener('touchend', endDrag, { passive: true });
  target.addEventListener('touchcancel', endDrag, { passive: true });
}

// tapped from the "Producer" row in the product detail sheet — since producer (r[9]) is the
// shared key between a chateau's First Label / Second Label / Related Cuvee rows, searching by
// that exact producer name surfaces every sibling wine together, which is how you see which
// First Label a given Second Label belongs to (and vice versa).
function _wrSearchByProducer(name) {
  _wrCloseDetail();
  _wrTypeFilters.clear();
  _wrCountryFilters.clear();
  _wrRegionFilters.clear();
  _wrGrapeFilters.clear();
  _wrVintageFilters.clear();
  _wrTierFilters.clear();
  _wrLabelTierFilters.clear();
  const inputEl = document.getElementById('wholesale-search-input');
  if (inputEl) { inputEl.value = name; _wrUpdateSearchIcon(); }
  renderWholesaleResults();
}

function _wrCloseDetail() {
  const modal = document.getElementById('wr-detail-modal');
  if (modal) modal.style.display = 'none';
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
  const frame = document.getElementById('wr-detail-frame');
  if (frame) { frame.style.transition = ''; frame.style.transform = ''; frame.style.opacity = ''; }
  _wrNavBusy = false;
  const prevEl = document.getElementById('wr-peek-prev');
  const nextEl = document.getElementById('wr-peek-next');
  [prevEl, nextEl].forEach((el) => { if (el) { el.style.opacity = '0'; el.style.transition = ''; } });
  _wrCurrentDetailIndex = -1;
  _wrUpdateDetailNavButtons();
}

function _wrCopyBarcode(bc) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(bc).then(() => { if (typeof showToast === 'function') showToast('คัดลอกบาร์โค้ดแล้ว'); }).catch(() => {});
  }
}

function _wrCopyName(name) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(name).then(() => { if (typeof showToast === 'function') showToast('คัดลอกชื่อไวน์แล้ว'); }).catch(() => {});
  }
}

async function _wrDecodeScan(input) {
  const file = input.files[0]; if (!file) return;
  input.value = '';
  if (typeof showToast === 'function') showToast('กำลังอ่านบาร์โค้ด...');
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await new Promise(r => { img.onload = r; img.onerror = r; });
    const code = await _fastDecode(img);
    URL.revokeObjectURL(url);
    if (code) {
      const inp = document.getElementById('wholesale-search-input');
      if (inp) { inp.value = code; renderWholesaleResults(); _wrUpdateSearchIcon(); }
      if (typeof showToast === 'function') showToast('ค้นหา: ' + code);
    } else {
      if (typeof showToast === 'function') showToast('ไม่พบบาร์โค้ด — ถ่ายใกล้ขึ้น', 'err');
    }
  } catch (e) {
    URL.revokeObjectURL(url);
    if (typeof showToast === 'function') showToast('อ่านภาพไม่ได้: ' + e.message, 'err');
  }
}

</script>
<script>
// ── เปิดแอป: เข้าหน้าค้นหาทันที ─────────────────────────────────────────────────
(function () {
  // xlsx (นำเข้าราคาใหม่) กับ zxing (ค้นด้วยรูปบาร์โค้ด) ใหญ่และใช้นานๆ ที — โหลดตอนกดใช้เท่านั้น ไม่ถ่วงตอนเปิดแอป
  const _libs = {
    xlsx: ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
    zxing: ['https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/umd/index.min.js',
            'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js']
  };
  function _loadScript(src) {
    return new Promise((res, rej) => {
      const el = document.createElement('script');
      el.src = src; el.onload = res; el.onerror = () => rej(new Error('โหลดไลบรารีไม่ได้ — ต้องต่ออินเทอร์เน็ต'));
      document.head.appendChild(el);
    });
  }
  async function _ensure(name, probe) {
    if (probe()) return;
    for (const src of _libs[name]) await _loadScript(src);
  }
  const _origUpload = _wrHandleUpload, _origScan = _wrDecodeScan;
  window._wrHandleUpload = async function (input) {
    try { await _ensure('xlsx', () => typeof XLSX !== 'undefined'); }
    catch (e) { showToast(e.message, 'err'); if (input) input.value = ''; return; }
    return _origUpload.call(this, input);
  };
  window._wrDecodeScan = async function (input) {
    try { await _ensure('zxing', () => typeof ZXingBrowser !== 'undefined' || window.ZXing); }
    catch (e) { showToast(e.message, 'err'); if (input) input.value = ''; return; }
    return _origScan.call(this, input);
  };
  // หน้าไวน์คือตัวแอป — ไม่มีหน้าอื่นให้กลับไป จึงไม่ปิด (ปุ่ม × ซ่อนด้วย CSS ด้านบนแล้ว)
  window.closeWholesaleModal = function () {};
  openWholesaleModal();
})();
</script>
